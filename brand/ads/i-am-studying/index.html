<script type="module">
import * as THREE from "three";

const TL = await (await fetch("tl.json")).json();
const W = 720, H = 1280;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const mix = (a, b, x) => a + (b - a) * x;
const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
function rng(seed) { return () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646; }

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 200);
const hemi = new THREE.HemisphereLight("#ffffff", "#334", 0.8);
const sun = new THREE.DirectionalLight("#fff", 2.2);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 0.5, far: 60 });
sun.shadow.bias = -0.0005;
const lamp = new THREE.PointLight("#ffcf7a", 0, 14, 1.4);
lamp.castShadow = true;
scene.add(hemi, sun, sun.target, lamp);

// ---------- builders ----------
const mats = new Map();
const mat = (c, extra = {}) => { const k = c + JSON.stringify(extra); if (!mats.has(k)) mats.set(k, new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, ...extra })); return mats.get(k); };
function box(g, w, h, d, c, x, y, z, extra) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof c === "string" ? mat(c, extra) : c);
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; g.add(m); return m;
}
function tex(w, h, draw) {
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  draw(cv.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
function plane(g, w, h, t, x, y, z, ry = 0, emissive = false) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), emissive ? new THREE.MeshBasicMaterial({ map: t, toneMapped: false }) : new THREE.MeshStandardMaterial({ map: t, roughness: 0.9 }));
  m.position.set(x, y, z); m.rotation.y = ry; g.add(m); return m;
}
// A blocky person. pose: stand | sit | lie. Returns parts for animation.
function person(g, o) {
  const p = new THREE.Group(); g.add(p);
  const { shirt = "#e0a030", pants = "#2f4c7a", skin = "#c98c5a", hair = "#3b2414" } = o;
  const legs = new THREE.Group(); p.add(legs);
  const sit = o.pose === "sit";
  for (const s of [-0.13, 0.13]) {
    if (sit) { box(legs, 0.22, 0.22, 0.6, pants, s, 0.55, 0.25); box(legs, 0.22, 0.5, 0.22, pants, s, 0.25, 0.48); }
    else box(legs, 0.22, 0.8, 0.22, pants, s, 0.4, 0);
  }
  const torso = box(p, 0.56, 0.7, 0.34, shirt, 0, sit ? 1.0 : 1.15, 0);
  const armL = new THREE.Group(), armR = new THREE.Group();
  armL.position.set(-0.38, sit ? 1.3 : 1.45, 0); armR.position.set(0.38, sit ? 1.3 : 1.45, 0);
  box(armL, 0.18, 0.62, 0.2, shirt, 0, -0.3, 0); box(armR, 0.18, 0.62, 0.2, shirt, 0, -0.3, 0);
  box(armL, 0.16, 0.14, 0.16, skin, 0, -0.66, 0); box(armR, 0.16, 0.14, 0.16, skin, 0, -0.66, 0);
  p.add(armL, armR);
  const head = new THREE.Group(); head.position.set(0, sit ? 1.62 : 1.77, 0); p.add(head);
  box(head, 0.46, 0.46, 0.46, skin, 0, 0, 0);
  box(head, 0.5, 0.14, 0.5, hair, 0, 0.22, 0); box(head, 0.5, 0.3, 0.12, hair, 0, 0.08, -0.2);
  box(head, 0.06, 0.06, 0.02, "#1a1a1a", -0.1, 0.03, 0.235); box(head, 0.06, 0.06, 0.02, "#1a1a1a", 0.1, 0.03, 0.235);
  p.position.set(o.x ?? 0, o.y ?? 0, o.z ?? 0); p.rotation.y = o.ry ?? 0;
  return { p, armL, armR, head, torso };
}
function tree(g, x, z, s = 1, c = "#4f9a3c") {
  box(g, 0.35 * s, 1.4 * s, 0.35 * s, "#6b4a2b", x, 0.7 * s, z);
  box(g, 1.6 * s, 1.2 * s, 1.6 * s, c, x, 1.9 * s, z);
  box(g, 1.1 * s, 0.8 * s, 1.1 * s, c, x + 0.2 * s, 2.7 * s, z - 0.1 * s);

  c.strokeStyle = accent; c.beginPath(); c.arc(w / 2, 180, 36, -Math.PI / 2, Math.PI); c.stroke();

  c.fillStyle = "#ff4d6d"; c.fillRect(158, 214, 12, 10);

  c.strokeStyle = "#d3f05a"; c.setLineDash([8, 6]); c.lineWidth = 3; c.strokeRect(30, 46, 260, 78); c.setLineDash([]);

    c.fillStyle = "#d3f05a"; c.font = "bold 24px sans-serif"; c.fillText("✓ 38 reels ready", 160, 92);

  }

  const pressed = active && lt > PRESS && lt < PRESS + 0.18;
  c.fillStyle = pressed ? "#a9c23f" : "#d3f05a"; c.fillRect(100, 138, 120, 36);
  c.fillStyle = "#0f1d18"; c.font = "bold 17px sans-serif"; c.fillText(done ? "Watch ▶" : "Upload", 160, 162);
  if (active && lt > PRESS && lt < PRESS + 0.6) { const r = (lt - PRESS) / 0.6; c.strokeStyle = `rgba(211,240,90,${1 - r})`; c.lineWidth = 4; c.beginPath(); c.arc(170, 158, 10 + r * 60, 0, Math.PI * 2); c.stroke(); }
  if (active && !done) { // cursor
    const k = ease((lt - 0.15) / 0.85), x = mix(285, 172, k), y = mix(195, 160, k), sc = pressed ? 0.85 : 1;
    c.save(); c.translate(x, y); c.scale(sc, sc); c.fillStyle = "#fff"; c.strokeStyle = "#000"; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 22); c.lineTo(6, 17); c.lineTo(10, 26); c.lineTo(14, 24); c.lineTo(10, 15); c.lineTo(17, 15); c.closePath(); c.fill(); c.stroke(); c.restore();
  }
  laptopTex.needsUpdate = true;
}
drawLaptop(0, false);
const monitorTex = tex(320, 200, (c, w, h) => {
  c.fillStyle = "#f4f4f1"; c.fillRect(0, 0, w, h);
  c.fillStyle = "#333"; c.font = "bold 16px sans-serif"; c.fillText("Q3-report.pdf", 14, 26);
  c.fillStyle = "#999"; c.font = "12px sans-serif"; c.fillText("page 1 of 80", 220, 26);
  for (let i = 0; i < 9; i++) { c.fillStyle = "#c9c9c4"; c.fillRect(14, 46 + i * 16, 140 + ((i * 37) % 140), 6); }

const windowTex = (night) => tex(256, 256, (c, w, h) => {
  const gr = c.createLinearGradient(0, 0, 0, h);
  if (night) { gr.addColorStop(0, "#0b1530"); gr.addColorStop(1, "#1d2c55"); } else { gr.addColorStop(0, "#8fc6ef"); gr.addColorStop(1, "#d8eefc"); }
  c.fillStyle = gr; c.fillRect(0, 0, w, h);
  const r = rng(9);
  for (let i = 0; i < 9; i++) {
    const bx = i * 30 - 6, bh = 70 + r() * 120;
    c.fillStyle = night ? "#121a33" : "#a9bccb"; c.fillRect(bx, h - bh, 26, bh);
    if (night) for (let y = h - bh + 8; y < h - 6; y += 14) for (let x = bx + 4; x < bx + 22; x += 8) if (r() > 0.55) { c.fillStyle = "#f6c95c"; c.fillRect(x, y, 4, 6); }
  }
  c.strokeStyle = "#e8e2d6"; c.lineWidth = 10; c.strokeRect(0, 0, w, h); c.beginPath(); c.moveTo(w / 2, 0); c.lineTo(w / 2, h); c.moveTo(0, h / 2); c.lineTo(w, h / 2); c.stroke();
});
const boardTex = tex(512, 256, (c, w, h) => {
  c.fillStyle = "#2f5a3e"; c.fillRect(0, 0, w, h); c.strokeStyle = "#8a6438"; c.lineWidth = 16; c.strokeRect(0, 0, w, h);
  c.fillStyle = "#f2f2ea"; c.font = "bold 44px serif"; c.fillText("UNIT 3 EXAM", 40, 70);
  c.font = "28px serif"; c.fillText("1) Population or sample?", 40, 130); c.fillText("2) Name the method.", 40, 175);
});
const paperTex = tex(256, 320, (c, w, h) => {
  c.fillStyle = "#fbfbf6"; c.fillRect(0, 0, w, h);
  for (let i = 0; i < 9; i++) { c.fillStyle = "#cfd3d8"; c.fillRect(20, 120 + i * 20, 150, 5); }
  c.strokeStyle = "#e0262c"; c.lineWidth = 8; c.beginPath(); c.arc(170, 70, 50, 0, Math.PI * 2); c.stroke();
  c.fillStyle = "#e0262c"; c.font = "bold 58px serif"; c.textAlign = "center"; c.fillText("A+", 170, 90);
});

// ---------- sets ----------
const sets = {};
const mk = (name) => { const g = new THREE.Group(); g.visible = false; scene.add(g); sets[name] = g; return g; };

// Room shell (shared by indoor shots); wall colors restyled per shot.

const floorM = new THREE.MeshStandardMaterial({ color: "#8a5a34", roughness: 0.9 });
const wallM = new THREE.MeshStandardMaterial({ color: "#2b3a5c", roughness: 0.95 });
box(room, 12, 0.2, 12, floorM, 0, -0.1, 0);
for (let i = -6; i < 6; i += 0.6) box(room, 0.02, 0.01, 12, "#6e4627", i, 0.005, 0);
box(room, 12, 6, 0.2, wallM, 0, 3, -3);
box(room, 0.2, 6, 12, wallM, -4, 3, 3);
const winNight = windowTex(true), winDay = windowTex(false);
const win = plane(room, 2.2, 2.2, winNight, 1.2, 2.8, -2.88, 0, true);

// Desk at night (shots: night, upload)
const deskSet = mk("desk");
box(deskSet, 2.4, 0.12, 1.1, "#9a6b3f", 0, 1.0, -1.9);
for (const [x, z] of [[-1.1, -2.35], [1.1, -2.35], [-1.1, -1.45], [1.1, -1.45]]) box(deskSet, 0.1, 1.0, 0.1, "#7a5230", x, 0.5, z);
box(deskSet, 0.6, 0.08, 0.6, "#3a3a3a", 0, 0.6, -0.8); box(deskSet, 0.6, 0.7, 0.08, "#3a3a3a", 0, 0.95, -0.5); box(deskSet, 0.08, 0.6, 0.08, "#222", 0, 0.3, -0.8);
const lampG = new THREE.Group(); deskSet.add(lampG);
box(lampG, 0.3, 0.05, 0.3, "#222", -0.9, 1.08, -2.1); box(lampG, 0.05, 0.6, 0.05, "#222", -0.9, 1.4, -2.1);
box(lampG, 0.34, 0.18, 0.3, "#e3b23c", -0.8, 1.7, -2.0, { emissive: "#7a5410" });
const stack = new THREE.Group(); stack.position.set(0.55, 1.06, -1.95); deskSet.add(stack);
{ const r = rng(4); for (let i = 0; i < 46; i++) box(stack, 0.62, 0.045, 0.82, i % 7 === 0 ? "#f2e9c9" : "#f7f7f2", (r() - 0.5) * 0.06, i * 0.05 + 0.02, (r() - 0.5) * 0.06).rotation.y = (r() - 0.5) * 0.12; }
const laptop = new THREE.Group(); laptop.position.set(-0.25, 1.06, -1.8); deskSet.add(laptop);
box(laptop, 0.9, 0.04, 0.6, "#b9bec4", 0, 0.02, 0);
const lid = new THREE.Group(); lid.position.set(0, 0.04, -0.3); laptop.add(lid);
box(lid, 0.9, 0.58, 0.03, "#b9bec4", 0, 0.29, 0); plane(lid, 0.84, 0.52, laptopTex, 0, 0.29, 0.02, 0, true); lid.rotation.x = -0.2;
const phoneDesk = new THREE.Group(); phoneDesk.position.set(0.45, 1.08, -1.45); phoneDesk.rotation.x = -Math.PI / 2 + 0.5; deskSet.add(phoneDesk);
box(phoneDesk, 0.3, 0.56, 0.03, "#111", 0, 0, 0); const phoneDeskScreen = plane(phoneDesk, 0.27, 0.5, REELS[0], 0, 0, 0.017, 0, true);
const kid = person(deskSet, { pose: "sit", shirt: "#d9822b", x: 0, z: -0.85, ry: Math.PI });
const pageTex = tex(128, 170, (c, w, h) => { c.fillStyle = "#fbfbf6"; c.fillRect(0, 0, w, h); c.fillStyle = "#333"; c.fillRect(12, 14, 70, 9); for (let i = 0; i < 10; i++) { c.fillStyle = "#c4c8cc"; c.fillRect(12, 36 + i * 12, 90 + ((i * 29) % 20), 5); } });
const pages = Array.from({ length: 16 }, (_, i) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.56), new THREE.MeshStandardMaterial({ map: pageTex, side: THREE.DoubleSide, roughness: 0.9, emissive: "#ffffff", emissiveMap: pageTex, emissiveIntensity: 0.55 })); m.castShadow = true; deskSet.add(m); return { m, i, spin: (i % 2 ? 1 : -1) * (2 + (i % 3)) }; });
const SCREEN = v3(-0.25, 1.4, -2.08);
const cards = Array.from({ length: 5 }, (_, i) => {
  const g = new THREE.Group(); deskSet.add(g);
  box(g, 0.47, 0.82, 0.03, "#111", 0, 0, -0.02); plane(g, 0.43, 0.77, REELS[i % 4], 0, 0, 0.0, 0, true);
  return { g, i };
});

// Bed (scroll)
const bedSet = mk("bed");
box(bedSet, 2.0, 0.5, 3.0, "#6b4a2b", -1.6, 0.25, -0.9); box(bedSet, 1.9, 0.25, 2.9, "#e8e6df", -1.6, 0.62, -0.9);
box(bedSet, 2.0, 1.1, 0.15, "#6b4a2b", -1.6, 0.85, -2.4); box(bedSet, 1.2, 0.18, 0.5, "#fff", -1.6, 0.85, -2.05);
box(bedSet, 1.9, 0.14, 1.3, "#5b7fc4", -1.6, 0.82, 0.05);

const phoneTilt = new THREE.Group(); bedSet.add(phoneTilt); phoneTilt.position.set(-1.6, 1.5, -1.42); phoneTilt.rotation.z = 0.95;

box(phoneBed, 0.26, 0.5, 0.03, "#111", 0, 0, 0); const phoneBedScreen = plane(phoneBed, 0.235, 0.45, REELS[1], 0, 0, 0.017, 0, true);
{ const glow = new THREE.PointLight("#9db8ff", 3, 2.2, 1.6); glow.position.set(-1.45, 1.25, -1.42); bedSet.add(glow); }
box(bedSet, 0.6, 0.7, 0.5, "#8a5a34", 0.2, 0.35, -2.3); box(bedSet, 0.22, 0.32, 0.22, "#e3b23c", 0.2, 0.86, -2.3, { emissive: "#6a4a10" });

const officeSet = mk("office");

box(mon, 0.1, 0.4, 0.1, "#333", 0, 0.2, 0); box(mon, 1.3, 0.82, 0.06, "#222", 0, 0.78, 0); plane(mon, 1.22, 0.74, monitorTex, 0, 0.78, 0.035, 0, true);
const mug = new THREE.Group(); mug.position.set(0.9, 1.05, -1.7); officeSet.add(mug);
box(mug, 0.18, 0.22, 0.18, "#d34b4b", 0, 0.11, 0);

  pal.head.rotation.set(Math.sin(t * 1.2) * 0.04, Math.sin(t * 0.8) * 0.06, sh.doubt ? -0.12 : 0);
  pal.p.visible = sh.kind !== "end"; spool.visible = sh.kind === "end";
  sMouth.scale.set(1 + ut * 0.3, 0.8 + ut * 2.2, 1);
  const happy = sh.proud;
  [sEyeL, sEyeR].forEach((e) => e.scale.set(1, (happy ? 0.35 : L.text.startsWith("And you") ? 0.55 : 1) * blinkU, 1));
  sBrowL.rotation.z = L.text.startsWith("And you") || L.text.startsWith("The whole") ? -0.3 : 0; sBrowR.rotation.z = -sBrowL.rotation.z;
  body.position.y = ut * 0.04 + Math.abs(Math.sin(t * 3)) * 0.02 + (happy ? Math.max(0, Math.sin(lt * 9)) * 0.05 : 0);
  body.rotation.z = Math.sin(t * 1.7) * 0.04 + (L.text.startsWith("And you") ? 0.12 : 0);
  sArmL.rotation.z = ut ? Math.sin(t * 8) * 0.4 : 0; sArmR.rotation.z = happy ? -0.8 + Math.sin(t * 10) * 0.3 : 0;
  sLegs.forEach((l, i) => (l.scale.y = 1 + Math.sin(t * 6 + i) * 0.04));

  boy.p.visible = sh.kind !== "end";
  // camera (wide shot camera set up front so the fanned cards can face it)
  if (sh.kind === "boy") {
    const h = BOY_HEAD(); const dir = new THREE.Vector3(Math.sin(0.35 + 0.25), 0, Math.cos(0.35 + 0.25));

    const h = PAL_HEAD(); const a = pal.p.rotation.y - 0.15; const dir = new THREE.Vector3(Math.sin(a), 0, Math.cos(a));

  } else if (sh.kind === "spool") {
    const s = SPOOL_AT(); const dir = new THREE.Vector3(Math.sin(-0.3), 0, Math.cos(-0.3));

  } else if (sh.kind === "wide") {
    camera.position.lerpVectors(v3(2.4, 2.7, 2.0), v3(2.0, 2.5, 1.5), ease(clamp(clt / 3.2))); camera.lookAt(0.0, 1.5, -1.5);
  } else if (sh.kind === "class") {
    camera.position.lerpVectors(v3(-0.9, 3.4, -2.2), v3(-0.7, 3.2, -1.7), u); camera.lookAt(0.1, 2.55, 2.15);
  } else {
    // end: Spool alone, centred, spinning in a little
    spool.position.set(0, 0, 0); spool.rotation.y = mix(-0.8, 0, ease(lt / 1.2));
    camera.position.set(0, 0.85, 3.4); camera.lookAt(0, 0.2, 0);
  }
  if (sh.kind !== "end") { spool.position.set(sh.kind === "wide" ? 1.3 : 0.55, 1.06, sh.kind === "wide" ? -1.25 : -1.55); spool.rotation.y = sh.kind === "wide" ? -0.9 : -0.35; }
  hero.armR.rotation.x = sh.kind === "class" ? -mix(0.2, 2.9, ease((lt - 0.2) / 0.5)) : -0.2; hero.armR.rotation.z = sh.kind === "class" ? 0.15 : 0;
  students.forEach((s, i) => { s.head.rotation.y = Math.sin(t * 1.3 + i * 1.7) * 0.25; });
  { const k = Math.sin(t * 0.6); teacher.p.position.x = k * 1.8; teacher.p.rotation.y = Math.cos(t * 0.6) > 0 ? Math.PI / 2 - 0.4 : -Math.PI / 2 + 0.4; }
  tail.rotation.y = Math.sin(t * 3) * 0.6; catHead.rotation.y = Math.sin(t * 0.7) * 0.3;
  for (const c of [bedClock, classClock]) { c.hand.rotation.z = -t * 1.2; c.hour.rotation.z = -t * 0.1; }

  key.position.copy(camera.position).add(v3(0.4, 0.6, 0)); key.intensity = sh.kind === "class" ? 0 : 5;
  renderer.render(scene, camera);
  // Whole-frame handheld shake while he panics
  const shake = sh.panic ? 1 : 0;
  document.getElementById("wrap").style.transform = shake ? `translate(${(Math.sin(t * 43) + Math.sin(t * 71)) * 7}px, ${(Math.sin(t * 37) + Math.sin(t * 67)) * 7}px) rotate(${Math.sin(t * 31) * 0.9}deg) scale(1.04)` : "none";

  // overlay
  let html = "";
  const LOGO = (h, pop) => `<span style="display:inline-block;vertical-align:middle;background:#0f1d18;border:2px solid #c9e64a;border-radius:14px;padding:6px 14px 8px;margin:0 6px;transform:scale(${pop});box-shadow:0 6px 20px rgba(0,0,0,.5)"><img src="wordmark.png" style="height:${h * 0.78}px;display:block"></span>`;
  const withLogo = (txt) => txt.replace(/\bUnspool\b/, LOGO(70, 1 + 0.25 * Math.max(0, 1 - (t - L.s) / 0.2)));
  const sub = (txt0, col) => { const txt = withLogo(txt0); return `<div class="mid" style="top:${sh.ui === "swipe" ? 985 : 860}px;font-family:'DejaVu Sans',sans-serif;font-weight:700;font-size:46px;letter-spacing:-.01em;transform:scale(${1 + 0.15 * Math.max(0, 1 - (t - L.s + 0.1) / 0.15)});color:${col};-webkit-text-stroke:1.5px rgba(0,0,0,.55);text-shadow:0 3px 0 rgba(0,0,0,.75),0 0 24px rgba(0,0,0,.8)">${txt}</div>`; };
  if (sh.ui === "upload") {
    const n = Math.round(38 * clamp((clt - 1.2) / 1.1)), pg = Math.round(412 * (1 - ease((clt - 0.1) / 1.3)));
    html += `<div style="position:absolute;left:0;right:0;top:990px;text-align:center;font-family:'DejaVu Sans',sans-serif;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.6),0 0 20px rgba(0,0,0,.6)">
      <div style="font-size:26px;color:#c9e64a;font-weight:700;letter-spacing:.04em">BIO-TEXTBOOK.PDF</div>
      <div style="margin-top:10px;font-size:50px;font-weight:800;letter-spacing:-1px">${pg} pages <span style="color:#c9e64a">→</span> ${n} reels</div>
      ${n >= 38 ? `<div style="margin-top:8px;font-size:30px;color:#c9e64a;font-weight:700;transform:scale(${1 + Math.max(0, 1 - (clt - 2.3) / 0.2) * 0.3})">✓ ready to scroll</div>` : ""}</div>`;
  }
  if (false) {
    const p = 0;
    html += `<div style="position:absolute;left:60px;right:60px;top:300px;background:#0f1612;border:1px solid #2a3a31;border-radius:10px;padding:28px 30px;font-family:'DejaVu Sans',sans-serif;color:#e8efe4;box-shadow:0 30px 80px rgba(0,0,0,.6);${appear(lt, 0)}">
      <div style="display:flex;gap:10px;align-items:center;font-size:22px;font-weight:700"><span style="width:14px;height:14px;border-radius:50%;background:#c9e64a"></span>unspool <span style="color:#7d8b82;font-weight:400">/ upload</span></div>
      <div style="margin-top:26px;border:2px dashed #c9e64a;padding:26px;text-align:center">
        <div style="font-size:28px;font-weight:700;color:#c9e64a">bio-textbook.pdf</div>
        <div style="margin-top:8px;font-size:20px;color:#9db5a6">412 pages · ${p < 1 ? "turning into reels…" : "<b style='color:#c9e64a'>38 reels ready ✓</b>"}</div>
        <div style="margin-top:18px;height:10px;background:#22302a"><div style="height:100%;width:${p * 100}%;background:#c9e64a"></div></div>
      </div></div>`;
  }
  if (sh.ui === "phone") {
    html += `<div style="position:absolute;left:150px;right:150px;top:150px;height:820px;border-radius:56px;background:linear-gradient(#1b2a3a,#0d141c);border:10px solid #0a0a0a;box-shadow:0 30px 90px rgba(0,0,0,.7);font-family:'DejaVu Sans',sans-serif;color:#fff;overflow:hidden;${appear(lt, 0)}">

      <div style="text-align:center;font-size:20px;color:#a9b6c4">Monday, October 19</div>
      <div style="position:absolute;left:24px;right:24px;top:300px;display:flex;flex-direction:column-reverse;gap:12px">` +
      NOTES.filter(([d]) => lt >= d + 0.2).map(([d, a, b], i, arr) => `<div style="background:rgba(201,230,74,${i === arr.length - 1 ? .95 : .18});color:${i === arr.length - 1 ? "#0f1d18" : "#e9f3d0"};border-radius:18px;padding:14px 18px;transform:scale(${Math.min(1, 0.9 + (lt - d - 0.2) * 0.6)});font-size:19px"><div style="font-size:14px;letter-spacing:.08em;opacity:.8;font-weight:700">UNSPOOL · now</div><div style="font-weight:700;margin-top:3px">${a}</div><div>${b}</div></div>`).join("") +

    const st = lines.find((l) => l.shot === "swipe").s - 0.25, T = t - st, per = 0.42, idx = Math.floor(T / per), f = ease(clamp((T % per) / 0.16));
    const img = (n) => `sw/s${(((n % 9) + 9) % 9) + 1}.jpg`;
    const k = clamp(T / 0.2);
    html += `<div style="position:absolute;left:130px;width:460px;top:110px;height:818px;border-radius:52px;border:12px solid #0a0a0a;background:#000;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.75);transform:scale(${0.85 + 0.15 * k}) rotate(${-3 * (1 - k)}deg);opacity:${k}">
      <img src="${img(idx)}" style="position:absolute;left:0;top:${-f * 100}%;width:100%;height:100%;object-fit:cover">
      <img src="${img(idx + 1)}" style="position:absolute;left:0;top:${(1 - f) * 100}%;width:100%;height:100%;object-fit:cover">
      <div style="position:absolute;right:14px;bottom:120px;display:flex;flex-direction:column;gap:22px;align-items:center;color:#fff;font:700 15px 'DejaVu Sans'">${["♥", "💬", "➤", "⋯"].map((c) => `<div style="font-size:30px">${c}</div>`).join("")}</div>
      <div style="position:absolute;left:16px;bottom:22px;color:#fff;font:700 18px 'DejaVu Sans'">unspool · Reel ${(idx % 38) + 1} of 38</div></div>
      <div style="position:absolute;left:600px;top:420px;color:#c9e64a;font:800 70px 'DejaVu Sans';transform:translateY(${-f * 40}px);opacity:${1 - f * 0.5}">↑</div>`;
  }
  if (sh.kind === "class") {
    const k = clamp((lt - 0.15) / 0.35), pop = 1 + Math.max(0, 1 - Math.abs(lt - 0.5) / 0.25) * 0.12;
    html += `<div style="position:absolute;left:180px;top:150px;width:360px;height:440px;background:#fbfbf6;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.45);transform:rotate(-6deg) scale(${k * pop});opacity:${k};font-family:'DejaVu Sans',sans-serif;color:#333;padding:28px">
      <div style="font-size:22px;font-weight:700">BIO · UNIT TEST</div>

      <div style="position:absolute;right:26px;top:22px;width:130px;height:130px;border:9px solid #e0262c;border-radius:50%;color:#e0262c;font:700 64px/112px serif;text-align:center;transform:rotate(-12deg)">A+</div></div>`;
  }

  } else if (t >= L.s - 0.1 && t <= L.e + 0.35) {

  }
