// ---------------- faces (drawn on a canvas, swapped per beat) ----------------

    case "grin": g.lineWidth = 9; for (const x of [88, 168]) { g.beginPath(); g.arc(x, 116, 18, Math.PI, 0); g.stroke(); } g.beginPath(); g.moveTo(84, 150); g.quadraticCurveTo(128, 214, 172, 150); g.closePath(); g.fill(); g.fillStyle = "#fff"; g.fillRect(96, 150, 64, 12); blush(); break;

    case "cry": g.lineWidth = 9; for (const x of [88, 168]) { g.beginPath(); g.moveTo(x - 22, 104); g.quadraticCurveTo(x, 122, x + 22, 104); g.stroke(); } brow(88, 72, 8); brow(168, 72, -8); g.beginPath(); g.moveTo(80, 184); g.quadraticCurveTo(128, 136, 176, 184); g.closePath(); g.fill(); tears(); break;
    case "worried": eye(88, 112, 13); eye(168, 112, 13); brow(88, 74, 9); brow(168, 74, -9); g.lineWidth = 8; g.beginPath(); g.moveTo(96, 178); g.quadraticCurveTo(112, 164, 128, 178); g.quadraticCurveTo(144, 192, 160, 178); g.stroke(); sweat(); break;

    default: eye(88, 110); eye(168, 110); brow(88, 72, 0); brow(168, 72, 0); g.lineWidth = 9; g.beginPath(); g.moveTo(104, 172); g.lineTo(152, 172); g.stroke();

FACE.determined = drawFace("angry");
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// ---------------- blocky characters (toy-figure proportions) ----------------
function blockyOld({ skin = "#f1c9a0", shirt = "#ffffff", pants = "#24345c", hair = "#5a3a22", style = "short", cap = null, partyHat = null, topHat = false, sash = null, tie = null, apron = null, mustache = false, scale = 1 } = {}) {

  const head = new THREE.Group(); head.position.y = 2.84; g.add(head);
  const hd = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.95, 0.95), mSkin); hd.position.y = 0.42; hd.castShadow = true; head.add(hd);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(0.96, 0.96), new THREE.MeshBasicMaterial({ map: FACE.neutral, transparent: true })); face.position.set(0, 0.4, 0.478); head.add(face);

  if (style === "spiky") { for (let i = 0; i < 7; i++) { const c = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.42, 4), mHair); c.position.set(-0.42 + i * 0.14, 1.02, -0.1 + (i % 2) * 0.18); c.rotation.z = (i - 3) * 0.15; head.add(c); } box(1.06, 0.2, 1.0, mHair, 0, 0.9, -0.02, head); }

  if (style === "white") { const mw = M("#eeeeee"); for (let i = 0; i < 6; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(0.26, 8, 6), mw); s.position.set(-0.3 + (i % 3) * 0.3, 1.0, -0.2 + Math.floor(i / 3) * 0.3); head.add(s); } }
  if (cap) { const mc = M(cap); box(1.1, 0.34, 1.04, mc, 0, 1.02, -0.02, head); box(1.0, 0.07, 0.5, mc, 0, 0.86, 0.68, head); box(0.16, 0.12, 0.16, mc, 0, 1.24, 0, head); }
  if (partyHat) { const ph = new THREE.Mesh(new THREE.ConeGeometry(0.34, 0.8, 16), M(partyHat)); ph.position.set(0.05, 1.3, 0); ph.rotation.z = -0.12; head.add(ph); const pom = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 6), M("#ffffff")); pom.position.set(0.1, 1.72, 0); head.add(pom); }
  if (topHat) { const mt = M("#1b1d2a", { roughness: 0.4 }); const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.72, 0.06, 20), mt); brim.position.y = 0.92; head.add(brim); const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.8, 20), mt); crown.position.y = 1.32; head.add(crown); box(0.94, 0.12, 0.94, M("#7a2bd6"), 0, 1.0, 0, head).visible = false; }

  g.scale.setScalar(scale);
  const P = { g, head, face, arms, legs, hip, torso };
  P.setFace = (n) => { face.material.map = FACE[n] || FACE.neutral; };
  P.pose = ({ la = [0, 0.06], ra = [0, -0.06], headTilt = 0, headTurn = 0, ll = 0, rl = 0 } = {}) => {
    arms[0].rotation.set(la[0], 0, la[1]); arms[1].rotation.set(ra[0], 0, ra[1]); legs[0].rotation.x = ll; legs[1].rotation.x = rl; head.rotation.set(0, headTurn, headTilt); };
  P.dance = (t, k = 1, ph = 0) => { const s = Math.sin(t * 9 + ph); P.pose({ la: [-2.6 - s * 0.35 * k, 0.4], ra: [-2.6 + s * 0.35 * k, -0.4], headTilt: s * 0.12 * k }); g.position.y = Math.abs(Math.sin(t * 9 + ph)) * 0.25 * k; };

}
const clockTex = canvasTex(256, 256, () => {});
function drawClock(sec, red = false) { const { g } = clockTex.userData; g.clearRect(0, 0, 256, 256); g.fillStyle = red ? "#e6402e" : "#2bb673"; g.beginPath(); g.arc(128, 128, 124, 0, 7); g.fill(); g.fillStyle = "#fff"; g.beginPath(); g.arc(128, 128, 100, 0, 7); g.fill();
  g.strokeStyle = "#222"; g.lineWidth = 6; for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; g.beginPath(); g.moveTo(128 + Math.sin(a) * 84, 128 - Math.cos(a) * 84); g.lineTo(128 + Math.sin(a) * 96, 128 - Math.cos(a) * 96); g.stroke(); }
  const a = sec / 60 * Math.PI * 2; g.lineWidth = 8; g.strokeStyle = "#e6402e"; g.beginPath(); g.moveTo(128, 128); g.lineTo(128 + Math.sin(a) * 82, 128 - Math.cos(a) * 82); g.stroke(); g.fillStyle = "#222"; g.beginPath(); g.arc(128, 128, 10, 0, 7); g.fill(); clockTex.needsUpdate = true; }
const makeClock = (parent, x, y, z, s = 1) => { const c = new THREE.Group(); c.position.set(x, y, z); c.scale.setScalar(s); parent.add(c); const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.24, 28), M("#e6402e")); body.rotation.x = Math.PI / 2; c.add(body);
  const f = new THREE.Mesh(new THREE.CircleGeometry(0.46, 28), new THREE.MeshBasicMaterial({ map: clockTex })); f.position.z = 0.125; c.add(f); for (const s2 of [-1, 1]) { const bell = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8, 0, 7, 0, Math.PI / 2), M("#e6402e")); bell.position.set(s2 * 0.3, 0.48, 0); bell.rotation.z = -s2 * 0.5; c.add(bell); } return c; };
const mkScene = (bg) => { const s = new THREE.Scene(); s.background = new THREE.Color(bg); return s; };

// ---------------- rounded people (the look of the reference videos) ----------------
// Egg-shaped heads with the face painted onto the sphere, big eyes with whites and highlights, brows, a small nose and ears,
// capsule bodies, round hands and shoes. Same interface as the old cube people: { g, head, face, arms, legs, hip, torso,
// setFace, pose }, so every shot keeps working. arms[i].children[0] = sleeve, [1] = forearm; legs[i].children[0] = trouser leg.
const FACECACHE = {};
const drawExpr = (g, kind, iris) => {
  g.lineCap = "round"; g.lineJoin = "round";
  const eye = (x, y, { r = 21, open = 1, look = 0, tear = false } = {}) => {
    g.save(); g.beginPath(); g.ellipse(x, y, r, r * 1.18 * open, 0, 0, 7); g.fillStyle = "#fbfaf6"; g.fill(); g.clip();
    g.fillStyle = iris; g.beginPath(); g.arc(x + look, y + 2, r * 0.62, 0, 7); g.fill(); g.fillStyle = "#120a06"; g.beginPath(); g.arc(x + look, y + 2, r * 0.32, 0, 7); g.fill();
    g.fillStyle = "#fff"; g.beginPath(); g.arc(x + look - r * 0.25, y - r * 0.3, r * 0.2, 0, 7); g.fill(); g.restore();
    g.strokeStyle = "#2a1a12"; g.lineWidth = 3.5; g.beginPath(); g.ellipse(x, y, r + 1, r * 1.18 * open + 1, 0, Math.PI * 1.08, Math.PI * 1.92); g.stroke();
    if (tear) { g.fillStyle = "rgba(120,190,255,.9)"; g.beginPath(); g.moveTo(x - 4, y + r); g.quadraticCurveTo(x - 14, y + r + 34, x - 4, y + r + 52); g.quadraticCurveTo(x + 6, y + r + 34, x - 4, y + r); g.fill(); } };
  const lid = (x, y, r = 21) => { g.strokeStyle = "#2a1a12"; g.lineWidth = 6; g.beginPath(); g.moveTo(x - r, y); g.quadraticCurveTo(x, y + 10, x + r, y); g.stroke(); };
  const brow = (x, y, tilt, arch = 0) => { g.strokeStyle = "#3a2216"; g.lineWidth = 8; g.beginPath(); g.moveTo(x - 24, y + tilt); g.quadraticCurveTo(x, y - 8 - arch, x + 24, y - tilt); g.stroke(); };
  const mouth = (k) => { g.strokeStyle = "#5a2a1e"; g.fillStyle = "#6a2020"; g.lineWidth = 6;
    if (k === "smile") { g.beginPath(); g.moveTo(98, 182); g.quadraticCurveTo(128, 204, 158, 182); g.stroke(); }
    else if (k === "grin") { g.beginPath(); g.moveTo(92, 178); g.quadraticCurveTo(128, 226, 164, 178); g.closePath(); g.fill(); g.fillStyle = "#fff"; g.fillRect(100, 179, 56, 10); }
    else if (k === "o") { g.beginPath(); g.ellipse(128, 192, 13, 18, 0, 0, 7); g.fill(); }
    else if (k === "sad") { g.beginPath(); g.moveTo(102, 196); g.quadraticCurveTo(128, 178, 154, 196); g.stroke(); }
    else if (k === "cry") { g.beginPath(); g.moveTo(98, 200); g.quadraticCurveTo(128, 168, 158, 200); g.closePath(); g.fill(); }
    else if (k === "smirk") { g.beginPath(); g.moveTo(104, 188); g.quadraticCurveTo(136, 196, 158, 176); g.stroke(); }
    else if (k === "wavy") { g.beginPath(); g.moveTo(102, 190); g.quadraticCurveTo(115, 180, 128, 190); g.quadraticCurveTo(141, 200, 154, 190); g.stroke(); }
    else if (k === "small") { g.beginPath(); g.ellipse(146, 190, 8, 6, 0, 0, 7); g.fill(); }

  const sweat = () => { g.fillStyle = "rgba(124,207,255,.95)"; g.beginPath(); g.moveTo(206, 52); g.quadraticCurveTo(192, 86, 206, 96); g.quadraticCurveTo(220, 86, 206, 52); g.fill(); };
  switch (kind) {
    case "happy": eye(90, 116); eye(166, 116); brow(90, 78, 0, 4); brow(166, 78, 0, 4); mouth("smile"); blush(); break;
    case "grin": lid(90, 118); lid(166, 118); brow(90, 82, 0, 6); brow(166, 82, 0, 6); mouth("grin"); blush(); break;
    case "shock": eye(90, 112, { r: 25, open: 1.1 }); eye(166, 112, { r: 25, open: 1.1 }); brow(90, 64, -2, 10); brow(166, 64, -2, 10); mouth("o"); sweat(); break;
    case "cry": eye(90, 118, { open: 0.75, tear: true }); eye(166, 118, { open: 0.75, tear: true }); brow(90, 84, 8); brow(166, 84, -8); mouth("cry"); break;
    case "worried": eye(90, 118); eye(166, 118); brow(90, 82, 9); brow(166, 82, -9); mouth("wavy"); sweat(); break;
    case "angry": eye(90, 120, { open: 0.8 }); eye(166, 120, { open: 0.8 }); brow(90, 92, -10); brow(166, 92, 10); mouth("sad"); break;

    case "smug": eye(90, 120, { open: 0.55, look: 5 }); eye(166, 120, { open: 0.55, look: 5 }); brow(90, 90, 0); brow(166, 84, 0, 6); mouth("smirk"); break;

const faceTex = (skin, kind, iris = "#4a2e1a") => { const key = skin + kind + iris; if (FACECACHE[key]) return FACECACHE[key];
  return (FACECACHE[key] = canvasTex(1024, 512, (g) => { g.fillStyle = skin; g.fillRect(0, 0, 1024, 512); g.save(); g.translate(256 - 118, 256 - 112); g.scale(236 / 256, 236 / 256); drawExpr(g, kind, iris); g.restore(); })); };

function blocky({ skin = "#f1c9a0", shirt = "#ffffff", pants = "#24345c", hair = "#5a3a22", style = "short", scale = 1, nose = true, glasses = false, shoes = "#2a2a2a", iris = "#4a2e1a" } = {}) {
  const g = new THREE.Group(), mSkin = M(skin, { roughness: 0.6 }), mShirt = M(shirt, { roughness: 0.75 }), mPants = M(pants, { roughness: 0.8 }), mHair = M(hair, { roughness: 0.7 });
  const mesh = (geo, mat, x, y, z, parent) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; };
  const hip = new THREE.Group(); hip.position.y = 1.1; g.add(hip);

  mesh(new THREE.CylinderGeometry(0.16, 0.19, 0.3, 16), mSkin, 0, 2.47, 0, g);

    mesh(new THREE.CapsuleGeometry(0.19, 0.38, 6, 12), mShirt, 0, -0.26, 0, p); mesh(new THREE.CapsuleGeometry(0.15, 0.4, 6, 12), mSkin, 0, -0.76, 0, p); mesh(new THREE.SphereGeometry(0.19, 14, 10), mSkin, 0, -1.12, 0.02, p); return p; });

  leave(lt) { outfit("purple"); const k = ease(lt / 2.0); gfStanding(mix(-0.3, -5.0, k), mix(-0.9, -3.2, k), mix(0.25, -2.6, clamp(lt * 2))); const s = Math.sin(lt * 9); GF.setFace("angry"); GF.pose({ ll: s * 0.4, rl: -s * 0.4, la: [-0.8, 0.5], ra: [-0.8, -0.5] }); holdUp(GF.arms[0], BLACK); holdUp(GF.arms[1], RED); GF.g.visible = lt < 1.9; boyOnSofa("neutral", { headTurn: 0.7 }); cam(WIDE[0], WIDE[1], 42); return room; },
  alone(lt) { boyOnSofa("neutral", { headTurn: lt > 1.4 ? 0 : 0.7 }); drift(lt / 2.82, WIDE[0], v3(1.6, 3.6, 7.0), WIDE[1], v3(1.8, 2.6, -2.0), 42); return room; },
  boyPhone(lt, name, t) { boyOnSofa(t > 80 ? "happy" : t > 59 ? "grin" : "worried", { la: [-1.3, 0.3], ra: [-1.3, -0.3], headTilt: 0.1 }); room.add(phone); phone.position.set(2.0, 1.75, -1.25); phone.rotation.set(-1.25, Math.PI + 0.15, 0); drawPhone("reel", 0.2);
    cam(v3(1.2, 3.5, 4.0 - lt * 0.05), v3(2.0, 2.75, -2.2), 34); return room; },
  phone(lt, name, t) { boyOnSofa("neutral", { la: [-1.3, 0.3], ra: [-1.3, -0.3] }); // the screen itself is shown full-size in the overlay
    if (t < 55.42) drawPhone("upload", (t - 51.28) / 3.4); else if (t < 58.14) drawPhone("reel", (t - 55.42) / 2.72); else drawPhone("quiz", (t - 58.14) / 0.9);
    cam(v3(1.2, 3.5, 4.0 - lt * 0.05), v3(2.0, 2.75, -2.2), 36); return room; },
  green(lt) { outfit("green"); const k = ease(lt / 1.4); gfStanding(mix(-5.0, -0.3, k), mix(-3.2, -0.9, k), 0.2); const s = Math.sin(lt * 9) * (1 - k); GF.pose({ ll: s * 0.4, rl: -s * 0.4, la: [0, 0.06], ra: [0, -0.06] }); GF.setFace("happy"); boyOnSofa("shock", { headTurn: 0.4 }); cam(WIDE[0], WIDE[1], 42); return room; },
  gfCross(lt) { outfit("green"); gfStanding(); GF.setFace("angry"); GF.pose({ la: [-1.4, -0.9], ra: [-1.4, 0.9] }); boyOnSofa(); cam(v3(-0.2, 3.6, 5.0), v3(-0.3, 3.0, -0.9), 38); return room; },
  redDress(lt) { outfit("red"); gfStanding(); GF.setFace("happy"); GF.pose({ la: [0, 0.1], ra: [0, -0.1], headTilt: Math.sin(lt * 1.5) * 0.05 }); boyOnSofa("neutral", { headTurn: 0.35 }); lt < 3.3 ? cam(WIDE[0], WIDE[1], 42) : cam(v3(0.6, 3.8, 8.0), v3(0.4, 2.8, -1.4), 40); return room; },
  end(lt) { room.add(BOY.g); sit(BOY, false); BOY.g.position.set(0.4, 0, 0.4); BOY.g.rotation.y = 0; BOY.setFace("happy"); BOY.pose({ la: [-1.45, -0.15], ra: [-1.45, 0.15] });
    room.add(sign); sign.position.set(0.4, 2.05 + Math.sin(lt * 4) * 0.02 - 0.3 * (1 - outBack(lt / 0.3)), 1.95); sign.scale.setScalar(0.82); cam(v3(0.4, 3.0, 9.4 - lt * 0.3), v3(0.4, 3.2, 0.2), 40); return room; },
};

// ---------------- overlay ----------------
const ov = document.getElementById("ov"), glc = document.getElementById("gl");
glc.style.filter = "contrast(1.05) saturate(1.1)";
const capAt = (t) => { let c = null; for (const x of CAPS) if (t >= x[0] - 0.03) c = x; return c && t < 83.7 ? c : null; };
const tag = (txt, lt) => `<div style="position:absolute;left:0;right:0;top:170px;text-align:center"><span style="background:#ffd23f;color:#111;font:800 34px Arc;padding:8px 18px;border-radius:10px;opacity:${clamp(lt * 4)}">${txt}</span></div>`;
window.renderAt = (t) => {
  let i = 0; for (let j = 0; j < SH.length; j++) if (t >= SH[j][1]) i = j;
  const [name, t0] = SH[i], lt = t - t0;
  [BOY.g, GF.g, phone, sign, BLACK, RED].forEach((o) => o.removeFromParent()); GF.g.visible = true;
  renderer.render(SC[name](lt, name, t), camera);
  let h = `<div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 60%,rgba(0,0,0,.28) 100%)"></div>`;
  if (t >= 44.4 && t < 47.22) h += tag("20 MINUTES, MINIMUM", t - 44.4);
  if (t >= 47.22 && t < 51.28) h += tag("BIO TEST TOMORROW · 40 PAGES", t - 47.22);
  if (t >= 69.84 && t < 71.76) h += tag("20 MINUTES LATER", t - 69.84);
  // the Unspool beat, made unmissable: the app fills the screen, logo up top, the PDF drops in
  const U0 = 51.28, U1 = 59.06, inU = t >= U0 - 0.25 && t < U1; let phoneEl = null;
  if (inU) { const a = clamp((t - (U0 - 0.25)) / 0.3) * clamp((U1 - t) / 0.25), pop = 0.8 + 0.2 * outBack(clamp((t - (U0 - 0.25)) / 0.35));
    h += `<div style="position:absolute;inset:0;background:rgba(6,10,8,${0.62 * a})"></div>`;
    const lg = t >= 52.45 && t < 53.2 ? 1 + 0.12 * Math.sin(clamp((t - 52.45) / 0.75) * Math.PI) : 1;
    h += `<div style="position:absolute;left:0;right:0;top:96px;text-align:center;opacity:${a}"><span style="display:inline-block;transform:scale(${lg});background:#b6f24a;color:#08110e;font:800 40px Arc;padding:8px 22px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.45)">unspool<span style="opacity:.55">.cc</span></span></div>`;
    h += `<div id="ph" style="position:absolute;left:218px;top:178px;width:284px;height:584px;border-radius:38px;background:#000;border:5px solid #2a2a2a;box-shadow:0 20px 50px rgba(0,0,0,.6);overflow:hidden;opacity:${a};transform:scale(${pop});transform-origin:50% 50%"></div>`;
    if (t >= U0 && t < 52.6) { const k = ease(clamp((t - U0) / 1.2)); const y = mix(-30, 300, k), sc = mix(1.1, 0.5, k), op = clamp((52.6 - t) / 0.2);
      h += `<div style="position:absolute;left:0;right:0;top:${y}px;text-align:center;opacity:${op * a}"><span style="display:inline-flex;align-items:center;gap:16px;transform:scale(${sc});background:#fff;color:#111;font:800 28px Arc;padding:12px 20px;border-radius:14px;box-shadow:0 10px 26px rgba(0,0,0,.5)"><span style="background:#e6402e;color:#fff;font:800 18px Arc;padding:12px 8px;border-radius:6px">PDF</span>Bio chapter · 40 pages</span></div>`; }
    phoneEl = true; }
  const c = capAt(t);
  if (c) { const k = clamp((t - c[0]) / 0.1); h += `<div class="cap" style="${inU ? "top:790px;" : ""}transform:scale(${0.85 + 0.15 * outBack(k)})">${c[1]}</div>`; }
  if (name === "end") h += `<div style="position:absolute;left:0;right:0;top:190px;text-align:center;color:#fff;font:800 44px Arc;-webkit-text-stroke:7px #000;paint-order:stroke fill;opacity:${clamp((lt - 0.2) * 4)}">THE NIGHT WASN'T A TOTAL LOSS</div>`;
  ov.innerHTML = h;
  if (phoneEl) { const cv = phoneTex.userData.c; cv.style.cssText = "width:100%;height:100%;display:block"; document.getElementById("ph").appendChild(cv); }
};
const st = document.createElement("style"); st.textContent = `.cap{position:absolute;left:100px;right:100px;top:860px;text-align:center;color:#fff;font:800 50px/1.18 Arc;-webkit-text-stroke:9px #000;paint-order:stroke fill;text-shadow:0 4px 0 #000}
.cap .hl{background:#d81e1e;-webkit-text-stroke:0;padding:0 8px;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone;text-shadow:none}`; document.head.appendChild(st);
window.renderAt(0); setTimeout(() => (window.ready = true), 80);
</script></body></html>
