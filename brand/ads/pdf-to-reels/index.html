  if (shot === "unspool") { // speed lines + the word slams

    h += `<div style="position:absolute;left:0;right:0;top:200px;text-align:center;transform:scale(${slam(lt / 0.2)});font:700 84px Unb;color:${LIME};text-shadow:0 6px 0 #000,0 0 40px rgba(211,240,90,.6)">UNSPOOL</div>`; }

  if (shot === "features") { const words = [["🔊", "Narrated"], ["CC", "Captioned"], ["✓", "Quizzed"]]; const seg = (L.e - L.s + 0.1) / 3;
    words.forEach(([ic, tx], j) => { const d = j * seg; if (lt < d) return; const p = slam((lt - d) / 0.16); const left = [40, 300, 120][j], top = 150 + j * 110;
      h += `<div style="position:absolute;left:${left}px;top:${top}px;transform:scale(${p}) rotate(${[-4, 3, -2][j]}deg);transform-origin:center;display:inline-flex;align-items:center;gap:12px;background:${LIME};color:#0f1d18;font:700 36px Ins;padding:16px 28px;border-radius:40px;box-shadow:0 10px 30px rgba(0,0,0,.5)"><span style="font:700 26px Unb">${ic}</span>${tx}</div>`; }); }

    const order = ["mito", "dna", "ribo", "leaf", "quiz", "r1", "r2", "r3"]; const per = 0.5; const k = Math.floor(lt / per); const sw = clamp(((lt % per) - (per - 0.2)) / 0.2);

    h += `<div style="position:absolute;left:0;right:0;top:420px;text-align:center;transform:scale(${slam((second ? lt - AP : lt) / 0.18)}) rotate(-3deg)"><span style="display:inline-block;background:#0b0f0d;color:#fff;font:700 70px/1.1 Unb;padding:16px 30px;border-radius:22px;box-shadow:0 10px 40px rgba(0,0,0,.6)">${second ? `GET AN <span style="color:${LIME}">A+</span>` : `JUST <span style="color:${LIME}">SWIPE.</span>`}</span></div>`;
    if (second) { const k = (lt - AP - 0.15) / 0.2; if (k > 0) h += `<div style="position:absolute;left:430px;top:600px;width:220px;height:220px;transform:scale(${slam(k)}) rotate(12deg);border:12px solid #e3262f;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 104px Unb;color:#e3262f;background:rgba(255,255,255,.92);box-shadow:0 12px 40px rgba(0,0,0,.5)">A+</div>`; } }

    h += `<div style="position:absolute;inset:0;background:#0b0f0d"></div><div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(211,240,90,.22),transparent 60%)"></div>`;
    h += `<img src="lockup-horizontal.svg" style="position:absolute;left:210px;width:300px;top:400px;opacity:${clamp((lc - 0.5) / 0.3)}">`;

    h += `<div style="position:absolute;left:50%;top:680px;transform:translateX(-50%) scale(${outBack((lc - 0.6) / 0.35)});background:${LIME};color:#0f1d18;font:600 30px Ins;padding:16px 32px;border-radius:40px;white-space:nowrap;box-shadow:0 0 40px rgba(211,240,90,.4)">First reel free</div>`; }
  if (!["cta", "end", "swipe", "reels"].includes(shot)) h += `<div style="position:absolute;left:28px;top:70px;font:700 22px Unb;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6)">unspool</div>`;
  if (t < 0.08) h += `<div style="position:absolute;inset:0;background:#000;opacity:${1 - t / 0.08}"></div>`;
  ov.innerHTML = h;
};
