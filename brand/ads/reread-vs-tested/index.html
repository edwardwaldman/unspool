<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Unb;src:url(Unbounded-700.ttf)} @font-face{font-family:Ins;src:url(InstrumentSans-600.ttf)}
html,body{margin:0;width:720px;height:1280px;overflow:hidden;background:#0b0f0d}
#ov{position:absolute;inset:0;overflow:hidden}
</style></head><body><div id="ov"></div>
<script type="module">
import { docToReels } from "./doc-to-reels.js";
const TL = await (await fetch("tl.json")).json(); const lines = TL.lines, DUR = TL.dur; window.DUR = DUR;
await Promise.all([document.fonts.load("700 40px Unb"), document.fonts.load("600 20px Ins")]);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), mix = (a, b, x) => a + (b - a) * x;
const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const outBack = (x) => { x = clamp(x); const k = 1.7; return 1 + (k + 1) * Math.pow(x - 1, 3) + k * Math.pow(x - 1, 2); };
const LIME = "#d3f05a", BLUE = "#8ea2d8", RED = "#ff5a5a";
const shotIdx = (t) => { let k = 0; for (let i = 0; i < lines.length; i++) if (t >= lines[i].s - 0.12) k = i; return k; };
const st = (n) => lines.find((l) => l.shot === n).s - 0.12;
const ov = document.getElementById("ov");
const abs = (x, y, inner, extra = "") => `<div style="position:absolute;left:${x}px;top:${y}px;${extra}">${inner}</div>`;

// a little student: head + shoulders
const kid = (col, s = 1) => `<div style="position:relative;width:${70 * s}px;height:${86 * s}px"><div style="position:absolute;left:${17 * s}px;top:0;width:${36 * s}px;height:${36 * s}px;border-radius:50%;background:${col}"></div><div style="position:absolute;left:0;top:${40 * s}px;width:${70 * s}px;height:${46 * s}px;border-radius:${35 * s}px ${35 * s}px ${8 * s}px ${8 * s}px;background:${col}"></div></div>`;
const crowd = (col, s = 1) => `<div style="display:flex;gap:${6 * s}px;justify-content:center">${kid(col, s * 0.85)}${kid(col, s)}${kid(col, s * 0.85)}</div>`;
// the passage
const page = (w, title = "The Sun") => `<div style="width:${w}px;height:${w * 1.3}px;background:#fbfaf6;border-radius:${w * 0.04}px;box-shadow:0 ${w * 0.05}px ${w * 0.12}px rgba(0,0,0,.45);position:relative;overflow:hidden">
  <div style="position:absolute;left:${w * 0.1}px;top:${w * 0.09}px;font:700 ${w * 0.1}px Unb;color:#1a1f2c">${title}</div>
  ${[0.8, 0.72, 0.78, 0.6, 0.8, 0.75, 0.5, 0.78, 0.7].map((f, i) => `<div style="position:absolute;left:${w * 0.1}px;top:${w * (0.32 + i * 0.1)}px;width:${w * f}px;height:${w * 0.035}px;border-radius:4px;background:#bcc2cc"></div>`).join("")}</div>`;
const quizCard = (w, ok) => `<div style="width:${w}px;height:${w * 1.3}px;background:#16211b;border:3px solid ${LIME};border-radius:${w * 0.08}px;box-sizing:border-box;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.5)">
  <div style="position:absolute;left:0;right:0;top:${w * 0.12}px;text-align:center;font:700 ${w * 0.32}px Unb;color:${LIME}">?</div>
  ${[0, 1, 2].map((i) => `<div style="position:absolute;left:${w * 0.14}px;right:${w * 0.14}px;top:${w * (0.66 + i * 0.2)}px;height:${w * 0.13}px;border-radius:${w * 0.04}px;background:${ok && i === 1 ? LIME : "rgba(255,255,255,.18)"}"></div>`).join("")}</div>`;
const chip = (tx, bg, fg, sz = 26) => `<span style="display:inline-block;background:${bg};color:${fg};font:700 ${sz}px Unb;padding:10px 20px;border-radius:40px;white-space:nowrap">${tx}</span>`;
function caption(t, L) {
  if (!L.text) return ""; const ws = L.text.split(" "); const tot = ws.reduce((a, w) => a + w.length + 1, 0); const u = clamp((t - L.s) / (L.e - L.s)) * tot; let acc = 0, cur = 0;
  ws.forEach((w, i) => { if (u >= acc) cur = i; acc += w.length + 1; }); const a = Math.floor(cur / 5) * 5;
  return ws.map((w, i) => (i >= a && i < a + 5 ? `<span style="color:${i <= cur ? "#fff" : "rgba(255,255,255,.45)"}">${w}</span>` : "")).filter(Boolean).join(" ");
}

window.renderAt = (t) => {
  const i = shotIdx(t), L = lines[i], shot = L.shot, lt = t - (L.s - 0.12), len = L.e - L.s + 0.3;
  let h = `<div style="position:absolute;inset:0;background:#0b0f0d"></div>`;
  const study = ["hook", "setup", "groupA", "groupB", "result"].includes(shot);
  if (study) {
    h += `<div style="position:absolute;inset:0;background:radial-gradient(circle at 25% 60%,rgba(142,162,216,.12),transparent 45%),radial-gradient(circle at 75% 60%,rgba(211,240,90,.12),transparent 45%)"></div>`;
    // the two columns
    const dimA = shot === "groupB" ? 0.35 : 1, dimB = shot === "groupA" ? 0.35 : 1, cIn = shot === "hook" ? outBack(lt / 0.45) : 1;
    h += abs(40, 360, `<div style="width:300px;text-align:center;opacity:${dimA};transform:scale(${cIn})">${crowd(BLUE)}<div style="margin-top:14px">${chip("GROUP 1", "rgba(142,162,216,.18)", BLUE, 22)}</div></div>`);
    h += abs(380, 360, `<div style="width:300px;text-align:center;opacity:${dimB};transform:scale(${shot === "hook" ? outBack((lt - 0.15) / 0.45) : 1})">${crowd(LIME)}<div style="margin-top:14px">${chip("GROUP 2", "rgba(211,240,90,.18)", LIME, 22)}</div></div>`);
    h += `<div style="position:absolute;left:359px;top:360px;width:2px;height:640px;background:rgba(255,255,255,.12)"></div>`;
    if (shot === "hook") {
      h += `<div style="position:absolute;left:0;right:0;top:130px;text-align:center;font:700 46px/1.15 Unb;color:#fff;letter-spacing:-1px">Same passage.<br><span style="color:${LIME}">A week later…</span></div>`;
      const q = outBack((lt - 1.4) / 0.35);
      [[190, BLUE], [530, LIME]].forEach(([x, c], j) => { const k = outBack((lt - 1.4 - j * 0.2) / 0.35); h += abs(x - 80, 560, `<div style="width:160px;height:160px;border-radius:30px;border:4px dashed ${c};display:flex;align-items:center;justify-content:center;font:700 80px Unb;color:${c};transform:scale(${k})">?</div>`); });
      const pp = outBack((lt - 2.6) / 0.4); h += abs(0, 780, `<div style="width:720px;text-align:center;transform:scale(${pp})">${chip("One remembered way more", RED, "#fff", 26)}</div>`);
    }
    if (shot === "setup") {
      const pop = outBack(lt / 0.4), sp = ease((lt - 2.2) / 0.8);
      h += abs(0, 140, `<div style="width:720px;text-align:center;transform:scale(${outBack((lt - 0.2) / 0.35)})">${chip("2006 study", LIME, "#0f1d18", 30)}</div>`);
      if (sp < 1) h += abs(mix(270, 270, sp), 600, `<div style="transform:scale(${pop * mix(1, 0.6, sp)});opacity:${1 - sp}">${page(180)}</div>`);
      [[110, 0], [450, 1]].forEach(([x]) => { if (sp > 0) h += abs(mix(270, x, sp), mix(600, 620, sp), `<div style="transform:scale(${mix(0.8, 0.85, sp)})">${page(180)}</div>`); });
      if (sp <= 0) h += abs(0, 880, `<div style="width:720px;text-align:center;font:600 26px Ins;color:rgba(255,255,255,.6)">a short passage</div>`);
    }
    if (shot === "groupA" || shot === "groupB" || (shot === "result" && lt < 0.3)) {
      // group 1: four reads, stacked
      const na = shot === "groupA" ? Math.min(4, Math.floor(lt / (len / 4.4)) + 1) : 4;
      for (let j = 0; j < na; j++) { const k = shot === "groupA" ? outBack((lt - j * (len / 4.4)) / 0.3) : 1; h += abs(105 + j * 14, 590 + j * 22, `<div style="transform:scale(${k}) rotate(${(j - 1.5) * 4}deg)">${page(130)}</div>`); }
      if (shot !== "result") h += abs(40, 830, `<div style="width:300px;text-align:center">${chip(`READ ×${na}`, BLUE, "#0f1530", 28)}</div>`);
      // group 2: one read, then three self-tests
      if (shot !== "groupA") {
        const per = (len - 0.5) / 4, nb = shot === "groupB" ? Math.min(4, Math.floor(lt / per) + 1) : 4;
        h += abs(400, 600, `<div style="transform:scale(${shot === "groupB" ? outBack(lt / 0.3) : 1}) rotate(-6deg)">${page(110)}</div>`);
        for (let j = 1; j < nb; j++) { const k = shot === "groupB" ? outBack((lt - j * per) / 0.3) : 1; h += abs(470 + (j - 1) * 62, 650 + (j - 1) * 26, `<div style="transform:scale(${k}) rotate(${(j - 2) * 5}deg)">${quizCard(100, true)}</div>`); }
        if (shot !== "result") h += abs(380, 830, `<div style="width:300px;text-align:center">${chip(nb === 1 ? "READ ×1" : `READ ×1 + TEST ×${nb - 1}`, LIME, "#0f1d18", 22)}</div>`);
      }
    }
    if (shot === "result") {
      h += `<div style="position:absolute;inset:0;background:rgba(11,15,13,${clamp(lt / 0.3) * 0.88})"></div>`;
      h += abs(0, 130, `<div style="width:720px;text-align:center;transform:scale(${outBack(lt / 0.35)})">${chip("1 WEEK LATER", "#fff", "#0b0f0d", 30)}</div>`);
      const base = 1000, full = 560, gA = ease((lt - 0.3) / 1.0) * 0.40, gB = ease((lt - 2.3) / 1.0) * 0.61;
      [[120, gA, BLUE, "Reread ×4"], [420, gB, LIME, "Tested ×3"]].forEach(([x, g, c, lab]) => {
        h += abs(x, base - full * g, `<div style="width:180px;height:${full * g}px;background:${c};border-radius:18px 18px 0 0;box-shadow:0 0 40px ${c}55"></div>`);
        h += abs(x - 30, base - full * g - 100, `<div style="width:240px;text-align:center;font:700 72px Unb;color:${c};opacity:${g > 0.005 ? 1 : 0}">${Math.round(g * 100)}%</div>`);
        h += abs(x - 30, base + 20, `<div style="width:240px;text-align:center;font:700 26px Unb;color:${c}">${lab}</div>`);
      });
      h += `<div style="position:absolute;left:80px;right:80px;top:${base}px;height:3px;background:rgba(255,255,255,.3)"></div>`;
      const w = outBack((lt - 3.4) / 0.35); if (lt > 3.4) h += abs(420, 270, `<div style="width:180px;text-align:center;transform:scale(${w}) rotate(-6deg)">${chip("+21", LIME, "#0f1d18", 34)}</div>`);
    }
  } else if (shot === "why") {
    // recall: the answer is pulled out of your head
    h += `<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(211,240,90,.14),transparent 55%)"></div>`;
    const k = outBack(lt / 0.4), pull = ease((lt - 0.6) / 1.0);
    h += abs(210, 360, `<div style="width:300px;height:340px;transform:scale(${k});position:relative"><div style="position:absolute;left:30px;top:0;width:240px;height:260px;border-radius:50% 50% 46% 46%;border:5px solid rgba(255,255,255,.75);box-sizing:border-box"></div><div style="position:absolute;left:85px;top:250px;width:130px;height:90px;border:5px solid rgba(255,255,255,.75);border-top:none;box-sizing:border-box"></div></div>`);
    const y = mix(470, 170, pull); h += `<div style="position:absolute;left:358px;top:${y + 40}px;width:5px;height:${Math.max(0, 470 - y)}px;background:linear-gradient(${LIME},transparent)"></div>`;
    h += abs(360 - 130, y, `<div style="width:260px;text-align:center;transform:scale(${mix(0.4, 1, pull)})">${chip("✓ the answer", LIME, "#0f1d18", 28)}</div>`);
    const s1 = outBack((lt - 1.6) / 0.35), s2 = outBack((lt - 2.1) / 0.35);
    h += abs(0, 790, `<div style="width:720px;text-align:center;transform:scale(${s1});font:700 40px Unb;color:rgba(255,255,255,.4)"><s>Rereading</s> → feels familiar</div>`);
    h += abs(0, 860, `<div style="width:720px;text-align:center;transform:scale(${s2});font:700 40px Unb;color:${LIME}">Recalling → sticks</div>`);
  } else if (shot === "pivot") {
    const DT = 2.5, q = lt - DT, pp = outBack(q / 0.4);
    h += `<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(211,240,90,.14),transparent 60%)"></div>`;
    if (q < 0) h += docToReels(lt, { title: 'Any document<br>→ <span style="color:#d3f05a">reels</span>', docTitle: "Chapter 3" });
    else {
      h += `<div style="position:absolute;left:0;right:0;top:140px;text-align:center;font:700 42px/1.15 Unb;color:#fff">Every reel ends<br>with a <span style="color:${LIME}">quiz</span></div>`;
      h += `<div style="position:absolute;left:50%;top:330px;width:330px;height:620px;margin-left:-165px;border-radius:40px;background:#000;padding:12px;transform:scale(${pp});box-shadow:0 20px 60px rgba(0,0,0,.6)"><div style="position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden"><img src="quiz.jpg" style="width:100%;height:100%;object-fit:cover"></div></div>`;
    }
  } else {
    const lc = t - st("cta"), a = clamp(lc / 0.2);
    h += `<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(211,240,90,.2),transparent 60%);opacity:${a}"></div>`;
    h += `<img src="lockup-horizontal.svg" style="position:absolute;left:210px;width:300px;top:400px;opacity:${clamp((lc - 0.3) / 0.3)}">`;
    h += `<div style="position:absolute;left:0;right:0;top:520px;text-align:center;transform:scale(${mix(1.3, 1, ease(lc / 0.25))});opacity:${a};font:700 100px/1 Unb;color:#fff;letter-spacing:-2px;text-shadow:0 0 50px rgba(211,240,90,.45)">unspool<span style="color:${LIME}">.cc</span></div>`;
    h += `<div style="position:absolute;left:50%;top:680px;transform:translateX(-50%) scale(${outBack((lc - 0.5) / 0.35)});background:${LIME};color:#0f1d18;font:600 30px Ins;padding:16px 32px;border-radius:40px;white-space:nowrap">First reel free</div>`;
  }
  if (!["pivot", "cta", "end"].includes(shot)) { const c = caption(t, L); if (c) h += `<div style="position:absolute;left:0;right:0;top:1080px;text-align:center"><span style="display:inline-block;max-width:600px;background:rgba(14,18,20,.82);font:600 30px/1.3 Ins;padding:10px 18px;border-radius:12px">${c}</span></div>`; }
  if (t < 0.1) h += `<div style="position:absolute;inset:0;background:#000;opacity:${1 - t / 0.1}"></div>`;
  ov.innerHTML = h;
};
await Promise.all(["lockup-horizontal.svg", "mito.jpg", "dna.jpg", "r1.jpg", "quiz.jpg"].map((s) => new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = s; })));
window.renderAt(0); setTimeout(() => (window.ready = true), 400);
</script></body></html>
