<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Unb;src:url(Unbounded-700.ttf)} @font-face{font-family:Ins;src:url(InstrumentSans-600.ttf)}
html,body{margin:0;width:720px;height:1280px;overflow:hidden;background:#0d1020}
#c{position:absolute;inset:0} #ov{position:absolute;inset:0;overflow:hidden}
</style></head><body><canvas id="c" width="720" height="1280"></canvas><div id="ov"></div>
<script type="importmap">{ "imports": { "three": "./three/three.module.js" } }</script>
<script type="module">
import * as THREE from "three";
import { docToReels } from "./doc-to-reels.js";
const TL = await (await fetch("tl.json")).json(); const lines = TL.lines, DUR = TL.dur, ENV = TL.env; window.DUR = DUR;
await Promise.all([document.fonts.load("700 40px Unb"), document.fonts.load("600 20px Ins")]);
const W = 720, H = 1280, clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), mix = (a, b, x) => a + (b - a) * x;
const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }, v3 = (x, y, z) => new THREE.Vector3(x, y, z);
const outBack = (x) => { x = clamp(x); const k = 1.7; return 1 + (k + 1) * Math.pow(x - 1, 3) + k * Math.pow(x - 1, 2); };
const LIME = "#d3f05a";
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false); renderer.setPixelRatio(1); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color("#121633"); scene.fog = new THREE.Fog("#121633", 8, 20);
const camera = new THREE.PerspectiveCamera(35, W / H, 0.05, 100);
const F = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.75, flatShading: true, ...o });
const mesh = (g, m, p, parent) => { const x = new THREE.Mesh(g, m); x.castShadow = x.receiveShadow = true; if (p) x.position.copy(p); (parent || scene).add(x); return x; };
const grp = (parent, p) => { const g = new THREE.Group(); if (p) g.position.copy(p); (parent || scene).add(g); return g; };

// ---------- night room ----------
scene.add(new THREE.HemisphereLight("#8fa0ff", "#2a1d14", 0.55));
const lamp = new THREE.PointLight("#ffc27a", 26, 9, 1.6); lamp.position.set(1.9, 2.4, 1.2); lamp.castShadow = true; lamp.shadow.mapSize.set(1024, 1024); scene.add(lamp);
const rim = new THREE.DirectionalLight("#6f8cff", 1.4); rim.position.set(-3, 3, -2); scene.add(rim);
const fill = new THREE.DirectionalLight("#ffe2c0", 0.6); fill.position.set(0, 2, 5); scene.add(fill);
mesh(new THREE.PlaneGeometry(20, 10), F("#1d2347"), v3(0, 3, -1.6));
mesh(new THREE.PlaneGeometry(20, 20), F("#2b2238"), v3(0, -0.6, 0)).rotation.x = -Math.PI / 2;
// window with city lights
const win = grp(null, v3(-1.6, 2.6, -1.55));
mesh(new THREE.BoxGeometry(2.2, 1.7, 0.05), F("#0b0e26", { emissive: "#0b1240", emissiveIntensity: 0.6 }), v3(0, 0, 0), win);
for (let i = 0; i < 26; i++) { const x = -0.95 + (i * 0.37) % 1.9, y = -0.75 + ((i * 7) % 6) * 0.1; mesh(new THREE.BoxGeometry(0.06, 0.08, 0.01), new THREE.MeshBasicMaterial({ color: i % 3 ? "#ffd27a" : "#9fc3ff" }), v3(x, y, 0.04), win); }
[[0, 0, 2.3, 0.08], [0, 0, 0.08, 1.8]].forEach(([x, y, w, h]) => mesh(new THREE.BoxGeometry(w, h, 0.08), F("#3a3550"), v3(x, y, 0.05), win));
// desk + books + lamp body
mesh(new THREE.BoxGeometry(4.2, 0.12, 1.6), F("#a8723f"), v3(0.3, 0.6, 0.2));
const bookCols = ["#c0392b", "#2e86de", "#f1c40f", "#27ae60", "#8e44ad"];
for (let i = 0; i < 4; i++) mesh(new THREE.BoxGeometry(0.95 - i * 0.05, 0.13, 0.7), F(bookCols[i]), v3(1.3, 0.73 + i * 0.13, 0.35)).rotation.y = Math.sin(i * 2) * 0.12;
for (let i = 0; i < 5; i++) mesh(new THREE.BoxGeometry(0.8, 0.12, 0.6), F(bookCols[(i + 2) % 5]), v3(-1.6, 0.72 + i * 0.12, 0.4)).rotation.y = Math.sin(i * 3) * 0.15;
mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.0, 6), F("#2b2b2b"), v3(2.0, 1.15, 0.0)); mesh(new THREE.ConeGeometry(0.32, 0.35, 6, 1, true), F("#e8e0c8", { side: THREE.DoubleSide }), v3(2.0, 1.7, 0.1));

// ---------- the student ----------
const kid = grp(null, v3(-0.55, 0, 0));
const skin = F("#e6b18a"), hoodie = F("#6c4bd4"), dark = F("#141414");
mesh(new THREE.CylinderGeometry(0.62, 0.78, 1.0, 7), hoodie, v3(0, 0.95, -0.1), kid);
mesh(new THREE.CylinderGeometry(0.17, 0.2, 0.25, 7), skin, v3(0, 1.52, -0.05), kid);
[-1, 1].forEach((sd) => { const a = grp(kid, v3(sd * 0.72, 1.3, 0)); a.rotation.set(-0.9, 0, sd * 0.25); const u = mesh(new THREE.CylinderGeometry(0.15, 0.13, 0.75, 6), hoodie, v3(0, -0.35, 0), a); mesh(new THREE.IcosahedronGeometry(0.12, 0), skin, v3(0, -0.78, 0), a); });
const head = grp(kid, v3(0, 1.95, 0));
mesh(new THREE.IcosahedronGeometry(0.5, 1), skin, v3(0, 0, 0), head).scale.set(1, 1.12, 0.98);
const hairMat = F("#2c1c14");
for (let i = 0; i < 9; i++) { const a = (i / 9) * Math.PI * 2; const c = mesh(new THREE.ConeGeometry(0.2, 0.42, 5), hairMat, v3(Math.sin(a) * 0.3, 0.42 + Math.cos(a * 2) * 0.04, Math.cos(a) * 0.26 - 0.06), head); c.rotation.set(Math.cos(a) * 0.7, 0, -Math.sin(a) * 0.7); }
mesh(new THREE.IcosahedronGeometry(0.45, 0), hairMat, v3(0, 0.3, -0.12), head).scale.set(1.05, 0.6, 1);
const eyes = [-1, 1].map((s) => { const e = mesh(new THREE.SphereGeometry(0.07, 8, 6), dark, v3(s * 0.18, 0.05, 0.45), head); return e; });
const brows = [-1, 1].map((s) => mesh(new THREE.BoxGeometry(0.17, 0.035, 0.03), hairMat, v3(s * 0.18, 0.22, 0.47), head));
const glassMat = F("#111111");
[-1, 1].forEach((s) => { const r = mesh(new THREE.TorusGeometry(0.14, 0.022, 6, 14), glassMat, v3(s * 0.18, 0.05, 0.5), head); });
mesh(new THREE.BoxGeometry(0.1, 0.025, 0.02), glassMat, v3(0, 0.07, 0.52), head);
const mouth = mesh(new THREE.BoxGeometry(0.16, 0.04, 0.03), F("#5a1f1f"), v3(0, -0.24, 0.46), head);
const phone = grp(kid, v3(0.05, 1.18, 0.62)); phone.visible = false;
mesh(new THREE.BoxGeometry(0.26, 0.48, 0.03), dark, v3(0, 0, 0), phone);
const phoneTex = new THREE.TextureLoader().load("leaf.jpg"); phoneTex.colorSpace = THREE.SRGBColorSpace;
const screen = mesh(new THREE.PlaneGeometry(0.23, 0.42), new THREE.MeshBasicMaterial({ map: phoneTex, toneMapped: false }), v3(0, 0, -0.017), phone); screen.rotation.y = Math.PI;
phone.rotation.set(-0.4, 0, 0);
const phoneGlow = new THREE.PointLight("#bfe0ff", 0, 2.2, 1.5); phoneGlow.position.set(0, 1.5, 0.8); kid.add(phoneGlow);

// ---------- Spool, the mascot: a thread spool with a face ----------
const spool = grp(null, v3(1.3, 1.7, 0.35));
const wood = F("#e7cf9b"), thread = F(LIME, { roughness: 0.6 });
mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.1, 8), wood, v3(0, 0.38, 0), spool); mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.1, 8), wood, v3(0, -0.28, 0), spool);
mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.56, 8), thread, v3(0, 0.05, 0), spool);
for (let i = 0; i < 6; i++) mesh(new THREE.TorusGeometry(0.305, 0.012, 4, 8), F("#b9d443"), v3(0, -0.18 + i * 0.09, 0), spool).rotation.x = Math.PI / 2;
const sEyes = [-1, 1].map((s) => mesh(new THREE.BoxGeometry(0.08, 0.13, 0.03), dark, v3(s * 0.11, 0.12, 0.3), spool));
const sMouth = mesh(new THREE.BoxGeometry(0.12, 0.03, 0.03), dark, v3(0, -0.03, 0.3), spool);
const sArms = [-1, 1].map((s) => { const a = grp(spool, v3(s * 0.32, 0.05, 0)); mesh(new THREE.BoxGeometry(0.05, 0.3, 0.05), dark, v3(0, -0.15, 0), a); return a; });
[-1, 1].forEach((s) => mesh(new THREE.BoxGeometry(0.06, 0.18, 0.06), dark, v3(s * 0.12, -0.42, 0), spool));
const tail = mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([v3(0.3, 0.1, 0), v3(0.5, 0.0, 0.1), v3(0.55, -0.25, 0.25), v3(0.7, -0.5, 0.2)]), 20, 0.015, 5), thread, v3(0, 0, 0), spool);

const shotIdx = (t) => { let k = 0; for (let i = 0; i < lines.length; i++) if (t >= lines[i].s - 0.12) k = i; return k; };
const st = (n) => lines.find((l) => l.shot === n).s - 0.12;
const cam = (p, l, f) => { camera.position.copy(p); camera.lookAt(l); camera.fov = f; camera.updateProjectionMatrix(); };
const ov = document.getElementById("ov");
const talk = (t, L, who) => (L.voice === who && t > L.s && t < L.e ? ENV[Math.min(ENV.length - 1, Math.floor(t * 30))] || 0 : 0);
const chip = `<div style="position:absolute;left:24px;top:74px;background:${LIME};color:#0f1d18;font:700 18px Unb;padding:6px 12px;border-radius:8px">unspool</div>`;
const card = (inner, k) => `<div style="position:absolute;left:46px;right:46px;top:430px;transform:scale(${outBack(k)});background:#0f1428;border:2px solid ${LIME};border-radius:22px;padding:28px;box-shadow:0 0 40px rgba(211,240,90,.35),0 20px 60px rgba(0,0,0,.6);color:#e9f0e3;font:600 24px Ins">${inner}</div>`;

const canvas = document.getElementById("c");
const SPEAK = { am_puck: ["YOU", "#5b8cff", "#fff"], af_bella: ["SPOOL", LIME, "#0f1d18"] };
// the format: a speaker chip over a dark subtitle pill
const say = (L, top) => { const [who, bg, fg] = SPEAK[L.voice] || SPEAK.af_bella;
  return `<div style="position:absolute;left:0;right:0;top:${top}px;text-align:center"><span style="display:inline-block;background:${bg};color:${fg};font:700 15px Unb;letter-spacing:1px;padding:4px 10px;border-radius:6px">${who}</span></div>
  <div style="position:absolute;left:44px;right:44px;top:${top + 34}px;text-align:center"><span style="display:inline-block;background:rgba(20,22,28,.86);color:#fff;font:600 33px/1.25 Ins;padding:12px 22px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.35)">${L.text}</span></div>`; };
// a step card: STEP n/3 chip, progress, title, then an app window
const STEPS = { step1: 1, step2: 2, step3: 3 };
const appWin = (inner) => `<div style="background:#fbfbf8;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.55)"><div style="display:flex;align-items:center;gap:8px;padding:12px 14px;background:#ecebe6;border-bottom:1px solid #dddcd5">${["#ff5f57", "#febc2e", "#28c840"].map((c) => `<span style="width:13px;height:13px;border-radius:50%;background:${c}"></span>`).join("")}<span style="margin-left:14px;font:600 16px Ins;color:#7a7d85">unspool.cc</span></div><div style="padding:24px;color:#1c1f26;font:600 26px Ins">${inner}</div></div>`;
function stepCard(n, title, inner, k) { return `<div style="position:absolute;left:26px;right:26px;top:320px;transform:translateY(${(1 - ease(k)) * 40}px) scale(${mix(0.94, 1, ease(k))});opacity:${clamp(k * 2)}">
  <div style="display:flex;align-items:center;gap:12px"><span style="background:${LIME};color:#0f1d18;font:700 15px Unb;padding:5px 10px;border-radius:6px">STEP ${n}/3</span><div style="flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${[1, 2, 3].map((x) => `<div style="height:5px;border-radius:3px;background:${x <= n ? LIME : "rgba(255,255,255,.25)"}"></div>`).join("")}</div></div>
  <div style="margin:14px 0 14px;font:600 44px Georgia,serif;color:#fff">${title}</div>${appWin(inner)}</div>`; }

window.renderAt = (t) => {
  const i = shotIdx(t), L = lines[i], shot = L.shot, lt = t - (L.s - 0.12), len = L.e - L.s + 0.3;
  const kidTalk = talk(t, L, "am_puck"), spTalk = talk(t, L, "af_bella");
  const relief = t > st("y4"); const panic = t < st("step1") ? 1 : 0;
  head.rotation.set(Math.sin(t * 2.1) * 0.03 + (relief ? -0.05 : 0), Math.sin(t * 1.3) * 0.06, 0);
  head.position.x = panic ? Math.sin(t * 31) * 0.008 : 0;
  brows.forEach((b, j) => { b.position.y = panic ? 0.27 : relief ? 0.24 : 0.22; b.rotation.z = (j ? -1 : 1) * (panic ? -0.25 : relief ? 0.1 : 0); });
  eyes.forEach((e) => e.scale.setScalar(shot === "y3" ? 1.45 : panic ? 1.25 : 1));
  mouth.scale.set(relief && !kidTalk ? 1.6 : 1, 1 + kidTalk * 4.5 + (shot === "y3" ? 2 : 0), 1); mouth.position.y = relief && !kidTalk ? -0.22 : -0.24;
  phone.visible = relief; phoneGlow.intensity = relief ? 2.5 : 0;
  spool.position.y = 1.7 + Math.abs(Math.sin(t * 6)) * 0.04 * (spTalk > 0.05 ? 1 : 0.2); spool.rotation.y = Math.sin(t * 0.9) * 0.15 - 0.2;
  sMouth.scale.set(1, 1 + spTalk * 5, 1);
  sArms[1].rotation.z = shot === "s2" ? 2.4 + Math.sin(t * 9) * 0.3 : shot === "s3" || shot === "s4" ? 2.0 : 0.2; sArms[0].rotation.z = -0.2;
  sEyes[1].scale.y = shot === "s4" && lt > 1.2 && lt < 1.55 ? 0.15 : 1;
  const hk = kid.position.clone().add(v3(0, 1.95, 0)), hs = spool.position.clone();
  const kidShot = shot[0] === "y", wide = shot === "cta" || shot === "end";
  if (kidShot) { const k = ease(lt / 3); cam(v3(hk.x + 0.4, hk.y + 0.05, mix(4.6, 4.0, k)).add(v3(shot === "y3" ? Math.sin(t * 40) * 0.02 : 0, 0, 0)), hk.clone().add(v3(0, -0.45, 0)), 35); }
  else if (!wide) cam(v3(hs.x - 0.5, hs.y + 0.15, 3.9 - lt * 0.06), hs.clone().add(v3(0, -0.2, 0)), 35);
  else cam(v3(0.4, 2.1, 9.0 - clamp(lt / 3) * 0.8), v3(0.4, 1.35, 0), 35);
  renderer.render(scene, camera);

  const step = STEPS[shot]; const blur = step || shot === "s3" || wide;
  canvas.style.filter = blur ? "blur(7px) brightness(.62)" : "none";
  let h = "";
  if (shot === "step1") { const p = Math.round(100 * ease((lt - 0.6) / 1.4)), done = p >= 100;
    h += stepCard(1, "Drop in your notes", `<div style="display:flex;align-items:center;gap:14px"><div style="background:#e5483b;color:#fff;font:700 16px Unb;padding:9px 10px;border-radius:8px">PDF</div><div style="flex:1"><div>bio-notes.pdf</div><div style="color:#8a8f99;font-size:18px">64 pages · ${done ? "read" : "reading… " + p + "%"}</div></div>${done ? `<span style="color:#1f9d55;font-size:30px">✓</span>` : ""}</div><div style="margin-top:16px;height:9px;border-radius:5px;background:#e3e4dd"><div style="height:9px;border-radius:5px;width:${p}%;background:#7fae1f"></div></div>`, lt / 0.35); }
  if (shot === "step2") {
    if (lt < 2.3) h += `<div style="position:absolute;inset:0;background:rgba(10,13,26,.6)"></div>` + docToReels(lt, { title: 'Every idea → <span style="color:#d3f05a">a reel</span>', titleTop: 330, docTitle: "Bio notes" });
    else { const k = lt - 2.3, n = Math.min(18, Math.round(18 * ease(k / 1.2)));
      const rows = ["Photosynthesis", "Light reactions", "The Calvin cycle", "Cellular respiration"].map((r, x) => `<div style="display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #ecece6;opacity:${clamp((k - x * 0.18) / 0.2)}"><span style="width:30px;height:46px;border-radius:5px;background:linear-gradient(#2d4a33,#101a13)"></span><span style="flex:1">${x + 1}. ${r}</span><span style="color:#1f9d55;font-size:18px">▶ ready</span></div>`).join("");
      h += stepCard(2, "Every idea → a reel", `<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:#8a8f99;font-size:18px">bio-notes.pdf</span><span style="font:700 34px Unb;color:#1c1f26">${n} <span style="font:600 18px Ins;color:#8a8f99">reels</span></span></div>${rows}`, k / 0.3); } }
  if (shot === "step3") { const tap = lt > 1.6;
    h += stepCard(3, "A quiz in every reel", `<div style="font:700 24px/1.3 Ins">Where does the Calvin cycle happen?</div>${["Thylakoid", "Stroma", "Nucleus"].map((o, x) => { const r = x === 1 && tap; return `<div style="margin-top:12px;padding:13px 16px;border-radius:12px;border:2px solid ${r ? "#7fae1f" : "#dcdcd4"};background:${r ? "#eef7d6" : "#fff"};color:${r ? "#3d6b00" : "#1c1f26"}">${String.fromCharCode(65 + x)}. ${o}${r ? " ✓" : ""}</div>`; }).join("")}${tap ? `<div style="margin-top:14px;font:700 26px Unb;color:#5d9300;transform:scale(${outBack((lt - 1.7) / 0.3)});transform-origin:left">Correct! 🔥</div>` : ""}`, lt / 0.35); }
  if (shot === "s3") { const k = outBack(lt / 0.35);
    h += `<div style="position:absolute;left:50%;top:330px;width:300px;height:560px;margin-left:-150px;border-radius:38px;background:#000;padding:10px;transform:scale(${k});box-shadow:0 20px 60px rgba(0,0,0,.6)"><div style="width:100%;height:100%;border-radius:30px;overflow:hidden"><img src="leaf.jpg" style="width:100%;height:100%;object-fit:cover"></div></div>`; }
  if (wide) { const lc = t - st("cta"), a = clamp(lc / 0.25);
    h += `<div style="position:absolute;inset:0;background:linear-gradient(#1a1f3a,#2d2440 55%,#4a3242);opacity:${a * 0.92}"></div>`;
    h += `<div style="position:absolute;left:0;right:0;top:330px;text-align:center;opacity:${a}"><div style="display:inline-block;transform:scale(${outBack((lc - 0.1) / 0.4)})"><svg width="150" height="150" viewBox="-75 -75 150 150"><rect x="-55" y="-66" width="110" height="18" rx="6" fill="#e7cf9b"/><rect x="-55" y="48" width="110" height="18" rx="6" fill="#e7cf9b"/><rect x="-40" y="-48" width="80" height="96" fill="${LIME}"/><rect x="-18" y="-18" width="9" height="16" fill="#141414"/><rect x="9" y="-18" width="9" height="16" fill="#141414"/><path d="M-12 12 Q0 22 12 12" stroke="#141414" stroke-width="5" fill="none" stroke-linecap="round"/></svg></div></div>`;
    h += `<div style="position:absolute;left:40px;right:40px;top:530px;text-align:center;opacity:${clamp((lc - 0.25) / 0.3)};font:400 46px/1.15 Georgia,serif;color:#fff">Send this to a friend<br>with a <i style="color:${LIME}">final tomorrow</i></div>`;
    h += `<div style="position:absolute;left:0;right:0;top:720px;text-align:center;transform:scale(${outBack((lc - 0.6) / 0.35)})"><span style="display:inline-block;background:${LIME};color:#0f1d18;font:700 44px Unb;padding:16px 34px;border-radius:44px;letter-spacing:-1px">unspool.cc</span></div>`;
    h += `<div style="position:absolute;left:0;right:0;top:830px;text-align:center;opacity:${clamp((lc - 0.9) / 0.3)};font:600 24px Ins;color:rgba(255,255,255,.7)">first reel free</div>`; }
  if (L.text && !wide) h += say(L, step ? 160 : shot === "s3" ? 160 : 150);
  if (t < 0.1) h += `<div style="position:absolute;inset:0;background:#000;opacity:${1 - t / 0.1}"></div>`;
  ov.innerHTML = h;
};
await Promise.all(["lockup-horizontal.svg", "mito.jpg", "dna.jpg", "r1.jpg", "leaf.jpg", "quiz.jpg"].map((s) => new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = s; })));
window.renderAt(0); setTimeout(() => (window.ready = true), 600);
</script></body></html>
