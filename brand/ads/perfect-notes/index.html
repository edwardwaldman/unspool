const words = WORDS.map((w, i) => { const t = tex(512, 128, (c, ww, hh) => { c.font = "700 54px Ins"; c.textAlign = "center"; c.textBaseline = "middle"; c.fillStyle = "#e9f4ff"; c.shadowColor = "#6fd6ff"; c.shadowBlur = 18; c.fillText(w, ww / 2, hh / 2); });

const shotIdx = (t) => { let k = 0; for (let i = 0; i < lines.length; i++) if (t >= lines[i].s - 0.12) k = i; return k; };

const battery = (lvl, col) => `<div style="display:inline-flex;align-items:center"><div style="width:96px;height:46px;border:5px solid ${col};border-radius:12px;padding:4px;box-sizing:border-box;box-shadow:0 0 24px ${col}"><div style="height:100%;width:${lvl * 100}%;background:${col};border-radius:4px"></div></div><div style="width:8px;height:18px;background:${col};border-radius:0 4px 4px 0;margin-left:3px"></div></div>`;

window.renderAt = (t) => {
  const i = shotIdx(t), L = lines[i], shot = L.shot, lt = t - (L.s - 0.12), len = L.e - L.s + 0.3;

    const hp = v3(0, 1.95, 0.2);

    if (["pivot", "cta", "end"].includes(shot)) p = v3(0, 1.95, 8);

    ghost.head.rotation.y = Math.sin(t * 0.5) * 0.05;
    ansDot.visible = false; spark.visible = false; if (pathMesh) pathMesh.visible = false;
    // words drift in while reading; everything looks connected
    words.forEach((w) => (w.visible = false));
    if (shot === "feels") WORDS.forEach((_, j) => { const u = clamp((lt - 0.1 - j * 0.5) / 0.9); if (u <= 0 || u >= 1) return; const w = words[j]; w.visible = true;
      const e = ease(u); w.position.set(mix(-1.6, 1.6, e), 1.25 + j * 0.12 + Math.sin(e * Math.PI) * 0.5, 1.3); w.material.opacity = Math.min(clamp(u / 0.15), 1 - clamp((u - 0.85) / 0.15)); w.scale.set(1.0, 0.25, 1); });

    if (shot === "test") { const k = outBack((lt - 0.3) / 0.3); if (lt > 0.3) h += `<div style="position:absolute;left:380px;top:330px;transform:scale(${k}) rotate(3deg);transform-origin:left bottom;background:#fff;color:#14182b;font:700 34px Unb;padding:14px 22px;border-radius:22px 22px 22px 4px;box-shadow:0 10px 30px rgba(0,0,0,.4)">Pop quiz.</div>`;
      if (cracked) { [[5, 0], [14, 1], [21, 2]].forEach(([j, q]) => { const [x, y] = proj(dots[j].position); h += `<div style="position:absolute;left:${x - 12}px;top:${y - 44}px;transform:scale(${outBack((lt - 1.2 - q * 0.15) / 0.25)});font:700 34px Unb;color:${RED};text-shadow:0 0 12px #000">?</div>`; }); h += `<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,transparent 45%,rgba(227,38,47,${0.3 * Math.max(0, 1 - (lt - 1.0) / 1.2)}))"></div>`; } }
    if (shot === "fix") { h += `<div style="position:absolute;left:0;right:0;top:330px;text-align:center">${[1, 2, 3, 4, 5].map((q) => `<span style="display:inline-block;margin:0 5px;background:${q <= qn ? LIME : "rgba(255,255,255,.12)"};color:#0f1d18;font:700 20px Unb;padding:8px 12px;border-radius:12px;transform:scale(${q === qn && qT < 0.3 ? 1.2 : 1})">Q${q}${q <= qn ? " ✓" : ""}</span>`).join("")}</div>`; }
    if (shot === "pivot") { const DT = 2.4, q = lt - DT, pp = outBack(q / 0.4);
      h += `<div style="position:absolute;inset:0;background:rgba(7,12,58,${clamp(lt / 0.25) * 0.85})"></div>`;
      if (q < 0) h += docToReels(lt, { title: 'Your notes<br>→ <span style="color:#d3f05a">reels</span>', docTitle: "Bio notes", badge: "NOTES" });
      else { h += `<div style="position:absolute;left:0;right:0;top:140px;text-align:center;font:700 40px/1.15 Unb;color:#fff">Then it<br><span style="color:${LIME}">quizzes you</span></div>`;
        h += `<div style="position:absolute;left:50%;top:330px;width:330px;height:620px;margin-left:-165px;border-radius:40px;background:#000;padding:12px;transform:scale(${pp});box-shadow:0 20px 60px rgba(0,0,0,.6)"><div style="position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden"><img src="quiz.jpg" style="width:100%;height:100%;object-fit:cover"></div></div>`; } }
    if (shot === "cta" || shot === "end") { const lc = t - st("cta"); const a = clamp(lc / 0.2);
      h += `<div style="position:absolute;inset:0;background:#0b0f0d;opacity:${a}"></div><div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(211,240,90,.2),transparent 60%);opacity:${a}"></div>`;
      h += `<img src="lockup-horizontal.svg" style="position:absolute;left:210px;width:300px;top:400px;opacity:${clamp((lc - 0.3) / 0.3)}">`;
      h += `<div style="position:absolute;left:0;right:0;top:520px;text-align:center;transform:scale(${mix(1.3, 1, ease(lc / 0.25))});opacity:${a};font:700 100px/1 Unb;color:#fff;letter-spacing:-2px;text-shadow:0 0 50px rgba(211,240,90,.45)">unspool<span style="color:${LIME}">.cc</span></div>`;
      h += `<div style="position:absolute;left:50%;top:680px;transform:translateX(-50%) scale(${outBack((lc - 0.5) / 0.35)});background:${LIME};color:#0f1d18;font:600 30px Ins;padding:16px 32px;border-radius:40px;white-space:nowrap">First reel free</div>`; }
    if (shot === "how" && lt < 1.3) flash = 1 - clamp((lt - 0.9) / 0.4);
  }
  // hook title, copied from the reference: two lines, the last word in red
  if (inRoom || (shot === "how")) { const a = shot === "how" ? 1 - clamp((lt - 0.9) / 0.3) : 1;
    h += `<div style="position:absolute;left:0;right:0;top:120px;text-align:center;opacity:${a};font:700 44px/1.16 Unb;color:#14182b;letter-spacing:-1px;text-shadow:0 2px 0 rgba(255,255,255,.5)">Made perfect notes.<br>Remember <span style="color:#e3262f">none of it.</span></div>`; }
  if (!["pivot", "cta", "end"].includes(shot)) { const c = caption(t, L); if (c) h += `<div style="position:absolute;left:0;right:0;top:1000px;text-align:center"><span style="display:inline-block;max-width:600px;background:rgba(14,18,40,.78);font:600 30px/1.3 Ins;padding:10px 18px;border-radius:12px">${c}</span></div>`; }
  if (flash) h += `<div style="position:absolute;inset:0;background:#fff;opacity:${flash}"></div>`;
  if (t < 0.12) h += `<div style="position:absolute;inset:0;background:#000;opacity:${1 - t / 0.12}"></div>`;
  ov.innerHTML = h;
};
await Promise.all(["lockup-horizontal.svg", "quiz.jpg"].map((s) => new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = s; })));
window.renderAt(0); setTimeout(() => (window.ready = true), 400);
