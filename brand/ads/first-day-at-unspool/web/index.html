const TL = await (await fetch("tl.json")).json(); const lines = TL.lines, DUR = TL.dur; window.DUR = DUR;

// ---------------- faces (drawn on a canvas, swapped per beat) ----------------

  g.fillStyle = "rgba(0,0,0,0)"; g.clearRect(0, 0, w, h);

// ---------------- captions: one yellow word at a time ----------------
const ov = document.getElementById("ov");
function caption(l, t) {
  const words = l.text.split(" "); let wi = -1; l.ws.forEach((s, k) => { if (t >= s - 0.03) wi = k; }); if (wi < 0) return "";
  const w = words[wi].replace(/[",.!?:]/g, "").replace(/^"/, ""), k = clamp((t - l.ws[wi]) / 0.1);
  return `<div style="position:absolute;left:0;right:0;top:790px;text-align:center;transform:scale(${1 + 0.25 * (1 - ease(k))})"><span style="font:800 66px Arc;color:#ffd400;-webkit-text-stroke:9px #000;paint-order:stroke;text-shadow:0 6px 0 #000">${w.toLowerCase()}</span></div>`;
}
window.renderAt = (t) => {
  let i = 0; lines.forEach((l, j) => { if (t >= l.s - 0.08) i = j; });
  const l = lines[i], lt = t - (l.s - 0.08);
  [supervisor, manager, minister, owner].forEach((c) => (c.g.visible = false)); hero.g.position.y = 0; hero.g.visible = true; heroDesk.visible = true; finger.visible = false; friend.g.visible = false; fPhone.visible = false;
  if (t > DUR - 1.6) { const scene = SHOT.omg(2); renderer.render(scene, camera); }
  else { const wi = l.ws.filter((w) => w <= t).length; const scene = l.shot.startsWith("whine") ? SHOT.whine(lt, t, Number(l.shot.slice(5))) : (l === TL.lines[0] ? SHOT.whine(t - l.ws[Math.max(0, wi - 1)], t, Math.max(1, wi)) : SHOT[l.shot](lt, t)); renderer.render(scene, camera); }
  let h = "";
  const b = BUBBLES[l.shot];
  if (b && t < (l.shot === "nextmorning" ? l.ws[13] : 99)) { const k = clamp((lt - 0.25) / 0.2), inn = b[0] === "in";
    h += `<div class="bub" style="${inn ? "left:40px;background:#fff;color:#111;border-bottom-left-radius:6px" : "right:40px;background:#25d366;color:#fff;border-bottom-right-radius:6px"};top:250px;opacity:${k};transform:scale(${outBack(k)})">${b[1]}</div>`; }
  if (l.shot === "promote" && lt > 0.3) h += `<div style="position:absolute;left:0;right:0;top:220px;text-align:center;transform:rotate(-6deg) scale(${outBack((lt - 0.3) / 0.3)})"><span style="font:800 64px Arc;color:#d3f05a;-webkit-text-stroke:8px #0f1d18;paint-order:stroke">PROMOTED ⭐</span></div>`;
  if (t > DUR - 1.6) h += `<div style="position:absolute;inset:0;background:rgba(15,29,24,${0.85 * ease((t - (DUR - 1.6)) / 0.3)})"></div><div style="position:absolute;left:0;right:0;top:520px;text-align:center;color:#fff;font:800 40px Arc">turn your notes into reels</div><div style="position:absolute;left:0;right:0;top:590px;text-align:center"><span style="display:inline-block;background:#d3f05a;color:#0f1d18;font:800 46px Arc;border-radius:999px;padding:16px 34px">unspool.cc</span></div>`;
  else if (t <= l.e + 0.2) h += caption(l, t);

  const fl = Math.max(0, 1 - lt / 0.07); if (i > 0 && fl > 0) h += `<div style="position:absolute;inset:0;background:#fff;opacity:${fl * 0.3}"></div>`;
  ov.innerHTML = h;
};
