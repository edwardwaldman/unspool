<script type="importmap">{ "imports": { "three": "./three/three.module.js" } }</script>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "./three/RoomEnvironment.js";
const TL = await (await fetch("tl.json")).json(); const lines = TL.lines, DUR = TL.dur; window.DUR = DUR;
const W = 720, H = 1280, clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), mix = (a, b, x) => a + (b - a) * x;
const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }, v3 = (x, y, z) => new THREE.Vector3(x, y, z);
const outBack = (x) => { x = clamp(x); const k = 1.7; return 1 + (k + 1) * Math.pow(x - 1, 3) + k * Math.pow(x - 1, 2); };
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false); renderer.setPixelRatio(1); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0; renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); { const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.5; }
const camera = new THREE.PerspectiveCamera(40, W / H, 0.05, 400);
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.5, ...o });
const mesh = (g, m, p, parent, s) => { const x = new THREE.Mesh(g, m); x.castShadow = x.receiveShadow = true; if (p) x.position.copy(p); if (s) x.scale.copy(s); (parent || scene).add(x); return x; };
const sph = (r, n = 40) => new THREE.SphereGeometry(r, n, n / 2), cyl = (a, b, h, n = 32) => new THREE.CylinderGeometry(a, b, h, n);
const grp = (parent, p) => { const g = new THREE.Group(); if (p) g.position.copy(p); (parent || scene).add(g); return g; };
const tex = (w, h, draw) => { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };

// sky + sun
scene.background = tex(4, 256, (c, w, h) => { const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#3f8fe0"); g.addColorStop(0.7, "#9cd0f2"); g.addColorStop(1, "#e8f4fb"); c.fillStyle = g; c.fillRect(0, 0, w, h); });
scene.fog = new THREE.Fog("#cfe6f5", 40, 160);
scene.add(new THREE.HemisphereLight("#cfe8ff", "#6b8a4a", 0.9));
const sun = new THREE.DirectionalLight("#fff3dc", 3.0); sun.position.set(-20, 30, 15); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 100 }); sun.shadow.bias = -0.0004; scene.add(sun, sun.target);

// the hill: a long asphalt lane down a gentle slope (cars race along -x), grass both sides
const SLOPE = 0.06;
const world = grp(); world.rotation.z = SLOPE;
const asphalt = tex(1024, 256, (c, w, h) => { c.fillStyle = "#6d6f73"; c.fillRect(0, 0, w, h); for (let i = 0; i < 5000; i++) { c.fillStyle = `rgba(${Math.random() < 0.5 ? 0 : 255},${Math.random() < 0.5 ? 0 : 255},255,0.05)`; c.fillRect(Math.random() * w, Math.random() * h, 2, 2); } c.fillStyle = "#f2f2ee"; c.fillRect(0, h / 2 - 3, w, 6); c.fillRect(0, 6, w, 5); c.fillRect(0, h - 11, w, 5); });
asphalt.wrapS = THREE.RepeatWrapping; asphalt.repeat.set(12, 1);
const road = mesh(new THREE.PlaneGeometry(240, 6), M("#ffffff", { map: asphalt, roughness: 0.9 }), v3(-80, 0, 0), world); road.rotation.x = -Math.PI / 2;
const grass = mesh(new THREE.PlaneGeometry(400, 200), M("#7fae55", { roughness: 1 }), v3(-80, -0.02, 0), world); grass.rotation.x = -Math.PI / 2;
// crowd: rows of colourful capsules behind barriers
const crowdG = new THREE.CapsuleGeometry(0.22, 0.6, 4, 8);
const crowdCols = ["#d9534f", "#f0ad4e", "#5bc0de", "#5cb85c", "#ffffff", "#2b2b2b", "#9b59b6"];
const crowd = new THREE.InstancedMesh(crowdG, M("#ffffff", { roughness: 0.8 }), 1200); const dm = new THREE.Object3D(); let ci = 0;
for (let row = 0; row < 4; row++) for (let i = 0; i < 150; i++) for (const side of [-1, 1]) { if (ci >= 1200) break; dm.position.set(-200 + i * 1.4 + (row % 2) * 0.7, 0.45 + row * 0.3, side * (8 + row * 0.9)); dm.scale.setScalar(0.75); dm.updateMatrix(); crowd.setMatrixAt(ci, dm.matrix); crowd.setColorAt(ci, new THREE.Color(crowdCols[(i * 7 + row * 3 + (side > 0 ? 2 : 0)) % 7])); ci++; }
world.add(crowd);
[-1, 1].forEach((s) => { const bar = mesh(new THREE.BoxGeometry(240, 0.5, 0.08), M("#ffffff"), v3(-80, 0.25, s * 3.6), world); });

// starting gate: a red steel plate in front of each car, hinged at its foot
const START_X = 0;
const gates = [-1, 1].map((s) => { const g = grp(world, v3(START_X - 1.25, 0, s * 1.4)); const plate = mesh(new THREE.BoxGeometry(0.06, 0.7, 1.0), M("#c0262b", { metalness: 0.6, roughness: 0.35 }), v3(0, 0.35, 0), g); return g; });

// ---------- the cars: a cigar-shaped body (lathe), driver, wheels ----------
function car(color, num, label) {
  const g = grp(world); const pts = [];
  for (let i = 0; i <= 24; i++) { const u = i / 24; const r = 0.34 * Math.pow(Math.sin(Math.PI * Math.min(1, u * 1.05)), 0.7) * (u > 0.8 ? 1 - (u - 0.8) * 1.6 : 1); pts.push(new THREE.Vector2(Math.max(0.001, r), (u - 0.5) * 2.3)); }
  const bodyMat = new THREE.MeshPhysicalMaterial({ color, roughness: 0.25, metalness: 0.3, clearcoat: 1, transparent: true, opacity: 1 });
  const body = mesh(new THREE.LatheGeometry(pts, 40), bodyMat, v3(0, 0.38, 0), g); body.rotation.z = Math.PI / 2;  // long axis along x; nose at -x
  const decal = tex(512, 128, (c, w, h) => { c.clearRect(0, 0, w, h); c.font = "italic bold 54px 'DejaVu Sans'"; c.fillStyle = "#f5d76e"; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText(label, w / 2, h / 2); });
  [-1, 1].forEach((s) => { const d = mesh(new THREE.PlaneGeometry(0.8, 0.2), new THREE.MeshBasicMaterial({ map: decal, transparent: true }), v3(0.05, 0.42, s * 0.345), g); d.rotation.y = s > 0 ? 0 : Math.PI; d.castShadow = false; });
  const numTex = tex(128, 128, (c) => { c.fillStyle = "#fff"; c.beginPath(); c.arc(64, 64, 60, 0, 7); c.fill(); c.fillStyle = "#1d3d8f"; c.font = "bold 80px 'DejaVu Sans'"; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText(num, 64, 70); });
  [-1, 1].forEach((s) => { const d = mesh(new THREE.CircleGeometry(0.11, 24), new THREE.MeshBasicMaterial({ map: numTex }), v3(-0.6, 0.42, s * 0.322), g); d.rotation.y = s > 0 ? 0 : Math.PI; d.castShadow = false; });
  // cockpit hole + driver helmet + headrest
  mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.06, 28), M("#1a1a1a"), v3(0.25, 0.7, 0), g, v3(1.5, 1, 1));
  const helmet = grp(g, v3(0.38, 0.8, 0));
  mesh(sph(0.15), M("#f2f2f2", { roughness: 0.3 }), v3(0, 0, 0), helmet);
  mesh(new THREE.SphereGeometry(0.152, 24, 12, Math.PI * 0.6, Math.PI * 0.8, Math.PI * 0.35, Math.PI * 0.3), M("#20262e", { roughness: 0.1, metalness: 0.4 }), v3(0, 0, 0), helmet);
  const rest = mesh(new THREE.BoxGeometry(0.06, 0.2, 0.2), M("#2a2a2a"), v3(0.6, 0.78, 0), g);
  const wheels = [];
  [[-0.75, 1], [-0.75, -1], [0.85, 1], [0.85, -1]].forEach(([x, s]) => { const w = mesh(cyl(0.16, 0.16, 0.06, 28), M("#151515", { roughness: 0.8 }), v3(x, 0.16, s * 0.42), g); w.rotation.x = Math.PI / 2; mesh(cyl(0.08, 0.08, 0.065, 20), M("#f0d040", { metalness: 0.5 }), v3(0, 0, 0), w); wheels.push(w); });
  [-0.75, 0.85].forEach((x) => { const a = mesh(cyl(0.02, 0.02, 0.84, 10), M("#888", { metalness: 0.8 }), v3(x, 0.16, 0), g); a.rotation.x = Math.PI / 2; });
  return { g, body, bodyMat, helmet, rest, wheels };
}
const green = car("#4caf50", "12", "BOULDER, COLO."), blue = car("#2f5fd0", "7", "");
// the hidden electromagnet in the green car's nose, and the wire to the headrest switch
const coil = grp(green.g, v3(-0.82, 0.38, 0)); coil.visible = false;
mesh(cyl(0.09, 0.09, 0.22, 28), M("#b87333", { metalness: 0.8, roughness: 0.35 }), v3(0, 0, 0), coil).rotation.z = Math.PI / 2;
for (let i = 0; i < 9; i++) { const ring = mesh(new THREE.TorusGeometry(0.093, 0.008, 6, 28), M("#d08a45", { metalness: 0.8, roughness: 0.3 }), v3(-0.09 + i * 0.022, 0, 0), coil); ring.rotation.y = Math.PI / 2; }
mesh(cyl(0.035, 0.035, 0.3, 16), M("#9aa0a6", { metalness: 0.9, roughness: 0.25 }), v3(-0.02, 0, 0), coil).rotation.z = Math.PI / 2;
const wireMat = new THREE.MeshBasicMaterial({ color: "#3a3a3a", toneMapped: false });
const wire = mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([v3(-0.7, 0.4, 0.05), v3(-0.2, 0.52, 0.12), v3(0.3, 0.6, 0.12), v3(0.57, 0.78, 0.05)]), 40, 0.012, 8), wireMat, v3(0, 0, 0), green.g); wire.visible = false;
// magnetic field lines: magenta loops around the coil, and reaching out to the gate
const fieldMat = new THREE.MeshBasicMaterial({ color: "#ff3df2", transparent: true, opacity: 0.9, toneMapped: false });
const field = grp(green.g, v3(-0.82, 0.38, 0)); field.visible = false;
for (let k = 0; k < 8; k++) { const a = (k / 8) * Math.PI * 2; const pts = []; for (let i = 0; i <= 40; i++) { const u = (i / 40) * Math.PI * 2; const rx = 0.35, ry = 0.22; pts.push(v3(Math.cos(u) * rx, Math.sin(u) * ry + ry, 0).applyAxisAngle(v3(1, 0, 0), a)); } const tube = mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true), 60, 0.007, 6, true), fieldMat, v3(0, 0, 0), field); tube.castShadow = false; }
const reach = grp(green.g, v3(-0.82, 0.38, 0)); reach.visible = false;
for (let k = 0; k < 5; k++) { const z = (k - 2) * 0.1; const tube = mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([v3(-0.1, 0, z), v3(-0.3, 0.05 + Math.abs(z), z * 1.6), v3(-0.45, 0, z * 2)]), 30, 0.008, 6), fieldMat, v3(0, 0, 0), reach); tube.castShadow = false; }
const arrowTex = tex(256, 128, (c, w, h) => { c.fillStyle = "#ff3df2"; c.beginPath(); c.moveTo(0, 40); c.lineTo(160, 40); c.lineTo(160, 6); c.lineTo(250, 64); c.lineTo(160, 122); c.lineTo(160, 88); c.lineTo(0, 88); c.closePath(); c.fill(); });
const arrow = new THREE.Sprite(new THREE.SpriteMaterial({ map: arrowTex, toneMapped: false, depthTest: false })); arrow.scale.set(0.9, 0.45, 1); arrow.visible = false; scene.add(arrow);
// trophy
const trophy = grp(scene); trophy.visible = false; const gold = M("#e9b93a", { metalness: 0.9, roughness: 0.2 });
mesh(new THREE.LatheGeometry([0, 0.12, 0.16, 0.17, 0.14, 0.05, 0.04, 0.05, 0.1, 0.11].map((r, i) => new THREE.Vector2(Math.max(0.001, r), [0.42, 0.42, 0.36, 0.28, 0.2, 0.12, 0.06, 0.03, 0.02, 0][i])).reverse(), 40), gold, v3(0, 0, 0), trophy);
mesh(new THREE.BoxGeometry(0.26, 0.08, 0.26), M("#3a2a1e"), v3(0, -0.04, 0), trophy);
[-1, 1].forEach((s) => mesh(new THREE.TorusGeometry(0.07, 0.015, 8, 20, Math.PI), gold, v3(0.17 * s, 0.3, 0), trophy).rotation.z = s > 0 ? -Math.PI / 2 : Math.PI / 2);

// ---------- timeline ----------
const shotIdx = (t) => { let k = 0; for (let i = 0; i < lines.length; i++) if (t >= lines[i].s - 0.12) k = i; return k; };
const st = (n) => lines.find((l) => l.shot === n).s - 0.12;
const cam = (p, l, f) => { camera.position.copy(p); camera.lookAt(l); camera.fov = f; camera.updateProjectionMatrix(); };
const wp = (o, p) => { scene.updateMatrixWorld(true); return o.localToWorld(p.clone()); };
const ov = document.getElementById("ov");
function placeCars(xg, xb) { green.g.position.set(xg, 0, -1.4); blue.g.position.set(xb, 0, 1.4); [green, blue].forEach((c) => c.wheels.forEach((w) => (w.rotation.y = -c.g.position.x * 6))); }
function chunks(text) { const ws = text.split(" "); const out = []; let cur = []; for (const w of ws) { cur.push(w); if (cur.length >= 3 || /[,.?!]$/.test(w)) { out.push(cur.join(" ")); cur = []; } } if (cur.length) out.push(cur.join(" ")); return out; }
function capAt(t, L) { if (!L.text || t < L.s - 0.05 || t > L.e + 0.12) return ""; const cs = chunks(L.text); const tot = cs.reduce((a, c) => a + c.length + 2, 0); let acc = 0; const u = clamp((t - L.s) / (L.e - L.s)) * tot; for (const c of cs) { acc += c.length + 2; if (u < acc) return c; } return cs[cs.length - 1]; }
const REELS = ["reel-1.jpg", "reel-2.jpg", "reel-3.jpg"];

window.renderAt = (t) => {
  const i = shotIdx(t), L = lines[i], shot = L.shot, lt = t - (L.s - 0.12);
  coil.visible = field.visible = reach.visible = wire.visible = arrow.visible = trophy.visible = false; blue.g.visible = true; green.bodyMat.opacity = 1; green.bodyMat.color.set("#4caf50"); wireMat.color.set("#3a3a3a");
  gates.forEach((g) => (g.rotation.z = 0)); green.helmet.position.x = 0.38; green.helmet.rotation.set(0, 0, 0);
  const story = ["race", "xray", "magnet", "switch", "gate", "yank", "title"].includes(shot);
  if (shot === "race") { // racing down the hill, green just ahead
    const x = -4 - lt * 7; placeCars(x - 0.5 - lt * 0.15, x); gates.forEach((g) => (g.rotation.z = Math.PI / 2.2));
    const c = wp(green.g, v3(0, 0.4, 0)); cam(v3(c.x + 2.2 - lt * 0.2, c.y + 0.9, c.z - 3.2), v3(c.x - 0.6, c.y, c.z + 0.6), 42);
  } else if (shot === "xray" || shot === "magnet") { // parked: the body turns see-through, the coil appears
    placeCars(-60, -58); gates.forEach((g) => (g.rotation.z = Math.PI / 2.2));
    const k = shot === "xray" ? ease((lt - 0.4) / 0.8) : 1; green.bodyMat.opacity = 1 - 0.75 * k; green.bodyMat.color.lerp(new THREE.Color("#8fd0ff"), k * 0.6); coil.visible = k > 0.3;
    if (shot === "magnet") { field.visible = true; field.children.forEach((f, j) => (f.material.opacity = 0.5 + 0.5 * Math.sin(t * 6 + j))); field.rotation.x = t * 0.6; }
    const c = wp(green.g, v3(-0.8, 0.38, 0)); const orbit = shot === "xray" ? lt * 0.25 : 0.5 + lt * 0.15; const d = shot === "xray" ? 2.6 - lt * 0.3 : 1.25;
    cam(v3(c.x + Math.sin(orbit) * d * 0.6, c.y + 0.45, c.z - Math.cos(orbit) * d), c, 40);
  } else if (shot === "switch") { // he leans back: helmet hits the headrest switch, the wire lights up
    placeCars(START_X, START_X); green.bodyMat.opacity = 0.35; green.bodyMat.color.set("#8fd0ff"); coil.visible = wire.visible = true;
    const lean = ease((lt - 0.5) / 0.4); green.helmet.position.x = 0.38 + lean * 0.12; green.helmet.rotation.z = -lean * 0.3;
    if (lean > 0.95) { const p = clamp((lt - 0.9) / 0.6); wireMat.color.set(p > 0.2 ? "#ffe14d" : "#3a3a3a"); field.visible = p > 0.8; }
    const c = wp(green.g, v3(0.5, 0.78, 0)); blue.g.visible = false; cam(v3(c.x - 0.2, c.y + 0.32, c.z - 2.5), v3(c.x - 0.2, c.y - 0.1, c.z), 38);
  } else if (shot === "gate" || shot === "yank") {
    const drop = shot === "yank" ? ease((lt - 0.6) / 0.35) : 0; gates.forEach((g) => (g.rotation.z = drop * Math.PI / 2.2));
    const go = shot === "yank" ? clamp(lt - 0.6) : 0; const yank = shot === "yank" ? 0.45 * ease((lt - 0.6) / 0.5) : 0;
    placeCars(START_X - go * go * 1.4 - yank, START_X - go * go * 1.4);
    green.bodyMat.opacity = shot === "gate" ? 0.35 : mix(0.35, 1, clamp((lt - 1.4) / 0.4)); if (shot === "gate") green.bodyMat.color.set("#8fd0ff");
    coil.visible = shot === "gate" || lt < 1.4; field.visible = reach.visible = shot === "gate" || lt < 0.9;
    if (shot === "gate" || lt < 1.4) { const a = wp(green.g, v3(-1.15, 0.9, 0)); arrow.position.copy(a); arrow.visible = true; arrow.material.opacity = 0.6 + 0.4 * Math.sin(t * 8); }
    const c = wp(green.g, v3(-0.6, 0.4, 0)); cam(v3(c.x - 0.6, c.y + 0.7, c.z - 3.1), v3(c.x - 0.2, c.y + 0.1, c.z + 0.6), shot === "yank" ? 46 : 42);
  } else if (shot === "title") { // the trophy goes to the blue car
    placeCars(-70, -70); trophy.visible = true;
    const k = ease((lt - 1.3) / 0.9); const a = wp(green.g, v3(0, 1.05, 0)), b = wp(blue.g, v3(0, 1.05, 0));
    trophy.position.copy(a.clone().lerp(b, k)); trophy.position.y += Math.sin(k * Math.PI) * 0.5; trophy.rotation.y = t * 1.2;
    green.bodyMat.color.set("#4caf50").lerp(new THREE.Color("#777"), k * 0.6);
    const m = a.clone().lerp(b, 0.5); cam(v3(m.x + 1.0, m.y + 0.9, m.z - 4.6), v3(m.x, m.y - 0.2, m.z), 44);
  } else { placeCars(-70, -70); const m = wp(green.g, v3(0, 0.4, 0)); cam(v3(m.x + 3, m.y + 1.4, m.z - 4), m, 40); }
  sun.position.copy(camera.position).add(v3(-20, 30, 15)); sun.target.position.copy(camera.position);
  renderer.render(scene, camera);

  // overlay
  let h = "";
  if (story) { const c = capAt(t, L); if (c) h += `<div style="position:absolute;left:30px;right:30px;top:820px;text-align:center;font:700 44px/1.1 Ins;color:#fff;text-shadow:0 0 6px #000,0 3px 10px #000,2px 2px 0 #000,-2px -2px 0 #000">${c.toLowerCase()}</div>`; }
  if (shot === "xray" && lt > 0.3 && lt < 1.6) { const y = mix(0, 1280, (lt - 0.3) / 1.3); h += `<div style="position:absolute;left:0;right:0;top:${y}px;height:6px;background:#9fe0ff;box-shadow:0 0 30px 10px rgba(120,210,255,.6)"></div>`; }
  if (!story) {
    // the pivot: dark brand card, one big word at a time
    const k = shot === "learned" ? clamp(lt / 0.15) : 1;
    h += `<div style="position:absolute;inset:0;background:#0b0f0d;opacity:${k}"></div><div style="position:absolute;inset:0;opacity:${k};background:radial-gradient(circle at 50% 45%,rgba(211,240,90,.14),transparent 60%)"></div>`;
    if (shot === "learned") { const w = ["You just learned", "that in", "20 seconds."]; const n = lt < 0.7 ? 1 : lt < 1.2 ? 2 : 3; h += `<div style="position:absolute;left:40px;right:40px;top:430px;text-align:center;font:700 64px/1.1 Unb;color:#fff">${w.slice(0, n).map((s, j) => j === 2 ? `<span style="color:#d3f05a">${s}</span>` : s).join(" ")}</div>`; }
    if (shot === "bio") { const p = outBack(lt / 0.5); h += `<div style="position:absolute;left:40px;right:40px;top:300px;text-align:center;font:700 54px/1.15 Unb;color:#fff">Now imagine that was your <span style="color:#d3f05a">bio chapter.</span></div><div style="position:absolute;left:50%;top:620px;width:220px;height:290px;margin-left:-110px;transform:scale(${p}) rotate(-4deg);background:#b8322a;border-radius:10px;box-shadow:12px 14px 0 #e9e2cf;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f2d36b;font:700 30px 'DejaVu Sans'">BIOLOGY<div style="font-size:64px;margin-top:10px">400</div><div style="font-size:22px">PAGES</div></div>`; }

      h += `<div style="position:absolute;left:0;right:0;top:150px;text-align:center;font:700 40px/1.15 Unb;color:#fff">Any document<br>→ <span style="color:#d3f05a">reels like this</span></div><div style="position:absolute;left:50%;top:320px;width:330px;height:620px;margin-left:-165px;border-radius:40px;background:#000;padding:12px;transform:scale(${p})"><div style="position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden"><img src="${REELS[k2]}" style="position:absolute;left:0;top:${-sw * 100}%;width:100%;height:100%;object-fit:cover"><img src="${REELS[(k2 + 1) % 3]}" style="position:absolute;left:0;top:${(1 - sw) * 100}%;width:100%;height:100%;object-fit:cover"></div></div>`; }
