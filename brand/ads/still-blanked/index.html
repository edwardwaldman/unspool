const bookCols = ["#3b5bd6", "#e05a47", "#f2c14e", "#3d9b6b", "#7c4ad6", "#e8e2d4"]; const books = [];
for (let i = 0; i < 9; i++) books.push(mesh(new THREE.BoxGeometry(1.2 - (i % 3) * 0.08, 0.17, 0.9), M(bookCols[i % 6]), v3(-1.9 + Math.sin(i * 2.1) * 0.06, -0.03 + i * 0.175, 0.95), room));

const bodyMat = new THREE.MeshPhysicalMaterial({ color: "#2a3fd0", roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.15 });

const battery = (lvl, col) => `<div style="display:inline-flex;align-items:center"><div style="width:96px;height:46px;border:5px solid ${col};border-radius:12px;padding:4px;box-sizing:border-box;box-shadow:0 0 24px ${col}"><div style="height:100%;width:${lvl * 100}%;background:${col};border-radius:4px"></div></div><div style="width:8px;height:18px;background:${col};border-radius:0 4px 4px 0;margin-left:3px"></div></div>`;

window.renderAt = (t) => {

    if (drained > 0) { const [ex, ey] = proj(v3(0.15, -0.1, 1.55)); h += `<div style="position:absolute;left:${ex + 60}px;top:${ey - 120}px;transform:scale(${outBack((t - 2.4) / 0.3)}) rotate(10deg);font:700 92px Unb;color:${RED};text-shadow:0 4px 0 #7a1010">?</div>`; }

      if (u > 0 && u < 1) { const w = words[j]; w.visible = true; const from = v3((j % 2 ? 1 : -1) * 0.75, 1.5 + j * 0.22, 1.6); w.position.copy(from.clone().lerp(d.position, ease(u))); w.material.opacity = 1 - clamp((u - 0.75) / 0.25); w.scale.set(1.2 * (1 - 0.7 * ease(u)), 0.3 * (1 - 0.7 * ease(u)), 1); }

    if (["recall", "path", "quiz", "pivot", "cta", "end"].includes(shot)) { setPath(mix(0.006, 0.035, strength), mix(0.18, 1, strength)); pathMesh.visible = true; } else if (pathMesh) pathMesh.visible = false;

      h += `<div style="position:absolute;right:60px;top:250px;transform:scale(${b});transform-origin:right;background:rgba(255,255,255,.06);border:2px dashed rgba(255,255,255,.35);color:rgba(255,255,255,.55);font:700 22px Unb;padding:12px 18px;border-radius:14px">RECALL<div style="font:600 18px Ins;margin-top:4px">“I can say it” ?</div></div>`; }

      h += `<div style="position:absolute;left:${x + 18}px;top:${y - 12}px;font:600 19px Ins;color:${LIME};text-shadow:0 0 10px #000">the answer</div>`;

      h += `<div style="position:absolute;left:0;right:0;top:220px;text-align:center"><span style="display:inline-block;background:${LIME};color:#0f1d18;font:700 26px Unb;padding:12px 22px;border-radius:40px;transform:scale(${u > 1 && u < 1.3 ? 1.12 : 1})">QUIZ ${n} ✓</span></div>`;
      h += `<div style="position:absolute;left:50%;top:300px;transform:translateX(-50%);display:flex;gap:10px">${[1, 2, 3].map((q) => `<div style="width:56px;height:10px;border-radius:5px;background:${q <= n ? LIME : "rgba(255,255,255,.2)"}"></div>`).join("")}</div>`; }
    if (shot === "pivot") { const p = outBack(lt / 0.4);
      h += `<div style="position:absolute;inset:0;background:rgba(7,12,58,${clamp(lt / 0.3) * 0.7})"></div><div style="position:absolute;left:0;right:0;top:140px;text-align:center;font:700 40px/1.15 Unb;color:#fff;opacity:${clamp(lt / 0.3)}">Every reel<br>ends with a <span style="color:${LIME}">quiz</span></div>`;

      h += `<div style="position:absolute;inset:0;background:#0b0f0d;opacity:${a}"></div><div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(211,240,90,.15),transparent 60%);opacity:${a}"></div>`;
      h += `<img src="lockup-horizontal.svg" style="position:absolute;left:140px;width:440px;top:470px;opacity:${a}"><div style="position:absolute;left:0;right:0;top:590px;text-align:center;font:600 28px Ins;color:#b9c7b5;opacity:${a}">Your notes, as reels. Quiz included.</div><div style="position:absolute;left:50%;top:660px;transform:translateX(-50%) scale(${0.9 + 0.1 * a});opacity:${a};background:${LIME};color:#0f1d18;font:600 30px Ins;padding:18px 34px;border-radius:40px;white-space:nowrap;box-shadow:0 0 40px rgba(211,240,90,.4)">First reel free · unspool.cc</div>`; }
    if (shot === "how" && lt < 1.3) flash = 1 - clamp((lt - 0.9) / 0.4);
  }
  // hook title, copied from the reference: two lines, the last word in red
  if (inRoom || (shot === "how")) { const a = shot === "how" ? 1 - clamp((lt - 0.9) / 0.3) : 1;
    h += `<div style="position:absolute;left:0;right:0;top:120px;text-align:center;opacity:${a};font:700 60px/1.12 Unb;color:#14182b;letter-spacing:-1px;text-shadow:0 2px 0 rgba(255,255,255,.5)">Studied 10 hours.<br>Still <span style="color:#e3262f">blanked.</span></div>`; }
  if (!["pivot", "cta", "end"].includes(shot)) { const c = caption(t, L); if (c) h += `<div style="position:absolute;left:0;right:0;top:1000px;text-align:center"><span style="display:inline-block;max-width:600px;background:rgba(14,18,40,.78);font:600 30px/1.3 Ins;padding:10px 18px;border-radius:12px">${c}</span></div>`; }
  if (flash) h += `<div style="position:absolute;inset:0;background:#fff;opacity:${flash}"></div>`;
  if (t < 0.12) h += `<div style="position:absolute;inset:0;background:#000;opacity:${1 - t / 0.12}"></div>`;

};
