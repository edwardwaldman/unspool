<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Arc; src: url(Archivo-ExtraBold.ttf); }
@font-face { font-family: Unb; src: url(Unbounded-700.ttf); }
html, body { margin: 0; width: 720px; height: 1280px; overflow: hidden; background: #1b1830; }

svg { position: absolute; left: 0; top: 0; }
</style></head>
<body><div id="s"></div>
<script type="module">
// "What would you do if your textbook turned into TikToks?" A stick-figure story ad in the
// "what would you do" format: flat rooms, one or two words of caption at a time, comic sound bubbles.
const TL = await (await fetch("tl.json")).json(); const lines = TL.lines, DUR = TL.dur; window.DUR = DUR;
const S = document.getElementById("s");
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const inOut = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const outBack = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const mix = (a, b, k) => a + (b - a) * k;
const L = (n) => lines.find((l) => l.shot === n), st = (n) => L(n).s;
const O = "#14121c", TEAL = "#5ef2c4", LIME = "#d3f05a";
const pop = (k) => `opacity:${clamp(k * 3)};transform:scale(${outBack(k)})`;
const A = (x, y, inner, extra = "") => `<div style="position:absolute;left:${x}px;top:${y}px;${extra}">${inner}</div>`;
const svg = (inner) => `<svg width="720" height="1280" viewBox="0 0 720 1280">${inner}</svg>`;

// ---------------- stick figures ----------------
// origin at the feet; arms are [shoulder angle, elbow bend] in degrees (0 = straight down, + = outwards)
const FACES = {
  neutral: `<circle cx="-16" cy="-4" r="5"/><circle cx="16" cy="-4" r="5"/><path d="M-10 18 L10 18" stroke="${O}" stroke-width="5" stroke-linecap="round"/>`,
  happy: `<circle cx="-16" cy="-6" r="5"/><circle cx="16" cy="-6" r="5"/><path d="M-14 12 Q0 28 14 12" stroke="${O}" stroke-width="5" fill="none" stroke-linecap="round"/>`,
  grin: `<path d="M-22 -4 Q-16 -12 -10 -4 M10 -4 Q16 -12 22 -4" stroke="${O}" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-18 10 Q0 34 18 10 Z" fill="#7a2230"/>`,
  shock: `<circle cx="-17" cy="-8" r="11" fill="#fff" stroke="${O}" stroke-width="4"/><circle cx="17" cy="-8" r="11" fill="#fff" stroke="${O}" stroke-width="4"/><circle cx="-17" cy="-8" r="4"/><circle cx="17" cy="-8" r="4"/><ellipse cx="0" cy="20" rx="8" ry="11" fill="#7a2230"/>`,
  panic: `<circle cx="-17" cy="-8" r="12" fill="#fff" stroke="${O}" stroke-width="4"/><circle cx="17" cy="-8" r="12" fill="#fff" stroke="${O}" stroke-width="4"/><circle cx="-17" cy="-6" r="3"/><circle cx="17" cy="-6" r="3"/><path d="M-16 12 Q0 4 16 12 L14 28 Q0 36 -14 28 Z" fill="#7a2230" stroke="${O}" stroke-width="3"/><path d="M-12 14 L12 14" stroke="#fff" stroke-width="5"/>`,
  sleep: `<path d="M-24 -4 Q-16 4 -8 -4 M8 -4 Q16 4 24 -4" stroke="${O}" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="0" cy="18" r="5"/>`,
  smug: `<path d="M-24 -8 L-8 -8 M8 -8 L24 -8" stroke="${O}" stroke-width="5" stroke-linecap="round"/><circle cx="-16" cy="-3" r="4"/><circle cx="16" cy="-3" r="4"/><path d="M-10 16 Q4 22 14 12" stroke="${O}" stroke-width="5" fill="none" stroke-linecap="round"/>`,
  blank: `<circle cx="-16" cy="-4" r="7" fill="none" stroke="${O}" stroke-width="4"/><circle cx="16" cy="-4" r="7" fill="none" stroke="${O}" stroke-width="4"/><path d="M-8 20 L8 20" stroke="${O}" stroke-width="5" stroke-linecap="round"/>`,
  laugh: `<path d="M-24 -2 Q-16 -14 -8 -2 M8 -2 Q16 -14 24 -2" stroke="${O}" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-20 8 Q0 44 20 8 Z" fill="#7a2230" stroke="${O}" stroke-width="3"/>`,
};
function arm(sx, sy, a1, a2, side, len = 60) {
  const r = (d) => (d * Math.PI) / 180, d1 = r(a1) * side, ex = sx + Math.sin(d1) * len, ey = sy + Math.cos(d1) * len;
  const d2 = d1 + r(a2) * side, hx = ex + Math.sin(d2) * len, hy = ey + Math.cos(d2) * len;
  return { path: `M${sx} ${sy} L${ex} ${ey} L${hx} ${hy}`, hx, hy };
}
// who: you | friend | mom | teacher | kid2
function stick({ x, y, s = 1, who = "you", face = "neutral", la = [10, 10], ra = [10, 10], legs = "stand", t = 0, lean = 0, hold = "" }) {
  const hood = { you: "#1d1b26", friend: "#5b6170", mom: "#f08a3c", teacher: "#2f5d8a", kid2: "#c0392b", homeboy: "#d9412f", girl: "#d9412f" }[who];
  const capped = who === "friend" || who === "homeboy" || who === "girl", capCol = who === "friend" ? "#c0392b" : "#1d1b26";
  const sit = legs === "sit", hipY = sit ? -70 : -120;
  let legP;
  if (sit) legP = `M-14 ${hipY} L-34 ${hipY + 26} L-34 0 M14 ${hipY} L34 ${hipY + 26} L34 0`;
  else if (legs === "walk") { const w = Math.sin(t * 9) * 16; legP = `M-12 ${hipY} L${-14 + w} 0 M12 ${hipY} L${14 - w} 0`; }
  else legP = `M-14 ${hipY} L-20 0 M14 ${hipY} L20 0`;
  const top = hipY - 110, sh = top + 18;
  const L1 = arm(-34, sh, la[0], la[1], -1), R1 = arm(34, sh, ra[0], ra[1], 1);
  const body = who === "mom"
    ? `<path d="M-30 ${top} L30 ${top} L56 ${hipY + 40} L-56 ${hipY + 40} Z" fill="${hood}" stroke="${O}" stroke-width="5" stroke-linejoin="round"/>`
    : `<path d="M-36 ${top + 6} Q-38 ${top - 4} -24 ${top} L24 ${top} Q38 ${top - 4} 36 ${top + 6} L42 ${hipY + 4} L-42 ${hipY + 4} Z" fill="${hood}" stroke="${O}" stroke-width="5" stroke-linejoin="round"/>
       ${who === "you" || who === "friend" ? `<path d="M-6 ${top + 8} L-8 ${top + 40} M6 ${top + 8} L8 ${top + 40}" stroke="#fff" stroke-width="3" opacity=".7"/><path d="M-22 ${hipY - 30} L22 ${hipY - 30}" stroke="#000" stroke-width="3" opacity=".35"/>` : ""}`;
  const hy = top - 58;
  const hair = who === "mom" ? `<path d="M-56 ${hy + 40} Q-62 ${hy - 50} 0 ${hy - 56} Q62 ${hy - 50} 56 ${hy + 40} L44 ${hy + 46} Q46 ${hy - 20} 0 ${hy - 30} Q-46 ${hy - 20} -44 ${hy + 46} Z" fill="#1d1b26"/>`
    : capped ? `<path d="M-50 ${hy - 14} Q-48 ${hy - 62} 0 ${hy - 62} Q48 ${hy - 62} 50 ${hy - 14} Z" fill="${capCol}" stroke="${O}" stroke-width="5"/><path d="M40 ${hy - 20} L76 ${hy - 12} L44 ${hy - 4}" fill="${capCol}" stroke="${O}" stroke-width="5" stroke-linejoin="round"/>${who !== "friend" ? `<circle cx="-8" cy="${hy - 38}" r="7" fill="#fff"/>` : ""}`
    : who === "teacher" ? `<path d="M-40 ${hy - 30} Q0 ${hy - 70} 40 ${hy - 30}" stroke="#8a8f99" stroke-width="10" fill="none" stroke-linecap="round"/>`
    : `<path d="M-4 ${hy - 50} Q-2 ${hy - 82} 18 ${hy - 76} Q2 ${hy - 70} 6 ${hy - 50}" fill="${O}"/>`;
  const glasses = who === "teacher" ? `<g transform="translate(0 ${hy})"><circle cx="-17" cy="-4" r="14" fill="none" stroke="${O}" stroke-width="4"/><circle cx="17" cy="-4" r="14" fill="none" stroke="${O}" stroke-width="4"/><path d="M-3 -4 L3 -4" stroke="${O}" stroke-width="4"/></g>` : "";
  // her long hair hangs behind the head and shoulders, so it's drawn first
  const hairBack = who === "girl" ? `<path d="M-58 ${hy - 4} Q-74 ${hy + 60} -60 ${hy + 92} Q-40 ${hy + 100} -30 ${hy + 70} L30 ${hy + 70} Q40 ${hy + 100} 60 ${hy + 92} Q74 ${hy + 60} 58 ${hy - 4} Z" fill="#7a4a2a" stroke="${O}" stroke-width="5" stroke-linejoin="round"/>` : "";
  return `<g transform="translate(${x} ${y}) scale(${s}) rotate(${lean})">${hairBack}
    <path d="${legP}" stroke="${O}" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${L1.path}" stroke="${O}" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    ${body}
    <path d="${R1.path}" stroke="${O}" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    ${who === "mom" ? hair : ""}
    <circle cx="0" cy="${hy}" r="54" fill="#fff" stroke="${O}" stroke-width="6"/>
    ${who === "mom" ? `<path d="M-50 ${hy - 10} Q-30 ${hy - 60} 30 ${hy - 50} Q50 ${hy - 40} 52 ${hy - 10} Q20 ${hy - 40} -50 ${hy - 10} Z" fill="#1d1b26"/>` : hair}
    <g transform="translate(0 ${hy})" fill="${O}">${FACES[face]}${who === "girl" ? `<path d="M-26 -14 L-32 -20 M-20 -17 L-23 -24 M26 -14 L32 -20 M20 -17 L23 -24" stroke="${O}" stroke-width="3" stroke-linecap="round"/><circle cx="-30" cy="14" r="7" fill="#f4a3a3" opacity=".7"/><circle cx="30" cy="14" r="7" fill="#f4a3a3" opacity=".7"/>` : ""}</g>${glasses}
    ${who === "homeboy" || who === "girl" ? `<path d="M-20 ${top + 4} Q0 ${top + 34} 20 ${top + 4}" stroke="#e3b04b" stroke-width="6" fill="none"/><circle cx="0" cy="${top + 26}" r="7" fill="#e3b04b" stroke="${O}" stroke-width="2"/>` : ""}
    ${hold ? `<g transform="translate(${hold === "L" ? L1.hx : R1.hx} ${hold === "L" ? L1.hy : R1.hy})">${PHONE_SMALL}</g>` : ""}
    <circle cx="${L1.hx}" cy="${L1.hy}" r="8" fill="${O}"/><circle cx="${R1.hx}" cy="${R1.hy}" r="8" fill="${O}"/></g>`;
}
const PHONE_SMALL = `<rect x="-20" y="-58" width="40" height="70" rx="7" fill="#111" stroke="${O}" stroke-width="3"/><rect x="-15" y="-52" width="30" height="56" rx="4" fill="#1f3b48"/><rect x="-11" y="-46" width="22" height="6" rx="2" fill="${LIME}"/><circle cx="0" cy="-20" r="8" fill="#e8743b"/>`;

// ---------------- rooms ----------------
function stars(n, seed, x0, y0, w, h, t) { let s = seed, o = ""; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < n; i++) { const x = x0 + r() * w, y = y0 + r() * h, tw = 0.5 + 0.5 * Math.sin(t * 3 + i); o += `<circle cx="${x}" cy="${y}" r="${1 + r() * 2}" fill="#fff" opacity="${0.3 + 0.6 * tw}"/>`; } return o; }
function skyline(x0, y0, w, col, seed = 3) { let s = seed, o = "", x = x0; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  while (x < x0 + w) { const bw = 30 + r() * 40, bh = 40 + r() * 120; o += `<rect x="${x}" y="${y0 - bh}" width="${bw}" height="${bh + 2}" fill="${col}"/>`;
    for (let wy = y0 - bh + 12; wy < y0 - 10; wy += 22) for (let wx = x + 8; wx < x + bw - 10; wx += 16) if (r() > 0.55) o += `<rect x="${wx}" y="${wy}" width="7" height="9" fill="#ffd27a" opacity=".75"/>`; x += bw + 4; } return o; }
function bedroom(t, { dawn = 0, glow = 0 } = {}) {
  const sky = dawn ? ["#f7a55a", "#7b3f7a"] : ["#0e1433", "#22306b"];
  let h = `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[1]}"/><stop offset="1" stop-color="${sky[0]}"/></linearGradient>
    <pattern id="wp" width="36" height="36" patternUnits="userSpaceOnUse"><rect width="36" height="36" fill="#2c2645"/><rect width="14" height="36" fill="#312a4d"/></pattern></defs>
    <rect width="720" height="1280" fill="url(#wp)"/><rect y="1010" width="720" height="270" fill="#3a2a24"/><rect y="1004" width="720" height="10" fill="#22181a"/>
    <rect x="404" y="140" width="250" height="330" fill="url(#sky)" stroke="#1a1528" stroke-width="12"/>${dawn ? `<circle cx="560" cy="400" r="46" fill="#ffd27a"/>` : stars(30, 7, 410, 146, 238, 200, t) + `<circle cx="600" cy="200" r="22" fill="#f4f1d0"/>`}
    ${skyline(404, 470, 250, dawn ? "#3b2547" : "#141a38")}<path d="M529 140 L529 470 M404 305 L654 305" stroke="#1a1528" stroke-width="10"/><rect x="392" y="466" width="274" height="16" fill="#1a1528"/>
    <rect x="70" y="170" width="180" height="230" fill="#e8743b" stroke="#1a1528" stroke-width="8" transform="rotate(-3 160 285)"/>
    <text x="160" y="232" text-anchor="middle" font-family="Arc" font-size="34" fill="#fff" transform="rotate(-3 160 285)">BIO</text>
    <g transform="translate(160 305) rotate(-3)" stroke="#fff" stroke-width="5" fill="none"><ellipse rx="52" ry="18"/><ellipse rx="52" ry="18" transform="rotate(60)"/><ellipse rx="52" ry="18" transform="rotate(-60)"/></g><circle cx="160" cy="305" r="8" fill="#fff"/>
    <rect x="30" y="840" width="470" height="160" rx="10" fill="#6b4a35" stroke="#1a1528" stroke-width="6"/><rect x="30" y="760" width="40" height="240" rx="8" fill="#6b4a35" stroke="#1a1528" stroke-width="6"/>
    <rect x="70" y="806" width="420" height="60" rx="14" fill="#e9e4f2" stroke="#1a1528" stroke-width="5"/><rect x="80" y="752" width="130" height="60" rx="26" fill="#fff" stroke="#1a1528" stroke-width="5"/>
    <rect x="540" y="860" width="150" height="150" rx="8" fill="#7b5440" stroke="#1a1528" stroke-width="6"/><circle cx="615" cy="935" r="7" fill="#e3b04b"/>`;
  return h;
}
const blanketLow = `<path d="M150 860 Q320 830 496 852 L500 920 Q320 940 150 925 Z" fill="#2f4c8a" stroke="#1a1528" stroke-width="5"/>`;
const blanket = `<path d="M210 790 Q340 760 496 790 L500 900 Q340 920 210 905 Z" fill="#2f4c8a" stroke="#1a1528" stroke-width="5"/><path d="M230 830 Q340 810 480 826" stroke="#3f62ad" stroke-width="8" fill="none"/>`;
function textbook(x, y, s = 1, glow = 0, label = "BIOLOGY") {
  return `<g transform="translate(${x} ${y}) scale(${s})">${glow ? `<circle r="${90 + 20 * glow}" fill="${TEAL}" opacity="${0.25 * glow}"/>` : ""}
    <rect x="-70" y="-30" width="140" height="44" rx="6" fill="#fff" stroke="${O}" stroke-width="5"/><rect x="-74" y="-52" width="148" height="30" rx="6" fill="#2e8b57" stroke="${O}" stroke-width="5"/>
    <text x="0" y="-31" text-anchor="middle" font-family="Arc" font-size="16" fill="#fff">${label}</text><path d="M-60 -6 L60 -6 M-60 4 L60 4" stroke="#ccc" stroke-width="3"/></g>`;
}
function kitchen() {
  return `<rect width="720" height="1280" fill="#f3e6c9"/><rect y="1010" width="720" height="270" fill="#a26b45"/>
    <rect x="40" y="200" width="300" height="170" rx="6" fill="#3f8f86" stroke="${O}" stroke-width="6"/><path d="M190 200 L190 370" stroke="${O}" stroke-width="5"/><circle cx="175" cy="290" r="6"/><circle cx="205" cy="290" r="6"/>
    <rect x="420" y="170" width="240" height="210" fill="#bfe4f6" stroke="${O}" stroke-width="10"/><path d="M540 170 L540 380" stroke="${O}" stroke-width="8"/><circle cx="470" cy="240" r="30" fill="#ffd27a"/>
    <path d="M300 90 L300 150" stroke="${O}" stroke-width="4"/><path d="M270 170 L330 170 L316 150 L284 150 Z" fill="#e3b04b" stroke="${O}" stroke-width="4"/>
    <rect x="0" y="640" width="260" height="370" fill="#3f8f86" stroke="${O}" stroke-width="6"/><rect x="0" y="626" width="270" height="22" fill="#e9e4dc" stroke="${O}" stroke-width="5"/>
    <rect x="330" y="840" width="380" height="24" rx="6" fill="#c98a5a" stroke="${O}" stroke-width="5"/><path d="M360 864 L360 1010 M680 864 L680 1010" stroke="${O}" stroke-width="10"/>
    <rect x="380" y="818" width="60" height="26" rx="6" fill="#fff" stroke="${O}" stroke-width="4"/><circle cx="560" cy="830" r="18" fill="#fff" stroke="${O}" stroke-width="4"/><circle cx="560" cy="830" r="9" fill="#ffd27a"/>`;
}
function living() {
  return `<defs><pattern id="wp2" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#ecdcb9"/><rect width="16" height="40" fill="#e4d1aa"/></pattern></defs>
    <rect width="720" height="1280" fill="url(#wp2)"/><rect y="1020" width="720" height="260" fill="#8a5a3b"/><ellipse cx="360" cy="1110" rx="300" ry="60" fill="#b84b3c" stroke="${O}" stroke-width="5"/>
    <rect x="120" y="230" width="130" height="150" fill="#9fd3ea" stroke="${O}" stroke-width="8"/><rect x="330" y="250" width="200" height="140" fill="#e6c98a" stroke="${O}" stroke-width="8"/><rect x="350" y="270" width="160" height="100" fill="none" stroke="#b89150" stroke-width="5"/>
    <rect x="40" y="760" width="640" height="150" rx="40" fill="#2f8f86" stroke="${O}" stroke-width="6"/><rect x="40" y="880" width="640" height="110" rx="24" fill="#2a7f77" stroke="${O}" stroke-width="6"/>
    <rect x="18" y="820" width="60" height="180" rx="24" fill="#2f8f86" stroke="${O}" stroke-width="6"/><rect x="642" y="820" width="60" height="180" rx="24" fill="#2f8f86" stroke="${O}" stroke-width="6"/>`;
}
const couchFront = `<rect x="40" y="880" width="640" height="110" rx="24" fill="#2a7f77" stroke="${O}" stroke-width="6"/><rect x="18" y="820" width="60" height="180" rx="24" fill="#2f8f86" stroke="${O}" stroke-width="6"/><rect x="642" y="820" width="60" height="180" rx="24" fill="#2f8f86" stroke="${O}" stroke-width="6"/>`;
function classroom() {
  return `<rect width="720" height="1280" fill="#d4e6da"/><rect y="1020" width="720" height="260" fill="#9a7a5a"/>
    <rect x="70" y="170" width="580" height="290" rx="8" fill="#2e5a46" stroke="#5a3e2b" stroke-width="16"/>
    <text x="110" y="250" font-family="Arc" font-size="40" fill="#f4f1e6" opacity=".9">BIO TEST — RESULTS</text><path d="M110 290 L430 290 M110 340 L360 340" stroke="#f4f1e6" stroke-width="5" opacity=".5"/>
    <rect x="80" y="840" width="560" height="26" rx="6" fill="#c98a5a" stroke="${O}" stroke-width="5"/><path d="M120 866 L120 1020 M600 866 L600 1020" stroke="${O}" stroke-width="10"/>`;
}
function rooftop(t) {
  return `<defs><linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2a6b"/><stop offset=".55" stop-color="#e8743b"/><stop offset="1" stop-color="#f7c35a"/></linearGradient></defs>
    <rect width="720" height="1280" fill="url(#sun)"/><circle cx="360" cy="760" r="120" fill="#ffd98a" opacity=".9"/>
    ${skyline(-10, 900, 760, "#4a2a5a", 11)}<path d="M-20 520 Q360 640 740 520" stroke="${O}" stroke-width="3" fill="none"/>
    ${Array.from({ length: 12 }, (_, i) => { const x = i * 64 + 10, y = 520 + Math.sin((x / 720) * Math.PI) * 120 * 0.75; return `<circle cx="${x}" cy="${y + 10}" r="8" fill="#ffe7a0" opacity="${0.6 + 0.4 * Math.sin(t * 4 + i)}"/>`; }).join("")}
    <rect y="1010" width="720" height="270" fill="#7a4a3a"/><rect y="990" width="720" height="26" fill="#a0634a" stroke="${O}" stroke-width="5"/>`;
}
function darkUI(t) { return `<rect width="720" height="1280" fill="#141a2e"/><circle cx="360" cy="560" r="420" fill="#1f2c52" opacity=".55"/>${stars(26, 5, 0, 0, 720, 1280, t)}`; }

// ---------------- comic bits ----------------
function burst(x, y, text, k, col = "#ffd23f", size = 54, rot = -8) {
  const pts = Array.from({ length: 22 }, (_, i) => { const a = (i / 22) * Math.PI * 2, r = i % 2 ? 1 : 0.72; return `${Math.cos(a) * 170 * r},${Math.sin(a) * 90 * r}`; }).join(" ");
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${outBack(k)})" opacity="${clamp(k * 3)}"><polygon points="${pts}" fill="${col}" stroke="${O}" stroke-width="6"/>
    <text y="${size * 0.35}" text-anchor="middle" font-family="Arc" font-size="${size}" fill="#e23b3b" stroke="${O}" stroke-width="2">${text}</text></g>`;
}
const speech = (x, y, text, k, w = 260, flip = false) => A(x, y, `<div style="position:relative;background:#fff;border:4px solid ${O};border-radius:22px;padding:12px 16px;font:800 26px/1.2 Arc;color:${O};text-align:center;width:${w}px;box-sizing:border-box">${text}
  <div style="position:absolute;${flip ? "right" : "left"}:34px;bottom:-20px;width:0;height:0;border:12px solid transparent;border-top:16px solid ${O}"></div></div>`, pop(k));
const sfx = (x, y, text, k, col = "#fff", rot = -6, size = 44) => A(x, y, `<div style="font:800 ${size}px Arc;color:${col};-webkit-text-stroke:3px ${O};paint-order:stroke;transform:rotate(${rot}deg)">${text}</div>`, pop(k));
// stamps are drawn in SVG (scaled with an SVG transform): CSS-scaled stamps left ghost copies in the renderer's screenshots
const stamp = (cx, cy, text, k, col = "#e23b3b", rot = -8) => { if (k <= 0) return ""; const w = text.length * 36 + 50, sc = mix(2.4, 1, ease(k / 0.6));
  return `<g transform="translate(${cx} ${cy}) rotate(${rot}) scale(${sc})" opacity="${clamp(k * 5)}">
    <rect x="${-w / 2}" y="-44" width="${w}" height="88" rx="12" fill="rgba(255,255,255,.1)" stroke="${col}" stroke-width="7"/>
