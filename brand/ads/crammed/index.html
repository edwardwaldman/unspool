      const ghostLater = typeof ghostSvg === "string" ? ghostSvg : "";
      h += `<div style="position:absolute;left:${GX - 30}px;top:${GY - 50}px;width:${GW + 60}px;height:${GH + 100}px;background:rgba(8,12,40,.82);border:2px solid ${shot === "forget" ? "rgba(255,74,74,.6)" : shot === "space" ? "rgba(211,240,90,.6)" : "rgba(111,214,255,.5)"};border-radius:18px"></div>`;
      h += `<div style="position:absolute;left:${GX - 10}px;top:${GY - 40}px;font:700 18px Unb;color:#9ab8d8;letter-spacing:2px">MEMORY</div><div style="position:absolute;right:${720 - GX - GW}px;top:${GY - 42}px;font:700 22px Unb;color:${col}">${Math.round(mem * 100)}%</div>`;
      h += ghostLater + `<svg width="720" height="1280" style="position:absolute;inset:0"><line x1="${GX}" y1="${GY + GH}" x2="${GX + GW}" y2="${GY + GH}" stroke="#3a4270" stroke-width="2"/><path d="${path}" stroke="${col}" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 8px ${col})"/></svg>`;
      DAYS.forEach((dn, d) => { const on = shot === "forget" ? d <= day : shot === "space"; h += `<div style="position:absolute;left:${X(d + 0.5) - 26}px;top:${GY + GH + 12}px;width:52px;text-align:center;font:700 16px Unb;color:${on ? (shot === "forget" && d === day ? RED : "#e8f6ff") : "#4a5280"}">${dn}</div>`; });
      if (shot === "forget" && dayT < 0.5) h += `<div style="position:absolute;left:0;right:0;top:470px;text-align:center;transform:scale(${mix(1.6, 1, ease(dayT / 0.2))});opacity:${1 - clamp((dayT - 0.3) / 0.2)};font:700 84px Unb;color:${RED};text-shadow:0 0 30px rgba(255,74,74,.6)">${DAYS[day]}</div>`;
      if (shot === "forget") h += `<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 45%,rgba(227,38,47,${0.12 + 0.25 * shake}))"></div>`;
      if (shot === "space" && revT < 0.6) h += `<div style="position:absolute;left:0;right:0;top:470px;text-align:center;transform:scale(${outBack(revT / 0.25)})"><span style="display:inline-block;background:${LIME};color:#0f1d18;font:700 30px Unb;padding:12px 24px;border-radius:40px">↻ REVIEW ${reviews}</span></div>`; }
    if (shot === "pivot") { const DT = 2.4, q = lt - DT;
      h += `<div style="position:absolute;inset:0;background:rgba(7,12,58,${clamp(lt / 0.25) * 0.85})"></div>`;
      if (q < 0) h += docToReels(lt, { title: 'Your notes<br>→ <span style="color:#d3f05a">short reels</span>', docTitle: "My notes" });
      else { const k = outBack(q / 0.4);
        h += `<div style="position:absolute;left:0;right:0;top:140px;text-align:center;font:700 40px/1.15 Unb;color:#fff">A few minutes<br><span style="color:${LIME}">a day.</span></div>`;
        h += `<div style="position:absolute;left:80px;right:80px;top:420px;transform:scale(${k});background:#0f1428;border:2px solid ${LIME};border-radius:24px;padding:26px;box-shadow:0 0 40px rgba(211,240,90,.35)"><div style="font:700 22px Unb;color:#9ab8d8;letter-spacing:2px;margin-bottom:16px">THIS WEEK</div><div style="display:flex;justify-content:space-between">${DAYS.map((dn, d) => { const on = q > 0.3 + d * 0.25; return `<div style="text-align:center"><div style="width:72px;height:72px;border-radius:18px;background:${on ? LIME : "#1c2246"};color:#0f1d18;font:700 34px Unb;display:flex;align-items:center;justify-content:center;transform:scale(${on ? outBack((q - 0.3 - d * 0.25) / 0.25) : 1})">${on ? "✓" : ""}</div><div style="font:700 15px Unb;color:#9ab8d8;margin-top:8px">${dn}</div></div>`; }).join("")}</div><div style="font:600 24px Ins;color:#e8f6ff;margin-top:18px;text-align:center">a few reels a day · quiz in every one</div></div>`; } }
    if (shot === "cta" || shot === "end") { const lc = t - st("cta"); const a = clamp(lc / 0.2);
      h += `<div style="position:absolute;inset:0;background:#0b0f0d;opacity:${a}"></div><div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(211,240,90,.2),transparent 60%);opacity:${a}"></div>`;
      h += `<img src="lockup-horizontal.svg" style="position:absolute;left:210px;width:300px;top:400px;opacity:${clamp((lc - 0.3) / 0.3)}">`;
      h += `<div style="position:absolute;left:0;right:0;top:520px;text-align:center;transform:scale(${mix(1.3, 1, ease(lc / 0.25))});opacity:${a};font:700 100px/1 Unb;color:#fff;letter-spacing:-2px;text-shadow:0 0 50px rgba(211,240,90,.45)">unspool<span style="color:${LIME}">.cc</span></div>`;
      h += `<div style="position:absolute;left:50%;top:680px;transform:translateX(-50%) scale(${outBack((lc - 0.5) / 0.35)});background:${LIME};color:#0f1d18;font:600 30px Ins;padding:16px 32px;border-radius:40px;white-space:nowrap">First reel free</div>`; }
    if (shot === "how" && lt < 1.3) flash = 1 - clamp((lt - 0.9) / 0.4);
  }
  // hook title, copied from the reference: two lines, the last word in red
  if (inRoom || (shot === "how")) { const a = shot === "how" ? 1 - clamp((lt - 0.9) / 0.3) : 1;
    h += `<div style="position:absolute;left:0;right:0;top:120px;text-align:center;opacity:${a};font:700 46px/1.14 Unb;color:#ffffff;letter-spacing:-1px;text-shadow:0 3px 12px rgba(0,0,0,.6)">Crammed for 6 hours.<br>Forgot it by <span style="color:#ff3b45">Friday.</span></div>`; }
  if (!["pivot", "cta", "end"].includes(shot)) { const c = caption(t, L); if (c) h += `<div style="position:absolute;left:0;right:0;top:1000px;text-align:center"><span style="display:inline-block;max-width:600px;background:rgba(14,18,40,.78);font:600 30px/1.3 Ins;padding:10px 18px;border-radius:12px">${c}</span></div>`; }
  if (flash) h += `<div style="position:absolute;inset:0;background:#fff;opacity:${flash}"></div>`;
  if (t < 0.12) h += `<div style="position:absolute;inset:0;background:#000;opacity:${1 - t / 0.12}"></div>`;
  ov.innerHTML = h;
};
await Promise.all(["lockup-horizontal.svg", "quiz.jpg"].map((s) => new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = s; })));
window.renderAt(0); setTimeout(() => (window.ready = true), 400);
</script></body></html>
