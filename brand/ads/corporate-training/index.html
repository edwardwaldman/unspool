<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Unb; src: url(Unbounded-700.ttf); }
@font-face { font-family: Ins; src: url(InstrumentSans-600.ttf); }
html, body { margin: 0; width: 720px; height: 1280px; overflow: hidden; background: #f4f5f7; }
#s { position: absolute; inset: 0; overflow: hidden; font-family: Ins; color: #101828; }
.card { position: absolute; background: #fff; border-radius: 28px; box-shadow: 0 24px 60px rgba(16, 24, 40, .14), 0 2px 6px rgba(16, 24, 40, .06); }
.chip { display: inline-flex; align-items: center; gap: 10px; background: #fff; border-radius: 999px; padding: 12px 20px; font: 600 24px Ins; box-shadow: 0 10px 30px rgba(16, 24, 40, .14); white-space: nowrap; }
.mono { font-family: Unb; letter-spacing: -0.01em; }
</style></head>
<body><div id="s"></div>
<script type="module">
// Corporate-training ad, business look: light UI, clean type, an illustrated employee, app and phone mock-ups.
// window.renderAt(t) draws frame t (seconds); timings come from tl.json (the voice lines).
const TL = await (await fetch("tl.json")).json(); const lines = TL.lines, DUR = TL.dur; window.DUR = DUR;
const S = document.getElementById("s");
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const inOut = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const outBack = (x) => { x = clamp(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const mix = (a, b, k) => a + (b - a) * k;
const st = (n) => lines.find((l) => l.shot === n)?.s ?? 1e9;
const L = (n) => lines.find((l) => l.shot === n);
const A = (x, y, inner, extra = "") => `<div style="position:absolute;left:${x}px;top:${y}px;${extra}">${inner}</div>`;
const rise = (k, d = 24) => `opacity:${clamp(k * 1.6)};transform:translateY(${(1 - ease(k)) * d}px)`;
const pop = (k) => `opacity:${clamp(k * 3)};transform:scale(${outBack(k)})`;
const INK = "#101828", MUTED = "#667085", LIME = "#d3f05a", DARK = "#0f1d18", GREEN = "#12b76a", RED = "#f04438", NAVY = "#1d3557";
// when a word of a line is said (paced by letters, like the captions)
const wordAt = (shot, startsWith) => { const l = L(shot), w = l.text.split(" "), i = w.findIndex((x) => x.toLowerCase().startsWith(startsWith)), wl = (x) => x.length + 1;
  return l.s + w.slice(0, i).reduce((a, x) => a + wl(x), 0) / w.reduce((a, x) => a + wl(x), 0) * (l.e - l.s); };

// ---------- the employee: a flat illustration, at a desk with a laptop, or holding a phone ----------
function person({ mood = "bored", pose = "desk", t = 0, phoneImg = "" }) {
  const skin = "#f2c6a0", hair = "#2a1f1a", shirt = NAVY;
  const blink = (t % 3.1) > 2.98 ? 0.15 : 1;
  const mouth = mood === "happy" ? `<path d="M182 168 Q200 186 218 168" stroke="#7a3b2e" stroke-width="6" fill="none" stroke-linecap="round"/>`
    : mood === "confused" ? `<path d="M184 176 Q200 168 216 178" stroke="#7a3b2e" stroke-width="6" fill="none" stroke-linecap="round"/>`
    : `<path d="M186 174 L214 174" stroke="#7a3b2e" stroke-width="6" stroke-linecap="round"/>`;
  const brows = mood === "confused" ? `<path d="M168 118 L190 124 M210 126 L232 114" stroke="${hair}" stroke-width="6" stroke-linecap="round"/>` : "";
  const head = `<g>
    <rect x="182" y="190" width="36" height="34" fill="${skin}"/>
    <ellipse cx="200" cy="140" rx="56" ry="62" fill="${skin}"/>
    <path d="M142 132 Q140 70 200 72 Q262 70 258 134 Q250 100 214 100 Q170 102 148 150 Z" fill="${hair}"/>
    <ellipse cx="180" cy="142" rx="6" ry="${7 * blink}" fill="${INK}"/><ellipse cx="220" cy="142" rx="6" ry="${7 * blink}" fill="${INK}"/>
    ${brows}${mouth}</g>`;
  const torso = `<path d="M110 330 Q110 226 200 220 Q290 226 290 330 L290 420 L110 420 Z" fill="${shirt}"/><path d="M182 222 L200 250 L218 222" fill="#fff"/>`;
  if (pose === "phone") {
    const sw = Math.sin(t * 2) * 2;
    return `<svg width="400" height="460" viewBox="0 0 400 460">${torso}${head}
      <path d="M130 300 Q150 380 196 360" stroke="${shirt}" stroke-width="40" fill="none" stroke-linecap="round"/>
      <g transform="rotate(${-8 + sw} 240 330)"><rect x="196" y="250" width="96" height="170" rx="14" fill="#111"/>
      <foreignObject x="202" y="258" width="84" height="154"><div xmlns="http://www.w3.org/1999/xhtml" style="width:84px;height:154px;border-radius:9px;overflow:hidden;background:#123">${phoneImg}</div></foreignObject></g>
      <circle cx="214" cy="356" r="20" fill="${skin}"/></svg>`;
  }
  const chin = pose === "chin";
  const arms = chin
    ? `<path d="M140 330 Q120 300 150 250 Q160 222 172 200" stroke="${shirt}" stroke-width="40" fill="none" stroke-linecap="round"/><circle cx="174" cy="200" r="22" fill="${skin}"/>
       <path d="M270 330 Q300 370 250 384" stroke="${shirt}" stroke-width="40" fill="none" stroke-linecap="round"/>`
    : `<path d="M130 330 Q120 380 170 388" stroke="${shirt}" stroke-width="40" fill="none" stroke-linecap="round"/><path d="M270 330 Q280 380 230 388" stroke="${shirt}" stroke-width="40" fill="none" stroke-linecap="round"/>`;
  return `<svg width="400" height="460" viewBox="0 0 400 460">${torso}${chin ? `<g transform="rotate(-8 200 200) translate(-10 12)">${head}</g>` : head}
    <rect x="20" y="380" width="360" height="22" rx="6" fill="#d9c3a5"/><rect x="20" y="398" width="360" height="62" fill="#c8ad8a"/>
    <path d="M118 380 L282 380 L300 330 L136 330 Z" fill="#c9ced6"/><rect x="134" y="250" width="132" height="90" rx="8" fill="#98a2b3" transform="skewX(-8) translate(48 0)"/>
    ${arms}</svg>`;
}

// ---------- reusable mock-ups ----------
const pdfCard = (x, y, w, h, page, of, scroll, title = "Employee_Handbook_v7.pdf") => {
  const rows = Array.from({ length: 22 }, (_, i) => { const yy = 120 + i * 34 - (scroll % 34) ; const wid = [92, 78, 86, 64, 90, 70, 84][(i + Math.floor(scroll / 34)) % 7];
    return yy > 100 && yy < h - 40 ? `<div style="position:absolute;left:44px;top:${yy}px;height:12px;width:${wid * (w - 88) / 100}px;border-radius:6px;background:#e4e7ec"></div>` : ""; }).join("");
  return A(x, y, `<div class="card" style="position:relative;width:${w}px;height:${h}px;overflow:hidden">
    <div style="height:84px;border-bottom:1px solid #eaecf0;display:flex;align-items:center;gap:14px;padding:0 28px">
      <div style="width:40px;height:48px;border-radius:6px;background:${RED};color:#fff;font:700 13px Ins;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;box-sizing:border-box">PDF</div>
      <div style="font:600 22px Ins;color:${INK};flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</div>
      <div style="font:600 20px Ins;color:${MUTED};white-space:nowrap">${page} / ${of}</div></div>
    <div style="position:absolute;left:44px;top:104px;height:22px;width:55%;border-radius:8px;background:#cfd4dc"></div>${rows}</div>`);
};
const quizCard = (x, y, k, good, lt) => {
  const qs = ["What does P.A.S.S. stand for?", "First step with a suspicious email?", "How do you lift a heavy box?", "Who do you report a breach to?"];
  const marks = qs.map((q, i) => { const kk = (lt - 0.25 - i * 0.18) / 0.15; const ok = good;
    return `<div style="display:flex;align-items:center;gap:16px;padding:18px 0;border-top:${i ? "1px solid #eaecf0" : "none"}">
      <div style="flex:1;font:600 22px/1.25 Ins;color:${INK}">${q}</div>
      <div style="width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:${ok ? "#ecfdf3" : "#fef3f2"};color:${ok ? GREEN : RED};font:700 26px Ins;${pop(kk)}">${ok ? "✓" : "✕"}</div></div>`; }).join("");
  const sc = (lt - 1.0) / 0.25;
  return A(x, y, `<div class="card" style="width:540px;padding:30px 34px;box-sizing:border-box;${rise(k)}">
    <div style="display:flex;align-items:center;justify-content:space-between"><div><div style="font:600 18px Ins;color:${MUTED};letter-spacing:.08em">TRAINING QUIZ</div><div class="mono" style="font-size:28px;margin-top:6px">Workplace safety</div></div>
    <div class="mono" style="font-size:44px;color:${good ? GREEN : RED};${pop(sc)}">${good ? "10/10" : "3/10"}</div></div>
    <div style="margin-top:18px">${marks}</div></div>`);
};
const phone = (x, y, w, img, extra = "") => A(x, y, `<div style="width:${w}px;height:${w * 2.05}px;border-radius:${w * 0.13}px;background:#0b0d12;padding:${w * 0.035}px;box-sizing:border-box;box-shadow:0 30px 60px rgba(16,24,40,.28)">
  <div style="width:100%;height:100%;border-radius:${w * 0.1}px;overflow:hidden;background:#123">${img}</div></div>`, extra);
const reelImg = (n, y = 0) => `<img src="${n}.png" style="width:100%;height:100%;object-fit:cover;display:block;transform:translateY(${y}%)">`;
const wordmark = (size, col = "#fff") => `<span class="mono" style="font-size:${size}px;color:${col};letter-spacing:-0.03em">unspool<span style="color:${LIME}">.</span></span>`;

// ---------- scenes ----------
function hook(t) {
  const l = L("hook"), lt = t - l.s;
  const words = ["Nobody", "reads", "the", "training", "manual."];
  const at = [wordAt("hook", "nobody"), wordAt("hook", "reads"), wordAt("hook", "the"), wordAt("hook", "training"), wordAt("hook", "manual")];
  // the headline is on screen from the first frame (it's the thumbnail); the highlight sweeps under "manual." as it's said
  const sweep = ease((t - at[4]) / 0.3);
  const head = words.map((w, i) => `<span style="display:inline-block;margin:0 7px">${i === 4 ? `<span style="background:linear-gradient(90deg, ${LIME} ${sweep * 100}%, transparent ${sweep * 100}%) 0 72% / 100% 38% no-repeat">${w}</span>` : w}</span>`).join("");
  const push = 1 + 0.06 * inOut(lt / 1.7);
  return A(0, 0, `<div style="position:absolute;left:0;top:0;width:720px;height:1280px;transform:scale(${push});transform-origin:50% 60%">
    ${A(90, 170, `<div style="width:540px;text-align:center;font:700 22px Ins;color:${MUTED};letter-spacing:.12em">BE HONEST…</div>`, `${rise(lt / 0.3)}`)}
    ${A(80, 215, `<div class="mono" style="width:560px;text-align:center;font-size:64px;line-height:1.08;color:${INK}">${head}</div>`)}
    ${A(160, 470, person({ mood: "bored", pose: "chin", t }))}
    ${A(395, 760, `<div style="width:170px;height:96px;border-radius:10px;background:${NAVY};box-shadow:0 10px 20px rgba(0,0,0,.2);transform:rotate(-4deg);display:flex;align-items:center;justify-content:center;color:#fff;font:700 15px/1.2 Ins;text-align:center">EMPLOYEE<br>HANDBOOK</div>`)}
    ${A(380, 742, `<div style="width:170px;height:20px;border-radius:6px;background:#e9edf2;transform:rotate(-4deg)"></div>`)}</div>`);
}
function manual(t) {   // "Forty pages of policy. They skim it in two minutes."
  const t0 = st("chapter"), lt = t - t0, sk = t - st("three");
  const page = Math.min(40, Math.max(1, Math.round(1 + 39 * ease((t - t0) / (st("gone") - t0 - 0.15)))));
  const scroll = Math.max(0, lt) * (sk > 0 ? 900 : 120);
  let h = pdfCard(110, 150, 500, 640, page, 40, scroll);
  h += A(90, 820, `<div style="width:540px;display:flex;justify-content:center;gap:14px">
    <div class="chip" style="${pop((lt - 0.1) / 0.25)}"><span style="color:${RED}">●</span> 40 pages of policy</div></div>`);
  if (sk > 0) h += A(90, 92, `<div style="width:540px;display:flex;justify-content:center"><div class="chip" style="background:${INK};color:#fff;${pop(sk / 0.25)}">⏱ Skimmed in 2:00</div></div>`);
  return h;
}
function gone(t) {
  const lt = t - st("gone");
  return quizCard(90, 200, lt / 0.3, false, lt)
    + A(90, 760, `<div style="width:540px;display:flex;justify-content:center;align-items:center;gap:18px;${rise((lt - 0.5) / 0.3)}">
      <div style="width:84px;height:84px;border-radius:50%;background:#e9edf2;overflow:hidden;position:relative">${person({ mood: "confused", pose: "desk", t }).replace('width="400" height="460"', 'width="120" height="138" style="position:absolute;left:-18px;top:4px"')}</div>
      <div class="chip">Nobody remembers a thing</div></div>`);
}
function fix(t) {
  const lt = t - st("fix"), wipe = ease(lt / 0.25);
  return `<div style="position:absolute;inset:0;background:${DARK};clip-path:circle(${wipe * 120}% at 50% 50%)"></div>`
    + A(90, 470, `<div style="width:540px;text-align:center;${pop((lt - 0.1) / 0.35)}">${wordmark(92)}</div>`)
    + A(90, 610, `<div style="width:540px;text-align:center;font:600 34px Ins;color:#c7d2cc;${rise((lt - 0.4) / 0.3)}">fixes that.</div>`);
}
function snap(t) {
  const lt = t - st("snap"), B = wordAt("snap", "boom"), b = t - B, cap = t - wordAt("snap", "captions"), qz = t - wordAt("snap", "quiz");
  let h = "";
  // the app: drop a PDF in
  const appK = 1 - ease(b / 0.3);
  if (b < 0.35) {
    const fly = ease((lt - 0.15) / 0.6), prog = clamp((lt - 0.75) / Math.max(0.2, B - st("snap") - 0.8));
    h += A(110, 220, `<div class="card" style="width:500px;height:520px;overflow:hidden;opacity:${appK};transform:scale(${mix(1, 0.9, 1 - appK)})">
      <div style="height:76px;border-bottom:1px solid #eaecf0;display:flex;align-items:center;padding:0 28px">${wordmark(26, INK)}<span style="margin-left:auto;font:600 18px Ins;color:${MUTED}">Training</span></div>
      <div style="position:absolute;left:36px;right:36px;top:110px;bottom:36px;border:3px dashed ${fly > 0.95 ? GREEN : "#d0d5dd"};border-radius:22px;background:${fly > 0.95 ? "#f6fef9" : "#fafbfc"};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px">
        <div style="font:600 26px Ins;color:${INK}">${fly > 0.95 ? "Safety_Handbook.pdf" : "Drop a training PDF"}</div>
        <div style="width:300px;height:12px;border-radius:6px;background:#eaecf0;overflow:hidden"><div style="height:100%;width:${prog * 100}%;background:${GREEN}"></div></div>
        <div style="font:600 18px Ins;color:${MUTED}">${prog >= 1 ? "Ready" : prog > 0 ? "Making your videos…" : "PDF, slides or docs"}</div></div></div>`);
    // the file flying in
    if (fly < 1) h += A(mix(470, 300, fly), mix(80, 430, fly), `<div style="width:110px;height:136px;border-radius:12px;background:#fff;box-shadow:0 16px 40px rgba(16,24,40,.22);position:relative;transform:rotate(${mix(10, 0, fly)}deg)">
      <div style="position:absolute;left:16px;top:18px;right:16px;height:10px;border-radius:5px;background:#e4e7ec"></div><div style="position:absolute;left:16px;top:38px;right:30px;height:10px;border-radius:5px;background:#e4e7ec"></div>
      <div style="position:absolute;left:16px;bottom:16px;padding:4px 10px;border-radius:6px;background:${RED};color:#fff;font:700 16px Ins">PDF</div></div>`);
  }
  // BOOM: three short videos fan out
  if (b > 0) {
    const flash = Math.max(0, 1 - b / 0.15) * 0.5;
    [["phish", -190, -8, 0], ["lift", 190, 8, 0.06], ["fire", 0, 0, 0.12]].forEach(([n, dx, r, d]) => { const k = ease((b - d) / 0.45);
      h += phone(360 - 105 + dx * k, 230 + (1 - k) * 120, 210, reelImg(n), `opacity:${clamp(k * 2)};transform:rotate(${r * k}deg) scale(${mix(0.6, n === "fire" ? 1.08 : 0.94, k)});z-index:${n === "fire" ? 3 : 2}`); });
    if (cap > 0) h += A(70, 700, `<div class="chip" style="${pop(cap / 0.25)}">💬 Captions</div>`, "z-index:4");
    if (qz > 0) h += A(470, 700, `<div class="chip" style="${pop(qz / 0.25)}">✅ Quiz</div>`, "z-index:4");
    h += A(90, 140, `<div style="width:540px;text-align:center;font:600 22px Ins;color:${MUTED};letter-spacing:.1em;${rise(b / 0.3)}">SHORT TIKTOK-STYLE VIDEOS</div>`);
    if (flash > 0) h += `<div style="position:absolute;inset:0;background:#fff;opacity:${flash}"></div>`;
  }
  return h;
}
function scroll(t) {
  const lt = t - st("scroll"), per = 0.75, i = Math.floor(lt / per), f = clamp((lt / per - i - 0.6) / 0.4);
  const imgs = ["fire", "phish", "lift", "fire"], y = -inOut(f) * 100;
  const scr = `<div style="width:100%;height:100%;position:relative;overflow:hidden"><div style="position:absolute;inset:0;transform:translateY(${y}%)">${reelImg(imgs[i % 4])}<div style="position:absolute;left:0;top:100%;width:100%;height:100%">${reelImg(imgs[(i + 1) % 4])}</div></div></div>`;
  let h = A(160, 250, person({ mood: "happy", pose: "phone", t, phoneImg: scr }).replace('width="400" height="460"', 'width="400" height="460" style="transform:scale(1.25);transform-origin:50% 0"'), rise(lt / 0.25));
  h += A(90, 140, `<div style="width:540px;text-align:center;font:600 22px Ins;color:${MUTED};letter-spacing:.1em;${rise(lt / 0.3)}">THEY SCROLL. IT STICKS.</div>`);
  h += A(90, 850, `<div style="width:540px;display:flex;justify-content:center;gap:12px">${["Fire safety", "Phishing", "Safe lifting"].map((w, j) => { const k = (lt - 0.35 - j * 0.45) / 0.25;
    return `<div class="chip" style="font-size:20px;padding:10px 16px;${pop(k)}"><span style="color:${GREEN}">✓</span> ${w}</div>`; }).join("")}</div>`);
  return h;
}
function sticks(t) {
  const lt = t - st("sticks");
  return quizCard(90, 200, lt / 0.3, true, lt)
    + A(90, 760, `<div style="width:540px;display:flex;justify-content:center"><div class="chip" style="background:#ecfdf3;color:#027a48;${pop((lt - 1.05) / 0.3)}">They actually know it</div></div>`);
}
function endCard(t) {
  const lt = t - st("cta");
  return `<div style="position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 35%,#1c3a2c,${DARK})"></div>`
    + A(90, 300, `<div style="width:540px;text-align:center;${rise(lt / 0.3)}">${wordmark(46)}</div>`)
    + A(90, 400, `<div class="mono" style="width:540px;text-align:center;font-size:62px;line-height:1.1;color:#fff;${rise((lt - 0.15) / 0.35)}">Make training<br><span style="color:${LIME}">stick.</span></div>`)
    + A(90, 600, `<div style="width:540px;text-align:center;font:600 26px/1.4 Ins;color:#b8c7bf;${rise((lt - 0.35) / 0.35)}">Turn any training PDF into short videos<br>with captions and a quiz.</div>`)
    + A(90, 740, `<div style="width:540px;text-align:center;${pop((lt - 0.6) / 0.35)}"><span style="display:inline-block;background:${LIME};color:${DARK};font:700 32px Ins;padding:22px 40px;border-radius:999px">unspool.cc/teams</span></div>`)
    + A(90, 850, `<div style="width:540px;text-align:center;font:600 20px Ins;color:#8ea595;${rise((lt - 0.8) / 0.3)}">First reel free · No card needed</div>`);
}

// ---------- subtitles: the line in short phrases, each word lighting up as it's said ----------
function subtitle(l, t) {
  const chunks = []; for (const ph of l.text.split(/(?<=[.,!?])\s+/)) { const w = ph.split(" "); for (let k = 0; k < w.length; k += 4) chunks.push(w.slice(k, k + 4)); }
  const words = chunks.flat(), wl = (w) => w.length + 1, tot = words.reduce((a, w) => a + wl(w), 0), u = clamp((t - l.s) / (l.e - l.s)) * tot;
  let acc = 0; const starts = words.map((w) => { const a = acc; acc += wl(w); return a; });
  let wi = 0; words.forEach((w, k) => { if (u >= starts[k]) wi = k; });
  let n = 0, ci = 0; chunks.forEach((c, k) => { if (wi >= n) ci = k; n += c.length; });
  const first = chunks.slice(0, ci).reduce((a, c) => a + c.length, 0);
  const txt = chunks[ci].map((w, k) => { const g = first + k; return `<span style="color:${g === wi ? LIME : g < wi ? "#fff" : "rgba(255,255,255,.45)"}">${w}</span>`; }).join(" ");
  return A(90, 960, `<div style="width:540px;text-align:center"><span style="display:inline-block;max-width:540px;background:rgba(16,24,40,.88);border-radius:18px;padding:14px 24px;font:600 32px/1.3 Ins;color:#fff">${txt}</span></div>`);
}

window.renderAt = (t) => {
  let h = "";
  if (t < st("chapter")) h = hook(t);
  else if (t < st("gone")) h = manual(t);
  else if (t < st("fix")) h = gone(t);
  else if (t < st("snap")) h = fix(t);
  else if (t < st("scroll")) h = snap(t);
  else if (t < st("sticks")) h = scroll(t);
  else if (t < st("cta")) h = sticks(t);
  else h = endCard(t);
  const l = lines.find((x) => t >= x.s - 0.05 && t < x.e + 0.25 && x.text);
  if (l && !["hook", "fix", "cta"].includes(l.shot)) h += subtitle(l, t);
  S.innerHTML = h;
};
await document.fonts.load("40px Unb"); await document.fonts.load("40px Ins");
await Promise.all(["fire", "phish", "lift"].map((n) => new Promise((r) => { const i = new Image(); i.onload = r; i.src = `${n}.png`; })));
window.renderAt(0); setTimeout(() => (window.ready = true), 300);
</script></body></html>
