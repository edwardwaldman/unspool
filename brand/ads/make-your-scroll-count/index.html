    if (shot === "chapter") camMove(lt, L, v3(0, 3.6, 7.6), v3(0, 3.3, 6.4), v3(0, 2.3, -0.5), v3(0, 2.3, -0.5), 40);
    else if (shot === "three") camMove(lt, L, v3(0.7, 3.1, 4.4), v3(0.5, 3.0, 3.8), v3(0, 2.2, 0.4), v3(0, 2.2, 0.4), 40);
    else cam(v3(0, 2.6, 6.8), v3(0, 1.6, 0), 40);
    return desk; }
  if (shot === "gone" || shot === "sticks") { paper.material.map = shot === "gone" ? paperBlank : paperA; paper.material.needsUpdate = true; camMove(lt, L + 0.4, v3(0.03, 4.4, 0.8), v3(0.03, 4.05, 0.7), v3(0.03, 0, 0.05), v3(0.03, 0, 0.05), 38); return pap; }
  return bed;
}

// ================= overlays =================
const ov = document.getElementById("ov");
const A = (x, y, inner, extra = "") => `<div style="position:absolute;left:${x}px;top:${y}px;${extra}">${inner}</div>`;
const pop = (k) => `transform:scale(${outBack(k)});opacity:${clamp(k * 3)}`;
const label = (small, big, k) => `<div class="lbl" style="opacity:${clamp(k * 3)};transform:translateY(${(1 - ease(k)) * 12}px)"><small>${small}</small><b>${big}</b></div>`;
const stamp = (txt, x, y, rot, k, col = "#e5302a") => k > 0 ? A(x, y, `<div class="stamp" style="color:${col};border-color:${col};transform:scale(${mix(3.2, 1.25, ease(clamp(k / 0.12)))}) rotate(${rot}deg);opacity:${clamp(k * 8)}">${txt}</div>`) : "";
// the app, floating over the scene like a real screen
function app(shot, lt) {
  const card = (inner, k) => A(150, 150, `<div style="width:420px;border-radius:0;border:5px solid #d3f05a;background:#0f1d18;box-shadow:10px 10px 0 #000;padding:22px;box-sizing:border-box;${pop(k)};color:#e9f0e4">${inner}</div>`);
  if (shot === "fix") return card(`<div style="text-align:center;font:700 26px Unb">unspool</div><div style="text-align:center;font:700 30px/1.1 Unb;margin-top:14px">Snap a photo.<br>Get study <span style="color:#d3f05a">reels.</span></div>
    <div style="margin:20px auto 6px;width:110px;height:110px;border-radius:50%;background:#d3f05a;display:flex;align-items:center;justify-content:center"><svg width="46" height="46" viewBox="0 0 64 64"><path d="M32 10v44M10 32h44" stroke="#0f1d18" stroke-width="8" stroke-linecap="round"/></svg></div><div style="text-align:center;font:600 18px Ins">Snap a photo</div>`, lt / 0.35);
  if (shot === "snap" || shot === "cards") return turnIntoReels(shot, lt);
  if (shot === "__old_snap") { const k = ease((lt - 0.1) / 0.6);
    return card(`<div style="font:700 15px Unb;color:#d3f05a;letter-spacing:1px">BIO · CHAPTER 4</div><div style="display:flex;gap:10px;margin-top:14px;justify-content:center">${["mito", "resp", "dna"].map((n, j) => `<div style="width:118px;height:210px;border-radius:14px;overflow:hidden;border:3px solid #000;transform:translateY(${(1 - clamp(k * 3 - j)) * 40}px);opacity:${clamp(k * 3 - j)}"><img src="${n}.jpg" style="width:100%;height:100%;object-fit:cover"></div>`).join("")}</div><div style="text-align:center;font:600 18px Ins;margin-top:14px;color:#8ea595">9 reels ready ✓</div>`, lt / 0.35); }
  if (shot === "quiz") { const ok = lt > 0.55;
    return card(`<div style="display:inline-block;background:#d3f05a;color:#0f1d18;font:700 14px Unb;padding:4px 10px">QUICK CHECK</div><div style="font:700 22px/1.3 Ins;margin-top:12px">What do mitochondria make?</div>${["Glucose", "ATP", "Oxygen"].map((o, x) => { const r = ok && x === 1; return `<div style="margin-top:10px;padding:12px 14px;border-radius:12px;border:2px solid ${r ? "#1f9d55" : "#28402f"};background:${r ? "rgba(31,157,85,.2)" : "transparent"};font:600 19px Ins">${String.fromCharCode(65 + x)}. ${o}${r ? " ✓" : ""}</div>`; }).join("")}`, lt / 0.35); }
  return "";
}
function turnIntoReels(shot, lt) {
  const t0 = shot === "snap" ? lt : lt + len("snap");
  let h = `<div style="position:absolute;inset:0;background:rgba(10,14,30,${Math.min(0.82, t0 * 2)})"></div>`;
  const page = (x, y, s, rot, a) => A(x, y, `<div style="width:300px;height:400px;background:#fbf8ef;border:6px solid #000;box-shadow:10px 10px 0 #000;padding:20px;box-sizing:border-box;transform:scale(${s}) rotate(${rot}deg);opacity:${a}"><div style="display:inline-block;background:#1f8a70;color:#fff;font:14px Px;padding:6px 8px">BIO · CH 4</div>${[90, 76, 94, 60, 86, 92, 70, 88, 64, 80].map((w) => `<div style="height:12px;margin:14px 0;background:#9aa1ad;width:${w}%"></div>`).join("")}</div>`);
  // the page lands, shakes, bursts at "BOOM", and the reels fly out of it
  const land = outBack(t0 / 0.3), burst = t0 > 1.0, split = ease((t0 - 1.0) / 0.6);
  if (!burst) h += page(210, 380, land * (1 + 0.04 * Math.sin(t0 * 40) * clamp(t0 - 0.5)), Math.sin(t0 * 30) * 2 * clamp(t0 - 0.5), 1);
  if (burst && split < 1) h += A(360 - 380 * split, 580 - 380 * split, `<div style="width:${760 * split}px;height:${760 * split}px;border:14px solid #d3f05a;opacity:${1 - split};box-sizing:border-box"></div>`)
    + `<div style="position:absolute;inset:0;background:#fff;opacity:${Math.max(0, 1 - (t0 - 1.0) / 0.12) * 0.8}"></div>`;
  if (burst && t0 < 1.5) h += A(0, 250, `<div style="width:720px;text-align:center;font:72px Px;color:#d3f05a;text-shadow:7px 7px 0 #000;transform:scale(${outBack((t0 - 1.0) / 0.15)}) rotate(-6deg)">BOOM!</div>`);
  const imgs = ["resp", "dna", "mito"], spots = [[-190, -9], [190, 9], [0, 0]];
  if (burst) spots.forEach(([dx, r], j) => { const k = ease((t0 - 1.0 - j * 0.08) / 0.5); if (k <= 0) return;
    const fan = shot === "cards" ? Math.sin(lt * 2 + j) * 6 : 0, w = j === 2 ? 230 : 190, z = j === 2 ? 2 : 1;
    h += A(360 + dx * k - w / 2, (j === 2 ? 400 : 440) + fan, `<div style="width:${w}px;height:${w * 16 / 9}px;border:6px solid #000;box-shadow:8px 8px 0 #000;transform:rotate(${r * k}deg) scale(${0.3 + 0.7 * k});z-index:${z};background:#000"><img src="${imgs[j]}_px.png" style="width:100%;height:100%;object-fit:cover;image-rendering:pixelated"></div>`); });
  if (shot === "cards") h += A(0, 250, `<div style="width:720px;text-align:center;font:34px/1.3 Px;color:#fff;text-shadow:5px 5px 0 #000;${pop(lt / 0.25)}">MADE FROM<br><span style="color:#d3f05a">YOUR CHAPTER</span></div>`);
  return h;
}
function endCard(lc) {
  return `<div style="position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 40%,#203a2c,#0f1d18);opacity:${clamp(lc / 0.3)}">
    ${A(0, 300, `<div style="width:720px;text-align:center;font:30px Px;color:#e9f0e4;opacity:${clamp(lc / 0.3)}">unspool</div>`)}
    ${A(0, 380, `<div style="width:720px;text-align:center;font:700 18px Ins;letter-spacing:3px;color:#8ea595;opacity:${clamp((lc - 0.3) / 0.3)}">MAKE YOUR SCROLL COUNT.</div>`)}
    ${A(0, 440, `<div style="width:720px;text-align:center;font:62px/1.25 Px;color:#e9f0e4;text-shadow:6px 6px 0 #000;transform:scale(${outBack((lc - 0.4) / 0.4)})">SAME<br>SCROLL.<br><span style="color:#d3f05a">SMARTER<br>FEED.</span></div>`)}
    ${A(0, 830, `<div style="width:720px;text-align:center;transform:scale(${outBack((lc - 1.2) / 0.35)})"><span style="display:inline-block;background:#d3f05a;color:#0f1d18;font:26px Px;padding:18px 28px;border-radius:0;box-shadow:6px 6px 0 #000">TRY IT FREE</span><div style="margin-top:16px;font:22px Px;color:#e9f0e4">UNSPOOL.CC</div></div>`)}</div>`;
}
// shouted captions: two words at a time, huge, each chunk slamming in
function shout(L, t) {
  const chunks = [];
  // break at punctuation first, then into balanced runs of at most 3 words ("AT 1 AM!" / "HALF ASLEEP!", never "AM! HALF")
  for (const ph of L.text.split(/(?<=[.,!?])\s+/)) { const w = ph.split(" "), n = Math.ceil(w.length / 3), per = Math.ceil(w.length / n); for (let k = 0; k < w.length; k += per) chunks.push(w.slice(k, k + per).join(" ")); }
  const tot = chunks.reduce((a, c) => a + c.length + 1, 0), u = clamp((t - L.s) / (L.e - L.s)) * tot; let acc = 0, cur = 0, start = 0;
  chunks.forEach((c, k) => { if (u >= acc) { cur = k; start = acc; } acc += c.length + 1; });
  const c = chunks[cur], age = (u - start) / tot * (L.e - L.s), hot = /[A-Z]{3,}|!/.test(c);
  return `<div style="position:absolute;left:20px;right:20px;top:1000px;text-align:center"><span style="display:inline-block;max-width:660px;font:${c.length > 16 ? 28 : c.length > 12 ? 34 : c.length > 8 ? 42 : 50}px/1.2 Px;letter-spacing:0;text-transform:uppercase;color:${hot ? "#d3f05a" : "#fff"};-webkit-text-stroke:0;text-shadow:5px 5px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;transform:scale(${1 + (c.length > 12 ? 0.08 : 0.2) * Math.max(0, 1 - age / 0.1)}) rotate(${(cur % 2 ? 1 : -1)}deg)">${c}</span></div>`;
}
// moments that hit: stamps and the big lines shake the frame
const HITS = () => [[st("hook") + 0.05, 0.8], [st("snap") + 1.0, 1.6], [st("three") + 0.3, 1], [st("gone") + 0.05, 1.4], [st("fix") + 0.05, 0.7], [st("sticks") + 0.45, 1.2], [st("count") + 0.4, 1.2]];
function frameShake(t, lt) {
  const punch = t < 0.4 ? 1 : 1 + 0.09 * Math.max(0, 1 - Math.max(0, lt) / 0.2) ** 2;
  let sh = 0; for (const [ht, a] of HITS()) { const d = t - ht; if (d > 0 && d < 0.35) sh = Math.max(sh, a * (1 - d / 0.35)); }
  const tf = `translate(${Math.sin(t * 83) * 14 * sh}px,${Math.cos(t * 71) * 11 * sh}px) scale(${punch})`;
  document.getElementById("c").style.transform = tf; ov.style.transform = tf;
}
window.renderAt = (t) => {
  const i = shotIdx(t), L = lines[i], shot = L.shot, lt = t - (L.s - 0.1);
  if (shot === "count" || shot === "cta" || shot === "end") {
    renderer.render(scene3d("sticks", len("sticks"), t), camera);
    const lc = t - st("count");
    ov.innerHTML = endCard(lc) + (shot !== "end" && L.text ? shout(L, t).replace("top:1000px", "top:1050px") : ""); frameShake(t, lt); return; }
  const scene = scene3d(shot, lt, t); renderer.render(scene, camera);
  let h = "";
  if (shot === "hook") h += A(0, 140, `<div style="width:720px;text-align:center;font:44px/1.3 Px;color:#fff;transform:scale(${t < 0.4 ? 1 : outBack(lt / 0.22)});text-shadow:5px 5px 0 #000">YOU CAN QUOTE<br>A TIKTOK YOU<br>SAW <span style="color:#d3f05a">ONCE.</span></div>`);
  if (shot === "hook") { const L2 = len("hook"); if (lt > L2 * 0.55) h += A(0, 360, `<div style="width:720px;text-align:center;font:34px/1.3 Px;color:#ff5a4a;text-shadow:4px 4px 0 #000;${pop((lt - L2 * 0.55) / 0.2)}">HALF ASLEEP. 1 AM.</div>`); }
  if (shot === "every") h += label("LAST NIGHT'S SCREEN TIME", "4H 12M", lt / 0.3);
  if (shot === "chapter" || shot === "three") h += label("BIO · CHAPTER 4", "32 PAGES", (t - st("chapter")) / 0.3);
  if (shot === "three") h += stamp("READ 3X", 70, 820, -8, lt - 0.3, "#ffffff");
  if (shot === "gone") h += stamp("FORGOTTEN", 130, 480, -10, lt - 0.05);
  if (shot === "scroll") { h += label("TONIGHT'S SCREEN TIME", "SAME 4H", lt / 0.3);
    // what she just learned, popping up as each reel goes by
    ["MITOCHONDRIA", "ATP", "DNA TO RNA"].forEach((w, j) => { const k = (lt - 0.3 - SWIPE * 0.75 - j * SWIPE) / 0.2; if (k > 0) h += A(470, 112 + j * 46, `<div style="white-space:nowrap;width:210px;text-align:center;font:16px Px;color:#0f1d18;background:#d3f05a;padding:8px 10px;box-shadow:4px 4px 0 #000;${pop(k)}">${w} <span style=\"font:700 17px Ins\">✓</span></div>`); }); }
  if (shot === "sticks") h += stamp("IT STUCK", 200, 470, 6, lt - 0.45, "#1f9d55");
  h += app(shot, lt);
  // a soft dark band so the serif captions read on any shot (the white test paper swallowed them)
  h += `<div style="position:absolute;left:0;right:0;top:930px;height:260px;background:linear-gradient(transparent,rgba(5,8,20,.55) 45%,rgba(5,8,20,.55) 70%,transparent)"></div>`;
  if (L.text && shot !== "hook") h += shout(L, t);
  // a white flash on every cut, a red pulse through the "problem" half, and the whole frame punching in and shaking
  const flash = Math.max(0, 1 - lt / 0.09) * 0.55;
  if (flash > 0 && i > 0) h += `<div style="position:absolute;inset:0;background:#fff;opacity:${flash}"></div>`;
  if (t < st("fix")) h += `<div style="position:absolute;inset:0;box-shadow:inset 0 0 ${140 + 60 * Math.abs(Math.sin(t * 7))}px rgba(229,48,42,${0.28 + 0.18 * Math.abs(Math.sin(t * 7))})"></div>`;
  ov.innerHTML = h;
  frameShake(t, lt);
};
await new Promise((r) => { const chk = () => (reelTex.image ? r() : setTimeout(chk, 50)); chk(); });
window.renderAt(0); setTimeout(() => (window.ready = true), 600);
