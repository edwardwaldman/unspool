<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:720px;height:1280px;overflow:hidden;background:#000;font-family:"DejaVu Sans",sans-serif}
#s{position:absolute;inset:0;overflow:hidden}
.b{position:absolute;background:#fbf7ee;color:#1b1b2a;font:700 15px "DejaVu Sans";padding:6px 12px;border-radius:14px;box-shadow:0 2px 0 rgba(0,0,0,.25);white-space:nowrap}
</style></head><body><div id="s"></div><script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},mix=(a,b,x)=>a+(b-a)*x;
const lerpC=(a,b,x)=>{const p=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));const A=p(a),B=p(b);return`rgb(${A.map((v,i)=>Math.round(mix(v,B[i],x))).join(",")})`};
const DUR=15.5;window.DUR=DUR;const s=document.getElementById("s");
const THOUGHTS=["page 3 of 412","what's mitosis again??","highlight everything","reread page 1","why is it 2am","is this even on the test","chapter 7??","just 10 more pages","coffee #4","drop out??"];
const CLK=[[0,"21:30"],[1.3,"21:30"],[2.6,"22:15"],[3.4,"23:02"],[4.4,"00:31"],[5.4,"01:47"],[6.4,"03:16"],[7.3,"04:58"],[8.2,"06:20"],[9.0,"07:30"]];
const clock=t=>{let c=CLK[0][1];for(const[a,b]of CLK)if(t>=a)c=b;return c};
function face(x,y,mood,skin,t,o={}){ // mood: calm, worry, sleep, wide, happy, tired
 const ey=mood==="sleep"||mood==="happy"?`<path d="M-15 -2 q6 -6 12 0 M3 -2 q6 -6 12 0" stroke="#2a2440" stroke-width="3" fill="none" stroke-linecap="round" transform="${mood==="happy"?"":"scale(1,-1)"}"/>`
  :mood==="tired"?`<path d="M-15 -2 h11 M4 -2 h11" stroke="#2a2440" stroke-width="3" stroke-linecap="round"/><circle cx="-9" cy="4" r="3.5" fill="#2a2440"/><circle cx="10" cy="4" r="3.5" fill="#2a2440"/>`
  :`<circle cx="-9" cy="0" r="${mood==="wide"?6:4.5}" fill="#2a2440"/><circle cx="10" cy="0" r="${mood==="wide"?6:4.5}" fill="#2a2440"/>`;
 const mo=mood==="happy"?`<path d="M-9 13 q10 10 20 0" stroke="#2a2440" stroke-width="3" fill="none" stroke-linecap="round"/>`:mood==="worry"||mood==="wide"||mood==="tired"?`<path d="M-7 17 q8 -6 16 0" stroke="#2a2440" stroke-width="3" fill="none" stroke-linecap="round"/>`:mood==="sleep"?`<circle cx="1" cy="15" r="3" fill="#2a2440"/>`:`<path d="M-6 14 h14" stroke="#2a2440" stroke-width="3" stroke-linecap="round"/>`;
 const brow=mood==="worry"||mood==="tired"?`<path d="M-17 -12 l11 -4 M5 -16 l11 4" stroke="#2a2440" stroke-width="3" stroke-linecap="round"/>`:"";
 return `<g transform="translate(${x},${y})"><circle r="40" fill="${skin}"/>${o.hair?`<path d="M-40 -6 a40 40 0 0 1 80 0 q-20 -14 -40 -12 q-20 -2 -40 12z" fill="${o.hair}"/>`:""}${ey}${brow}${mo}</g>`;
}
window.renderAt=t=>{
 // light: night -> dawn (7.5-9.2) -> day
 const dawn=clamp((t-7.6)/1.4);
 const wall=lerpC("#1b1d33","#3a3446",dawn), floor=lerpC("#15172a","#2c2836",dawn);
 const skyTop=lerpC("#0d1430","#f2a65a",dawn), skyBot=lerpC("#1c2550","#ffd59a",dawn);
 const dim=mix(.55,1,dawn); let h="";
 h+=`<svg width="720" height="1280" viewBox="0 0 720 1280" style="position:absolute;inset:0">
 <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${skyTop}"/><stop offset="1" stop-color="${skyBot}"/></linearGradient>
 <radialGradient id="beam" cx="0.5" cy="0" r="1"><stop offset="0" stop-color="#ffd59a" stop-opacity="${.45*dawn}"/><stop offset="1" stop-color="#ffd59a" stop-opacity="0"/></radialGradient>
 <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#bcd8ff" stop-opacity=".5"/><stop offset="1" stop-color="#bcd8ff" stop-opacity="0"/></radialGradient></defs>
 <rect width="720" height="1280" fill="${wall}"/>
 ${Array.from({length:18},(_,i)=>`<rect x="${i*40}" y="0" width="2" height="900" fill="#000" opacity=".08"/>`).join("")}
 <rect x="0" y="900" width="720" height="380" fill="${floor}"/>
 <ellipse cx="360" cy="985" rx="330" ry="40" fill="#000" opacity=".25"/>
 <g transform="translate(290,170)"><rect width="140" height="175" fill="url(#sky)"/>
  ${dawn<1?`<circle cx="98" cy="40" r="13" fill="#fff8d8" opacity="${1-dawn}"/><circle cx="104" cy="35" r="12" fill="${skyTop}" opacity="${1-dawn}"/>`:""}
  ${[[8,110,22,65],[34,95,18,80],[56,120,24,55],[84,100,20,75],[108,115,26,60]].map(([x,y,w,hh])=>`<rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="${lerpC("#0b0f22","#7a5a6a",dawn)}"/>`).join("")}
  ${[[14,122],[40,108],[60,130],[90,112],[114,128],[44,128]].map(([x,y],i)=>`<rect x="${x}" y="${y}" width="4" height="5" fill="#ffd46a" opacity="${(1-dawn)*((Math.floor(t*2+i)%3)?1:.3)}"/>`).join("")}
  <rect x="68" y="0" width="4" height="175" fill="#2a2440"/><rect x="0" y="85" width="140" height="4" fill="#2a2440"/>
  <rect x="-8" y="-6" width="156" height="187" fill="none" stroke="#2a2440" stroke-width="8"/></g>
 <path d="M272 158 h40 v210 q-22 -20 -40 0z M408 158 h40 v210 q-18 -20 -40 0z" fill="#5a4a7a" opacity=".9"/>
 <polygon points="290,345 430,345 640,960 80,960" fill="url(#beam)"/>
 <g transform="translate(40,700)"><rect width="270" height="250" rx="16" fill="${lerpC("#24305e","#3f5aa6",dawn)}"/><rect y="-40" width="270" height="70" rx="14" fill="#3a3460"/><rect x="0" y="110" width="270" height="140" rx="10" fill="${lerpC("#2c3b78","#4a69c0",dawn)}"/></g>
 <g transform="translate(410,700)"><rect width="270" height="250" rx="16" fill="${lerpC("#4a2f55","#a65a78",dawn)}"/><rect y="-40" width="270" height="70" rx="14" fill="#3a3460"/><rect x="0" y="110" width="270" height="140" rx="10" fill="${lerpC("#5a3866","#c26f8c",dawn)}"/></g>
 <rect x="318" y="800" width="84" height="150" rx="8" fill="#2a2440"/>
 </svg>`;
 // characters
 const leftMood=t<1.3?"calm":t<7.6?"worry":t<9.2?"tired":t<11.4?"sleep":"sleep";
 const rightMood=t<1.3?"calm":t<3.3?"happy":t<8.4?"sleep":t<9.4?"wide":"happy";
 const lift=t<9.2?0:0;
 let svg=`<svg width="720" height="1280" style="position:absolute;inset:0">`;
 svg+=face(175,760+lift,leftMood,"#e9dfe8",t,{hair:"#4a3b62"});
 svg+=face(545,760,rightMood,"#f1e4d6",t,{hair:"#3b2a20"});
 // left: textbook in hands while reading
 if(t<9.2) svg+=`<g transform="translate(120,800) rotate(${Math.sin(t*3)*2})"><rect width="110" height="76" rx="6" fill="#3a7d5c"/><rect x="6" y="6" width="98" height="64" fill="#f6f2e4"/><rect x="54" y="6" width="2" height="64" fill="#c9c2a8"/>${[0,1,2,3,4].map(i=>`<rect x="12" y="${16+i*10}" width="34" height="4" fill="#bbb"/><rect x="62" y="${16+i*10}" width="34" height="4" fill="#bbb"/>`).join("")}</g>`;
 // right: phone glow while scrolling reels (until falls asleep), phone on nightstand after
 if(t<3.3){ svg+=`<circle cx="545" cy="790" r="90" fill="url(#glow)"/><g transform="translate(522,792)"><rect width="46" height="80" rx="8" fill="#111"/><rect x="4" y="5" width="38" height="70" rx="4" fill="${["#c9e64a","#9db8ff","#e59cff","#ffc58a"][Math.floor(t*3)%4]}"/></g>`;}
 else svg+=`<g transform="translate(560,860) rotate(-25)"><rect width="34" height="60" rx="6" fill="#111"/></g>`;
 // ZZZ
 const z=(x,y)=>`<text x="${x}" y="${y-((t*30)%30)}" font-family="DejaVu Sans" font-weight="800" font-size="24" fill="#cfd6ff" opacity=".85">Z</text><text x="${x+16}" y="${y-18-((t*30)%30)}" font-size="18" font-weight="800" fill="#cfd6ff" opacity=".6">z</text>`;
 if(rightMood==="sleep") svg+=z(590,705);
 if(t>11.4) svg+=z(220,705);
 svg+=`</svg>`; h+=svg;
 // labels and clock
 h+=`<div style="position:absolute;left:40px;width:270px;top:968px;text-align:center;color:#fff;font:800 22px 'DejaVu Sans';letter-spacing:2px">THE READER</div>
 <div style="position:absolute;left:410px;width:270px;top:968px;text-align:center;color:#fff;font:800 22px 'DejaVu Sans';letter-spacing:1px;white-space:nowrap">THE UNSPOOLER</div>
 <div style="position:absolute;left:318px;width:84px;top:822px;text-align:center;color:#ff4a3a;font:700 21px 'DejaVu Sans Mono';text-shadow:0 0 8px #ff4a3a">${clock(t)}</div>`;
 // notification
 const note=(app,msg,t0,t1)=>{if(t<t0||t>t1)return"";const k=back((t-t0)/.3)*(1-clamp((t-t1+.25)/.25));return`<div style="position:absolute;left:40px;right:40px;top:${mix(-120,60,k)}px;background:rgba(250,250,250,.96);border-radius:22px;padding:16px 20px;box-shadow:0 8px 24px rgba(0,0,0,.35)"><div style="display:flex;gap:10px;align-items:center;color:#666;font:700 16px 'DejaVu Sans'"><span style="width:26px;height:26px;border-radius:7px;background:#3aa65a;display:inline-block"></span>${app}<span style="margin-left:auto;font-weight:400">now</span></div><div style="margin-top:6px;color:#111;font:600 24px 'DejaVu Sans'">${msg}</div></div>`};
 h+=note("SCHOOL","Reminder: Bio test tomorrow · Ch. 1–14",0.15,1.8);
 h+=note("UNSPOOL","biology.pdf → 38 reels ready ✓",1.5,3.0);
 // thought bubbles stack (left)
 const nT=t<1.6?0:Math.min(THOUGHTS.length,Math.floor((t-1.6)/0.6)+1);
 const vis=t<9.2||t<10.0;
 if(vis){ const fade=1-clamp((t-9.4)/.5); for(let i=0;i<nT;i++){const age=t-(1.6+i*.6); const sc=back(age/.25); const y=640-i*44-(nT-1-i)*0; const x=60+((i*37)%70);
   h+=`<div class="b" style="left:${x}px;top:${y-(nT>7?(nT-7)*0:0)}px;transform:scale(${sc}) rotate(${((i%3)-1)*2}deg);opacity:${fade};${i===nT-1?"background:#fff3c4":""}">${THOUGHTS[i]}</div>`;}
   if(t>9.0&&t<10.0){ for(let k=0;k<14;k++){const a=k*0.9, r=(t-9.0)*220; h+=`<div style="position:absolute;left:${170+Math.cos(a)*r}px;top:${450+Math.sin(a)*r}px;width:10px;height:10px;border-radius:50%;background:#fbf7ee;opacity:${1-(t-9)}"></div>`;} } }
 // morning: test notification + results
 h+=note("SCHOOL","Bio test starts in 30 min 📝",9.3,10.9);
 if(t>10.6&&t<13.6){ const k=back((t-10.6)/.3);
  h+=`<div style="position:absolute;left:66px;top:520px;width:200px;height:120px;background:#fbfbf6;border-radius:8px;transform:rotate(-4deg) scale(${k});box-shadow:0 6px 16px rgba(0,0,0,.4);padding:12px;box-sizing:border-box"><div style="font:800 16px 'DejaVu Sans';color:#333">BIO TEST</div><div style="position:absolute;right:16px;top:20px;font:900 54px serif;color:#e0262c">C−</div></div>
  <div style="position:absolute;left:446px;top:520px;width:200px;height:120px;background:#fbfbf6;border-radius:8px;transform:rotate(4deg) scale(${back((t-10.9)/.3)});box-shadow:0 6px 16px rgba(0,0,0,.4);padding:12px;box-sizing:border-box"><div style="font:800 16px 'DejaVu Sans';color:#333">BIO TEST</div><div style="position:absolute;right:16px;top:12px;width:78px;height:78px;border:6px solid #e0262c;border-radius:50%;font:900 44px/78px serif;color:#e0262c;text-align:center;transform:rotate(-12deg)">A+</div></div>`;}
 // headline
 if(t>11.4&&t<14.2){ const a=back((t-11.4)/.3), b=back((t-12.1)/.3);
  h+=`<div style="position:absolute;left:0;right:0;top:300px;text-align:center;color:#fff;font:900 54px/1.1 'DejaVu Sans';letter-spacing:-1px;text-shadow:0 4px 0 rgba(0,0,0,.4)"><div style="transform:scale(${a})">SAME TEXTBOOK.</div><div style="transform:scale(${b});opacity:${clamp((t-12.1)/.1)}">DIFFERENT <span style="color:#c9e64a">NIGHT.</span></div></div>`;}
 // end card
 if(t>=14.0){ const q=clamp((t-14)/.3);
  h+=`<div style="position:absolute;inset:0;background:#0f1d18;opacity:${q}"></div><div style="position:absolute;left:0;right:0;top:540px;text-align:center;color:#fff;font:800 96px 'DejaVu Sans';letter-spacing:-2px;opacity:${q};transform:scale(${back((t-14.05)/.3)})">unspool<span style="color:#c9e64a">.cc</span></div><div style="position:absolute;left:0;right:0;top:670px;text-align:center;color:#e9f0e4;font:400 34px 'DejaVu Sans';opacity:${clamp((t-14.4)/.3)}">your textbook, as reels</div>`;}
 const fo=clamp((t-(DUR-.35))/.35); if(fo>0) h+=`<div style="position:absolute;inset:0;background:#000;opacity:${fo}"></div>`;
 s.innerHTML=h;};
window.ready=true;
</script></body></html>
