<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Unb;src:url(Unbounded-700.ttf)}
@font-face{font-family:Ins;src:url(InstrumentSans-600.ttf)}
html,body{margin:0;width:720px;height:1280px;overflow:hidden;background:#000}
</style></head><body><canvas id="c" width="720" height="1280"></canvas>
<script>
const W = 720, H = 1280, cx = document.getElementById("c").getContext("2d");
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), mix = (a, b, x) => a + (b - a) * x;
const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const outBack = (x) => { x = clamp(x); const k = 1.7; return 1 + (k + 1) * Math.pow(x - 1, 3) + k * Math.pow(x - 1, 2); };
const LIME = "#d3f05a", INK = "#e9f0e4", BG = "#0f1d18", MONO = "bold 34px 'DejaVu Sans Mono'";
const img = (s) => { const i = new Image(); i.src = s; return i; };
const LOGO = img("lockup-horizontal.svg"), REEL1 = img("reel-1.jpg"), REEL2 = img("reel-2.jpg");

// Timeline (seconds)
const T = { title: 0, must: 2.0, count: 3.9, reveal: [9.0, 11.2, 13.4, 15.6], end: 19.4, dur: 22.0 };
window.DUR = T.dur;
window.TL = T;

// Stars: fixed field
const STARS = Array.from({ length: 260 }, (_, i) => { const r = Math.sin(i * 91.7) * 43758.5453; const f = (k) => { const v = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return v - Math.floor(v); }; return [f(1) * W, f(2) * H, f(3) * 1.6 + 0.3, f(4)]; });

const OPTS = [
  { n: "01", name: "Read all 400 pages", out: ["Asleep by", "page 12"], kind: "book" },
  { n: "02", name: "Highlight everything", out: ["The whole book", "is yellow now"], kind: "hl" },
  { n: "03", name: "Pull an all-nighter", out: ["Forgot it all", "by 9am"], kind: "coffee" },
  { n: "04", name: "Unspool it", out: ["400 pages → 12 reels", "+ a quiz. Passed."], kind: "spool" },
];
const GRID = [[200, 440], [520, 440], [200, 850], [520, 850]];

function bg(t) {
  const g = cx.createRadialGradient(W / 2, H * 0.45, 50, W / 2, H * 0.45, H * 0.8);
  g.addColorStop(0, "#132a20"); g.addColorStop(1, "#050a08");
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  for (const [x, y, r, p] of STARS) { cx.globalAlpha = 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(t * 2 + p * 30)); cx.fillStyle = "#fff"; cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.fill(); }
  cx.globalAlpha = 1;
}

function text(s, x, y, { font = MONO, color = "#fff", align = "center", alpha = 1, shadow = true } = {}) {
  cx.save(); cx.globalAlpha = alpha; cx.font = font; cx.textAlign = align; cx.textBaseline = "middle";
  if (shadow) { cx.shadowColor = "rgba(0,0,0,.8)"; cx.shadowBlur = 10; }
  cx.fillStyle = color; cx.fillText(s, x, y); cx.restore();
}

// One "planet": a glowing orb with its own surface, drawn at (x, y) radius r.
function orb(o, x, y, r, t) {
  cx.save();
  // glow
  const glowC = { book: "rgba(240,228,200,", hl: "rgba(255,230,60,", coffee: "rgba(200,130,70,", spool: "rgba(211,240,90," }[o.kind];
  const gl = cx.createRadialGradient(x, y, r * 0.8, x, y, r * 1.6); gl.addColorStop(0, glowC + "0.35)"); gl.addColorStop(1, glowC + "0)");
  cx.fillStyle = gl; cx.beginPath(); cx.arc(x, y, r * 1.6, 0, 7); cx.fill();
  cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.clip();
  const spin = t * 0.25;
  if (o.kind === "book") {
    cx.fillStyle = "#efe6cf"; cx.fillRect(x - r, y - r, 2 * r, 2 * r);
    cx.strokeStyle = "rgba(60,50,40,.55)"; cx.lineWidth = r * 0.035;
    for (let i = -12; i <= 12; i++) { const yy = y + i * r * 0.11; const off = ((spin * r * 0.6) % (r * 0.5)); cx.beginPath(); for (let k = -1; k < 6; k++) { const xs = x - r + k * r * 0.5 + off; cx.moveTo(xs + r * 0.04, yy); cx.lineTo(xs + r * 0.4, yy); } cx.stroke(); }
  } else if (o.kind === "hl") {
    cx.fillStyle = "#fff6b0"; cx.fillRect(x - r, y - r, 2 * r, 2 * r);
    for (let i = -10; i <= 10; i++) { cx.fillStyle = i % 2 ? "#ffe83a" : "#fff176"; cx.fillRect(x - r, y + i * r * 0.1 + Math.sin(spin + i) * 2, 2 * r, r * 0.07); }
    cx.strokeStyle = "rgba(90,80,20,.35)"; cx.lineWidth = r * 0.03;
    for (let i = -9; i <= 9; i++) { cx.beginPath(); cx.moveTo(x - r, y + i * r * 0.1 + r * 0.035); cx.lineTo(x + r, y + i * r * 0.1 + r * 0.035); cx.stroke(); }
  } else if (o.kind === "coffee") {
    const g = cx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, "#8a5530"); g.addColorStop(0.7, "#5b3519"); g.addColorStop(1, "#2e1a0c"); cx.fillStyle = g; cx.fillRect(x - r, y - r, 2 * r, 2 * r);
    cx.strokeStyle = "rgba(240,210,170,.6)"; cx.lineWidth = r * 0.05;
    for (let k = 0; k < 3; k++) { cx.beginPath(); cx.arc(x, y, r * (0.25 + k * 0.2), spin + k, spin + k + 3.6); cx.stroke(); }
  } else {
    cx.fillStyle = "#2a3a22"; cx.fillRect(x - r, y - r, 2 * r, 2 * r);
    // thread wrapped around the orb
    for (let i = -14; i <= 14; i++) { cx.fillStyle = i % 2 ? LIME : "#b8d64a"; cx.fillRect(x - r, y + i * r * 0.075, 2 * r, r * 0.05); }
    // little reel cards orbiting on the surface
    for (let k = 0; k < 4; k++) { const a = spin * 2 + k * 1.57; const px = x + Math.cos(a) * r * 0.62, sc = (Math.sin(a) + 1.2) / 2.2; cx.fillStyle = `rgba(15,29,24,${0.5 + 0.5 * sc})`; cx.fillRect(px - r * 0.12 * sc, y - r * 0.22 * sc + Math.sin(k) * r * 0.3, r * 0.24 * sc, r * 0.42 * sc); }
  }
  // shading: lit from the upper left
  const sh = cx.createRadialGradient(x - r * 0.4, y - r * 0.45, r * 0.1, x, y, r * 1.05);
  sh.addColorStop(0, "rgba(255,255,255,.28)"); sh.addColorStop(0.5, "rgba(0,0,0,0)"); sh.addColorStop(1, "rgba(0,0,0,.6)");
  cx.fillStyle = sh; cx.fillRect(x - r, y - r, 2 * r, 2 * r);
  cx.restore();
}

function phone(x, y, w, t, shown) {
  const h = w * 16 / 9, r = 34;
  cx.save();
  cx.fillStyle = "#050505"; roundRect(x - w / 2 - 10, y - h / 2 - 10, w + 20, h + 20, r + 8); cx.fill();
  cx.beginPath(); roundRect(x - w / 2, y - h / 2, w, h, r); cx.clip();
  const sw = t % 2.4 < 1.2 ? 0 : 1; // swipe between two reels
  const p = clamp(((t % 1.2) - 0.95) / 0.25);
  const a = sw ? REEL2 : REEL1, b = sw ? REEL1 : REEL2;
  if (a.complete) cx.drawImage(a, x - w / 2, y - h / 2 - p * h, w, h);
  if (b.complete) cx.drawImage(b, x - w / 2, y + h / 2 - p * h, w, h);
  cx.restore();
}
function roundRect(x, y, w, h, r) { cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }

function check(x, y, s, p) {
  cx.save(); cx.strokeStyle = LIME; cx.lineWidth = s * 0.16; cx.lineCap = "round"; cx.lineJoin = "round";
  cx.beginPath(); cx.arc(x, y, s, 0, 7 * ease(p)); cx.stroke();
  const q = clamp(p * 2 - 1);
  if (q > 0) { cx.beginPath(); cx.moveTo(x - s * 0.45, y); const m = [x - s * 0.1, y + s * 0.35], e = [x + s * 0.5, y - s * 0.35]; if (q < 0.4) cx.lineTo(mix(x - s * 0.45, m[0], q / 0.4), mix(y, m[1], q / 0.4)); else { cx.lineTo(...m); cx.lineTo(mix(m[0], e[0], (q - 0.4) / 0.6), mix(m[1], e[1], (q - 0.4) / 0.6)); } cx.stroke(); }
  cx.restore();
}

function outcomeFX(o, t, x, y, r) {
  // small gags around the zoomed orb
  if (o.kind === "book") for (let k = 0; k < 3; k++) { const tt = (t * 0.8 + k / 3) % 1; text("z", x + r * 0.7 + tt * 90 + k * 10, y - r * 0.6 - tt * 160, { font: `bold ${34 + tt * 40}px 'DejaVu Sans Mono'`, alpha: Math.sin(tt * Math.PI), color: INK }); }
  if (o.kind === "coffee") for (let k = 0; k < 3; k++) { const tt = (t * 0.6 + k / 3) % 1; cx.save(); cx.globalAlpha = Math.sin(tt * Math.PI) * 0.5; cx.strokeStyle = "#fff"; cx.lineWidth = 10; cx.lineCap = "round"; cx.beginPath(); const bx = x - 60 + k * 60; for (let s = 0; s < 7; s++) { const yy = y - r - 10 - s * 12 - tt * 40; cx.lineTo(bx + Math.sin(s * 0.8 + t * 3) * 14, yy); } cx.stroke(); cx.restore(); }
}

window.renderAt = function (t) {
  bg(t);
  const r0 = 112;
  if (t < T.reveal[0]) {
    // the menu: four orbs pop in, labels under them
    OPTS.forEach((o, i) => {
      const p = outBack((t - 0.15 - i * 0.12) / 0.5);
      const [x, y] = GRID[i];
      const bob = Math.sin(t * 1.3 + i * 1.7) * 6;
      const beat = t > T.count ? 1 + 0.04 * Math.max(0, 1 - ((t - T.count) % 1) * 4) : 1;
      if (p > 0) orb(o, x, y + bob, r0 * p * beat, t);
      text(o.n, x, y + r0 + 38, { font: "bold 26px 'DejaVu Sans Mono'", alpha: clamp(p), color: INK });
      text(o.name, x, y + r0 + 72, { font: "600 23px Ins", alpha: clamp(p) * 0.85, color: "#b9c7b5" });
    });
    // header: title → stakes → countdown
    if (t < T.must) text("Choose a Study Method", W / 2, 190, { alpha: clamp(t / 0.3) });
    else if (t < T.count) { const a = clamp((t - T.must) / 0.25); text("You Have to Pass", W / 2, 165, { alpha: a }); text("the Final Tomorrow", W / 2, 215, { alpha: a }); }
    else { const k = Math.floor(t - T.count); const n = 5 - k; const f = (t - T.count) % 1; if (n >= 1) text(String(n), W / 2, 190, { font: `bold ${mix(150, 110, ease(f / 0.3))}px 'DejaVu Sans Mono'`, alpha: 1 - clamp((f - 0.85) / 0.15) * 0.3 }); }
    text("unspool.cc", W - 40, 1210, { font: "600 22px Ins", align: "right", color: "#7d8f7a" });
    return;
  }
  if (t < T.end) {
    const i = T.reveal.filter((s) => t >= s).length - 1, o = OPTS[i], lt = t - T.reveal[i];
    const [gx, gy] = GRID[i];
    const z = ease(lt / 0.55);
    const last = i === 3;
    const x = mix(gx, W / 2, z), y = mix(gy, last ? 385 : 600, z), r = mix(r0, last ? 125 : 245, z);
    // flash on the cut
    orb(o, x, y, r, t);
    if (!last) outcomeFX(o, t, x, y, r);
    text(`Option ${i + 1}`, W / 2, 140, { alpha: clamp(lt / 0.2), color: INK, font: "bold 28px 'DejaVu Sans Mono'" });
    text(o.name, W / 2, 190, { alpha: clamp(lt / 0.2) });
    const pa = clamp((lt - 0.7) / 0.25);
    if (!last) {
      o.out.forEach((s, k) => text(s, W / 2, 940 + k * 66, { font: "48px Unb", color: k === 1 ? LIME : "#fff", alpha: pa }));
      if (pa > 0) { cx.save(); cx.globalAlpha = pa; cx.strokeStyle = "#ff6b5a"; cx.lineWidth = 12; cx.lineCap = "round"; const c = [W / 2, 1150], s = 32; cx.beginPath(); cx.moveTo(c[0] - s, c[1] - s); cx.lineTo(c[0] + s, c[1] + s); cx.moveTo(c[0] + s, c[1] - s); cx.lineTo(c[0] - s, c[1] + s); cx.stroke(); cx.restore(); }
    } else {
      const pp = outBack((lt - 0.5) / 0.6);
      if (pp > 0) { cx.save(); cx.translate(W / 2, 790); cx.scale(pp, pp); cx.translate(-W / 2, -790); phone(W / 2, 790, 225, lt, true); cx.restore(); }
      text(o.out[0], W / 2, 1075, { font: "38px Unb", alpha: clamp((lt - 1.2) / 0.3) });
      text(o.out[1], W / 2, 1128, { font: "38px Unb", color: LIME, alpha: clamp((lt - 1.9) / 0.3) });
      check(W / 2, 1210, 30, (lt - 2.4) / 0.6);
    }
    const flash = 1 - clamp(lt / 0.18);
    if (flash > 0) { cx.fillStyle = `rgba(255,255,255,${flash * 0.35})`; cx.fillRect(0, 0, W, H); }
    return;
  }
  // end card
  const lt = t - T.end;
  cx.fillStyle = `rgba(15,29,24,${clamp(lt / 0.4)})`; cx.fillRect(0, 0, W, H);
  const a = clamp((lt - 0.2) / 0.4);
  if (LOGO.complete) { cx.save(); cx.globalAlpha = a; const lw = 460, lh = lw * 100 / 820.89; cx.drawImage(LOGO, W / 2 - lw / 2, 520 - lh / 2 + (1 - a) * 20, lw, lh); cx.restore(); }
  text("Choose option 4.", W / 2, 650, { font: "40px Unb", alpha: clamp((lt - 0.5) / 0.4), shadow: false });
  text("Turn any document into study reels.", W / 2, 715, { font: "600 28px Ins", color: "#b9c7b5", alpha: clamp((lt - 0.8) / 0.4), shadow: false });
  const b = clamp((lt - 1.1) / 0.4);
  if (b > 0) { cx.save(); cx.globalAlpha = b; cx.fillStyle = LIME; roundRect(W / 2 - 170, 790, 340, 76, 38); cx.fill(); cx.restore(); text("Try it free · unspool.cc", W / 2, 828, { font: "600 26px Ins", color: BG, alpha: b, shadow: false }); }
};
Promise.all([document.fonts.load("48px Unb"), document.fonts.load("600 20px Ins"), ...[LOGO, REEL1, REEL2].map((i) => i.decode().catch(() => {}))]).then(() => { window.renderAt(0); window.ready = true; });
</script></body></html>
