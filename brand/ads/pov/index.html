<script type="module">
import * as THREE from "three";

const TL = await (await fetch("tl.json")).json();
const W = 720, H = 1280;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const mix = (a, b, x) => a + (b - a) * x;
const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
function rng(seed) { return () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646; }

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 200);
const hemi = new THREE.HemisphereLight("#ffffff", "#334", 0.8);
const sun = new THREE.DirectionalLight("#fff", 2.2);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 0.5, far: 60 });
sun.shadow.bias = -0.0005;

lamp.castShadow = true;
scene.add(hemi, sun, sun.target, lamp);

// ---------- builders ----------
const mats = new Map();
const mat = (c, extra = {}) => { const k = c + JSON.stringify(extra); if (!mats.has(k)) mats.set(k, new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, ...extra })); return mats.get(k); };
function box(g, w, h, d, c, x, y, z, extra) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof c === "string" ? mat(c, extra) : c);
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; g.add(m); return m;
}
function tex(w, h, draw) {
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  draw(cv.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
function plane(g, w, h, t, x, y, z, ry = 0, emissive = false) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), emissive ? new THREE.MeshBasicMaterial({ map: t, toneMapped: false }) : new THREE.MeshStandardMaterial({ map: t, roughness: 0.9 }));
  m.position.set(x, y, z); m.rotation.y = ry; g.add(m); return m;
}
// A blocky person. pose: stand | sit | lie. Returns parts for animation.
function person(g, o) {
  const p = new THREE.Group(); g.add(p);
  const { shirt = "#e0a030", pants = "#2f4c7a", skin = "#c98c5a", hair = "#3b2414" } = o;
  const legs = new THREE.Group(); p.add(legs);
  const sit = o.pose === "sit";
  for (const s of [-0.13, 0.13]) {
    if (sit) { box(legs, 0.22, 0.22, 0.6, pants, s, 0.55, 0.25); box(legs, 0.22, 0.5, 0.22, pants, s, 0.25, 0.48); }
    else box(legs, 0.22, 0.8, 0.22, pants, s, 0.4, 0);
  }
  const torso = box(p, 0.56, 0.7, 0.34, shirt, 0, sit ? 1.0 : 1.15, 0);
  const armL = new THREE.Group(), armR = new THREE.Group();
  armL.position.set(-0.38, sit ? 1.3 : 1.45, 0); armR.position.set(0.38, sit ? 1.3 : 1.45, 0);
  box(armL, 0.18, 0.62, 0.2, shirt, 0, -0.3, 0); box(armR, 0.18, 0.62, 0.2, shirt, 0, -0.3, 0);
  box(armL, 0.16, 0.14, 0.16, skin, 0, -0.66, 0); box(armR, 0.16, 0.14, 0.16, skin, 0, -0.66, 0);
  p.add(armL, armR);
  const head = new THREE.Group(); head.position.set(0, sit ? 1.62 : 1.77, 0); p.add(head);
  box(head, 0.46, 0.46, 0.46, skin, 0, 0, 0);
  box(head, 0.5, 0.14, 0.5, hair, 0, 0.22, 0); box(head, 0.5, 0.3, 0.12, hair, 0, 0.08, -0.2);
  box(head, 0.06, 0.06, 0.02, "#1a1a1a", -0.1, 0.03, 0.235); box(head, 0.06, 0.06, 0.02, "#1a1a1a", 0.1, 0.03, 0.235);
  p.position.set(o.x ?? 0, o.y ?? 0, o.z ?? 0); p.rotation.y = o.ry ?? 0;
  return { p, armL, armR, head, torso };
}
function tree(g, x, z, s = 1, c = "#4f9a3c") {

  c.fillStyle = "#0f1d18"; c.font = "bold 17px sans-serif"; c.fillText(done ? "Watch ▶" : "Upload", 160, 162);
  if (active && lt > PRESS && lt < PRESS + 0.6) { const r = (lt - PRESS) / 0.6; c.strokeStyle = `rgba(211,240,90,${1 - r})`; c.lineWidth = 4; c.beginPath(); c.arc(170, 158, 10 + r * 60, 0, Math.PI * 2); c.stroke(); }
  if (active && !done) { // cursor
    const k = ease((lt - 0.15) / 0.85), x = mix(285, 172, k), y = mix(195, 160, k), sc = pressed ? 0.85 : 1;
    c.save(); c.translate(x, y); c.scale(sc, sc); c.fillStyle = "#fff"; c.strokeStyle = "#000"; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 22); c.lineTo(6, 17); c.lineTo(10, 26); c.lineTo(14, 24); c.lineTo(10, 15); c.lineTo(17, 15); c.closePath(); c.fill(); c.stroke(); c.restore();
  }
  laptopTex.needsUpdate = true;
}
drawLaptop(0, false);
const monitorTex = tex(320, 200, (c, w, h) => {
  c.fillStyle = "#f4f4f1"; c.fillRect(0, 0, w, h);
  c.fillStyle = "#333"; c.font = "bold 16px sans-serif"; c.fillText("Q3-report.pdf", 14, 26);
  c.fillStyle = "#999"; c.font = "12px sans-serif"; c.fillText("page 1 of 80", 220, 26);

  c.fillStyle = gr; c.fillRect(0, 0, w, h);
  const r = rng(9);
  for (let i = 0; i < 9; i++) {
    const bx = i * 30 - 6, bh = 70 + r() * 120;
    c.fillStyle = night ? "#121a33" : "#a9bccb"; c.fillRect(bx, h - bh, 26, bh);
    if (night) for (let y = h - bh + 8; y < h - 6; y += 14) for (let x = bx + 4; x < bx + 22; x += 8) if (r() > 0.55) { c.fillStyle = "#f6c95c"; c.fillRect(x, y, 4, 6); }
  }
  c.strokeStyle = "#e8e2d6"; c.lineWidth = 10; c.strokeRect(0, 0, w, h); c.beginPath(); c.moveTo(w / 2, 0); c.lineTo(w / 2, h); c.moveTo(0, h / 2); c.lineTo(w, h / 2); c.stroke();
});
const boardTex = tex(512, 256, (c, w, h) => {
  c.fillStyle = "#2f5a3e"; c.fillRect(0, 0, w, h); c.strokeStyle = "#8a6438"; c.lineWidth = 16; c.strokeRect(0, 0, w, h);
  c.fillStyle = "#f2f2ea"; c.font = "bold 44px serif"; c.fillText("UNIT 3 EXAM", 40, 70);
  c.font = "28px serif"; c.fillText("1) Population or sample?", 40, 130); c.fillText("2) Name the method.", 40, 175);
});
const paperTex = tex(256, 320, (c, w, h) => {
  c.fillStyle = "#fbfbf6"; c.fillRect(0, 0, w, h);
  for (let i = 0; i < 9; i++) { c.fillStyle = "#cfd3d8"; c.fillRect(20, 120 + i * 20, 150, 5); }
  c.strokeStyle = "#e0262c"; c.lineWidth = 8; c.beginPath(); c.arc(170, 70, 50, 0, Math.PI * 2); c.stroke();
  c.fillStyle = "#e0262c"; c.font = "bold 58px serif"; c.textAlign = "center"; c.fillText("A+", 170, 90);
});

// ---------- sets ----------
const sets = {};
const mk = (name) => { const g = new THREE.Group(); g.visible = false; scene.add(g); sets[name] = g; return g; };

// Room shell (shared by indoor shots); wall colors restyled per shot.

box(room, 12, 0.2, 12, floorM, 0, -0.1, 0);
for (let i = -6; i < 6; i += 0.6) box(room, 0.02, 0.01, 12, "#6e4627", i, 0.005, 0);
box(room, 12, 6, 0.2, wallM, 0, 3, -3);
box(room, 0.2, 6, 12, wallM, -4, 3, 3);
const winNight = windowTex(true), winDay = windowTex(false);
const win = plane(room, 2.2, 2.2, winNight, 1.2, 2.8, -2.88, 0, true);

// Desk at night (shots: night, upload)
const deskSet = mk("desk");
box(deskSet, 2.4, 0.12, 1.1, "#9a6b3f", 0, 1.0, -1.9);
for (const [x, z] of [[-1.1, -2.35], [1.1, -2.35], [-1.1, -1.45], [1.1, -1.45]]) box(deskSet, 0.1, 1.0, 0.1, "#7a5230", x, 0.5, z);
box(deskSet, 0.6, 0.08, 0.6, "#3a3a3a", 0, 0.6, -0.8); box(deskSet, 0.6, 0.7, 0.08, "#3a3a3a", 0, 0.95, -0.5); box(deskSet, 0.08, 0.6, 0.08, "#222", 0, 0.3, -0.8);
const lampG = new THREE.Group(); deskSet.add(lampG);
box(lampG, 0.3, 0.05, 0.3, "#222", -0.9, 1.08, -2.1); box(lampG, 0.05, 0.6, 0.05, "#222", -0.9, 1.4, -2.1);
box(lampG, 0.34, 0.18, 0.3, "#e3b23c", -0.8, 1.7, -2.0, { emissive: "#7a5410" });
const stack = new THREE.Group(); stack.position.set(0.55, 1.06, -1.95); deskSet.add(stack);
{ const r = rng(4); for (let i = 0; i < 46; i++) box(stack, 0.62, 0.045, 0.82, i % 7 === 0 ? "#f2e9c9" : "#f7f7f2", (r() - 0.5) * 0.06, i * 0.05 + 0.02, (r() - 0.5) * 0.06).rotation.y = (r() - 0.5) * 0.12; }
const laptop = new THREE.Group(); laptop.position.set(-0.25, 1.06, -1.8); deskSet.add(laptop);
box(laptop, 0.9, 0.04, 0.6, "#b9bec4", 0, 0.02, 0);
const lid = new THREE.Group(); lid.position.set(0, 0.04, -0.3); laptop.add(lid);
box(lid, 0.9, 0.58, 0.03, "#b9bec4", 0, 0.29, 0); plane(lid, 0.84, 0.52, laptopTex, 0, 0.29, 0.02, 0, true); lid.rotation.x = -0.2;
const phoneDesk = new THREE.Group(); phoneDesk.position.set(0.45, 1.08, -1.45); phoneDesk.rotation.x = -Math.PI / 2 + 0.5; deskSet.add(phoneDesk);
box(phoneDesk, 0.3, 0.56, 0.03, "#111", 0, 0, 0); const phoneDeskScreen = plane(phoneDesk, 0.27, 0.5, REELS[0], 0, 0, 0.017, 0, true);
const kid = person(deskSet, { pose: "sit", shirt: "#d9822b", x: 0, z: -0.85, ry: Math.PI });
const pageTex = tex(128, 170, (c, w, h) => { c.fillStyle = "#fbfbf6"; c.fillRect(0, 0, w, h); c.fillStyle = "#333"; c.fillRect(12, 14, 70, 9); for (let i = 0; i < 10; i++) { c.fillStyle = "#c4c8cc"; c.fillRect(12, 36 + i * 12, 90 + ((i * 29) % 20), 5); } });
const pages = Array.from({ length: 16 }, (_, i) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.56), new THREE.MeshStandardMaterial({ map: pageTex, side: THREE.DoubleSide, roughness: 0.9, emissive: "#ffffff", emissiveMap: pageTex, emissiveIntensity: 0.55 })); m.castShadow = true; deskSet.add(m); return { m, i, spin: (i % 2 ? 1 : -1) * (2 + (i % 3)) }; });
const SCREEN = v3(-0.25, 1.4, -2.08);
const cards = Array.from({ length: 5 }, (_, i) => {
  const g = new THREE.Group(); deskSet.add(g);
  box(g, 0.47, 0.82, 0.03, "#111", 0, 0, -0.02); plane(g, 0.43, 0.77, REELS[i % 4], 0, 0, 0.0, 0, true);
  return { g, i };
});

// Bed (scroll)
const bedSet = mk("bed");
box(bedSet, 2.0, 0.5, 3.0, "#6b4a2b", -1.6, 0.25, -0.9); box(bedSet, 1.9, 0.25, 2.9, "#e8e6df", -1.6, 0.62, -0.9);
box(bedSet, 2.0, 1.1, 0.15, "#6b4a2b", -1.6, 0.85, -2.4); box(bedSet, 1.2, 0.18, 0.5, "#fff", -1.6, 0.85, -2.05);
box(bedSet, 1.9, 0.14, 1.3, "#5b7fc4", -1.6, 0.82, 0.05);

{ const glow = new THREE.PointLight("#9db8ff", 3, 2.2, 1.6); glow.position.set(-1.45, 1.25, -1.42); bedSet.add(glow); }
box(bedSet, 0.6, 0.7, 0.5, "#8a5a34", 0.2, 0.35, -2.3); box(bedSet, 0.22, 0.32, 0.22, "#e3b23c", 0.2, 0.86, -2.3, { emissive: "#6a4a10" });

      <div style="font:800 26px 'DejaVu Sans'">BIO UNIT 4 TEST</div><div style="margin-top:6px;color:#777;font-size:18px">Name: ____________</div>
      <div style="margin-top:28px;font:700 22px 'DejaVu Sans'">1. What does the mitochondria make?</div>
      ${["ATP", "DNA", "Glucose"].map((o, i) => `<div style="margin-top:16px;font-size:22px;display:flex;align-items:center;gap:12px"><span style="width:24px;height:24px;border:3px solid #333;border-radius:50%;display:inline-block;background:${checked && i === 0 ? "#222" : "transparent"}"></span>${o}</div>`).join("")}
      <div style="margin-top:26px;font:700 22px 'DejaVu Sans'">2. Cellular respiration makes ___ from glucose.</div>
      <div style="margin-top:12px;font:italic 700 26px 'DejaVu Serif',serif;color:#1d4fb8;opacity:${clamp((lt - 2.0) / 0.3) + (sh.n === "grade" ? 1 : 0)}">ATP</div>
      ${sh.n === "grade" ? `<div style="position:absolute;right:30px;top:24px;width:150px;height:150px;border:12px solid #e0262c;border-radius:50%;color:#e0262c;font:900 80px/130px serif;text-align:center;transform:rotate(-14deg) scale(${2 - back(lt / 0.25)});opacity:${clamp(lt / 0.08)}">A+</div>` : ""}</div>`;
    if (sh.n === "test") h += `<div style="position:absolute;left:${mix(560, 150, clamp((lt - 1.2) / 0.4))}px;top:${mix(1100, 720, clamp((lt - 1.2) / 0.4)) + (lt > 1.9 ? 160 : 0)}px;width:16px;height:200px;background:#f2c12e;border-radius:4px;transform:rotate(30deg);box-shadow:0 0 0 2px #b58d1a"></div>`;
    h += `<div style="position:absolute;left:0;right:0;top:1150px;text-align:center;font:800 44px 'DejaVu Sans';color:#fff;text-shadow:0 3px 0 #000">${sh.n === "test" ? (lt > 1.5 ? "seen it." : "") : "studied by scrolling."}</div>`;
  }
  if (sh.n === "end") h += `<div style="position:absolute;inset:0;background:#0f1d18"></div><div style="position:absolute;left:0;right:0;top:540px;text-align:center;color:#fff;font:800 96px 'DejaVu Sans';letter-spacing:-2px;transform:scale(${back(lt / 0.3)})">unspool<span style="color:#c9e64a">.cc</span></div><div style="position:absolute;left:0;right:0;top:670px;text-align:center;color:#e9f0e4;font:400 34px 'DejaVu Sans';opacity:${clamp((lt - 0.4) / 0.3)}">your textbook, as reels</div>`;
  if (t < 0.3) h += `<div class="fade" style="opacity:${1 - t / 0.3}"></div>`;
  ov.innerHTML = h;
};
window.DUR = PDUR;
window.ready = true;
</script></body></html>
