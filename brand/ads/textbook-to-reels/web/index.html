<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Arc; src: url(Archivo-ExtraBold.ttf); }
html, body { margin: 0; width: 720px; height: 1280px; overflow: hidden; background: #000; }
canvas { position: absolute; left: 0; top: 0; }
#ov { position: absolute; inset: 0; font-family: Arc; }
.cap { position: absolute; left: 80px; right: 80px; top: 262px; text-align: center; color: #fff; font: 800 44px/1.14 Arc; -webkit-text-stroke: 9px #14141f; paint-order: stroke fill; }
.cap b { color: #ffd23f; }
.chip { position: absolute; left: 0; right: 0; top: 168px; text-align: center; }
.chip span { display: inline-flex; align-items: center; gap: 10px; background: #ffd23f; color: #14141f; font: 800 40px Arc; padding: 6px 22px; border-radius: 14px; box-shadow: 4px 5px 0 #14141f; }
.bub { position: absolute; background: #fff; color: #14141f; font: 800 26px/1.15 Arc; padding: 10px 16px; border-radius: 18px; border: 4px solid #14141f; text-align: center; white-space: nowrap; }
.bub:after { content: ""; position: absolute; width: 0; height: 0; border: 14px solid transparent; }
.bub.dl:after { left: 22px; bottom: -28px; border-top-color: #14141f; }
.bub.dr:after { right: 22px; bottom: -28px; border-top-color: #14141f; }
.hud { position: absolute; left: 90px; right: 90px; top: 930px; display: flex; background: rgba(16,16,30,.88); border: 3px solid rgba(255,255,255,.35); border-radius: 18px; padding: 10px 0; }
.hud div { flex: 1; text-align: center; color: #fff; font: 800 30px Arc; border-left: 2px solid rgba(255,255,255,.18); }
.hud div:first-child { border-left: 0; }
.hud small { display: block; color: #8fd0ff; font: 800 15px Arc; letter-spacing: 1.5px; margin-bottom: 4px; }
</style></head>
<body><canvas id="cv" width="720" height="1280"></canvas><div id="ov"></div>
<script src="scene.js"></script>
</body></html>
