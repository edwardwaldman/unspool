<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:720px;height:1280px;overflow:hidden;background:#0f1d18;font-family:"DejaVu Sans",sans-serif}
#s{position:absolute;inset:0;overflow:hidden}
.hook{position:absolute;left:40px;right:40px;top:150px;text-align:center;color:#fff;font-weight:800;font-size:46px;line-height:1.18;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:0 3px 0 #000}
.hook span{background:#fff;color:#111;-webkit-text-stroke:0;padding:2px 10px;border-radius:8px;box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.5}
</style></head><body><div id="s"></div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const pad=n=>String(n).padStart(4,"0"); const s=document.getElementById("s");
const A=2.4,B=4.6,C=10.6,D=14.8,E=17.2; window.DUR=E;
const pre=[]; for(let i=1;i<=186;i++){const im=new Image();im.src=`r1/f${pad(i)}.jpg`;pre.push(im)} for(let i=1;i<=132;i++){const im=new Image();im.src=`r2/f${pad(i)}.jpg`;pre.push(im)}
const L=new Image(); L.src="landing.png"; pre.push(L);
const hook=(html,t0,t,top=150)=>`<div class="hook" style="top:${top}px;opacity:${clamp((t-t0)/.12)};transform:scale(${0.92+0.08*back((t-t0)/.25)})">${html}</div>`;
const tap=(x,y,t0,t)=>{const q=(t-t0)/.45; if(q<0||q>1) return ""; return `<div style="position:absolute;left:${x-40}px;top:${y-40}px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,${.55*(1-q)});transform:scale(${.6+q*1.2})"></div>`};
const reelUI=(n)=>`<div style="position:absolute;right:22px;bottom:230px;display:flex;flex-direction:column;gap:30px;align-items:center;color:#fff;font:700 18px 'DejaVu Sans';text-shadow:0 1px 3px #000">${["&#9829;","&#9993;","&#10148;","&#8943;"].map(c=>`<div style="font-size:40px">${c}</div>`).join("")}</div><div style="position:absolute;left:24px;bottom:120px;color:#fff;font:700 24px 'DejaVu Sans';text-shadow:0 1px 3px #000">unspool &middot; Reel ${n} of 38</div><div style="position:absolute;left:24px;bottom:84px;color:#fff;font:400 20px 'DejaVu Sans';text-shadow:0 1px 3px #000">biology-textbook.pdf</div>`;
window.renderAt=t=>{let h="";
 if(t<A){ const pr=t>1.7&&t<1.95;
   h+=`<img src="landing.png" style="position:absolute;left:0;top:0;width:720px;height:1280px;filter:brightness(${pr?.85:1})">`;
   h+=tap(360,856,1.7,t);
   h+=hook(`<span>my bio final is in 8 hours</span><br><span>and I just found this</span>`,0.05,t,560);
 } else if(t<B){ const lt=t-A;
   h+=`<img src="landing.png" style="position:absolute;inset:0;width:720px;height:1280px;filter:brightness(.45)">`;
   const up=ease(lt/.3); const prog=clamp((lt-.75)/1.2); const done=prog>=1;
   h+=`<div style="position:absolute;left:0;right:0;bottom:0;height:640px;background:#16231d;border-radius:34px 34px 0 0;transform:translateY(${(1-up)*640}px);padding:40px 44px;box-sizing:border-box;color:#e9f0e4">
     <div style="width:80px;height:8px;border-radius:4px;background:#2e3e36;margin:0 auto 34px"></div>
     <div style="font:700 30px 'DejaVu Sans'">${lt<.75?"Choose a file":done?"Ready":"Unspooling&hellip;"}</div>
     <div style="margin-top:28px;display:flex;align-items:center;gap:20px;border:2px solid ${lt>.45?"#c9e64a":"#2e3e36"};border-radius:16px;padding:22px">
       <div style="width:64px;height:80px;background:#e5484d;border-radius:8px;color:#fff;font:800 20px 'DejaVu Sans';display:flex;align-items:center;justify-content:center">PDF</div>
       <div><div style="font:700 26px 'DejaVu Sans'">biology-textbook.pdf</div><div style="margin-top:6px;color:#9db5a6;font:400 22px 'DejaVu Sans'">412 pages</div></div></div>
     ${lt>.75?`<div style="margin-top:44px;font:400 24px 'DejaVu Sans';color:#9db5a6">${done?"":"Turning "+Math.round(412*(1-prog))+" pages into reels&hellip;"}</div>
     <div style="margin-top:16px;height:14px;background:#22302a;border-radius:7px"><div style="height:100%;width:${prog*100}%;background:#c9e64a;border-radius:7px"></div></div>
     <div style="margin-top:22px;font:800 40px 'DejaVu Sans';color:#c9e64a;transform:scale(${done?back((lt-1.95)/.2):0})">38 reels ready &#10003;</div>`:""}</div>`;
   h+=tap(360,860,A+.45,t);
   h+=hook(`<span>you just upload the textbook</span>`,A,t,420);
 } else if(t<D){
   const r1=t<C+0.0; const sw=clamp((t-(C-.3))/.3), f1=Math.min(186,1+Math.floor((t-B)*30)), f2=Math.min(132,1+Math.max(0,Math.floor((t-C+.3)*30)));
   if(t<C){ h+=`<img src="r1/f${pad(f1)}.jpg" style="position:absolute;left:0;top:${-ease(sw)*1280}px;width:720px;height:1280px">`; if(sw>0) h+=`<img src="r2/f${pad(f2)}.jpg" style="position:absolute;left:0;top:${(1-ease(sw))*1280}px;width:720px;height:1280px">`; h+=`<div style="position:absolute;inset:0;transform:translateY(${-ease(sw)*1280}px)">${reelUI(1)}</div>`; }
   else { h+=`<img src="r2/f${pad(f2)}.jpg" style="position:absolute;left:0;top:0;width:720px;height:1280px">`+reelUI(2); }
   h+= t<C ? hook(`<span>and it turns the WHOLE thing</span><br><span>into reels like this</span>`,B,t) : hook(`<span>voiceover, captions</span><br><span>and a quiz in every one</span>`,C,t);
 } else { const lt=t-D;
   h+=`<div style="position:absolute;inset:0;background:#0f1d18"></div>
   <div style="position:absolute;left:0;right:0;top:470px;text-align:center;color:#fff;font:800 104px 'DejaVu Sans';letter-spacing:-3px;transform:scale(${back(lt/.3)})">unspool<span style="color:#c9e64a">.cc</span></div>
   <div style="position:absolute;left:0;right:0;top:620px;text-align:center;color:#e9f0e4;font:400 36px 'DejaVu Sans';opacity:${clamp((lt-.35)/.25)}">your textbook, as reels</div>
   <div style="position:absolute;left:0;right:0;top:700px;text-align:center;opacity:${clamp((lt-.7)/.25)}"><span style="background:#c9e64a;color:#0f1d18;font:800 30px 'DejaVu Sans';padding:12px 26px;border-radius:12px">first document free</span></div>`;
 }
 const fo=clamp((t-(E-.4))/.4); if(fo>0) h+=`<div style="position:absolute;inset:0;background:#000;opacity:${fo}"></div>`;
 s.innerHTML=h; };
let n=0; pre.forEach(im=>im.decode().then(()=>{if(++n===pre.length) window.ready=true}).catch(()=>{if(++n===pre.length) window.ready=true}));
</script></body></html>
