<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Arc; src: url(Archivo-ExtraBold.ttf); }
html, body { margin: 0; width: 720px; height: 1280px; overflow: hidden; background: #8fd0ff; }
canvas { position: absolute; left: 0; top: 0; }
</style></head>
<body><canvas id="gl" width="720" height="1280"></canvas><canvas id="ui" width="720" height="1280"></canvas>
<script type="module">
// A 3-second looping 3D pause challenge. One phone flies past fast, spinning. On exactly one frame (frame 30)
// it is upright and lined up inside the red outline (drawn from its own projected outline, so it fits exactly),
// and only on that frame its screen shows an Unspool ad. After each pass: a "SO CLOSE" freeze one frame off.
import * as THREE from "./three/three.module.js";
const FPS = 30, LOOP = 3.0, TC = 1.0, TCF = Math.round(TC * FPS);   // the one frame that counts
window.DUR = LOOP;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const outBack = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
await document.fonts.load("40px Arc");

// ---------- renderer, camera, world ----------
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(720, 1280, false); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 720 / 1280, 0.1, 400); camera.position.set(0, 0, 12); camera.lookAt(0, 0, 0);
const skyTex = (() => { const c = document.createElement("canvas"); c.width = 4; c.height = 512; const g = c.getContext("2d"), gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, "#3d9be9"); gr.addColorStop(0.65, "#a6dbff"); gr.addColorStop(1, "#e3f4ff"); g.fillStyle = gr; g.fillRect(0, 0, 4, 512); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
scene.background = skyTex;
scene.add(new THREE.HemisphereLight("#ffffff", "#7fb36a", 1.6));
const sun = new THREE.DirectionalLight("#fff4dd", 2.4); sun.position.set(6, 12, 10); sun.castShadow = true; scene.add(sun);
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.75, ...o });
const add = (geo, mat, x, y, z, parent = scene) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; };
// ground, a little school town, trees, a clock tower
add(new THREE.PlaneGeometry(400, 400), M("#86cf63"), 0, -7, -60).rotation.x = -Math.PI / 2;
add(new THREE.BoxGeometry(14, 6, 6), M("#f6c1d0"), 0, -4, -36);
const roof = add(new THREE.ConeGeometry(10.5, 4, 4), M("#e8743b"), 0, 1, -36); roof.rotation.y = Math.PI / 4; roof.scale.z = 0.6;
add(new THREE.BoxGeometry(4, 9, 4), M("#cbb5f0"), -11, -2.5, -38); add(new THREE.ConeGeometry(3.2, 4, 4), M("#8b5cf6"), -11, 4, -38).rotation.y = Math.PI / 4;
add(new THREE.BoxGeometry(4, 8, 4), M("#bde7ff"), 11, -3, -38); add(new THREE.ConeGeometry(3.2, 4, 4), M("#3a86d4"), 11, 3, -38).rotation.y = Math.PI / 4;
add(new THREE.BoxGeometry(3.4, 30, 3.4), M("#d9e3ee"), -17, 8, -60); add(new THREE.ConeGeometry(3, 6, 4), M("#7aa0c4"), -17, 26, -60).rotation.y = Math.PI / 4;
for (const [x, z] of [[-6, -26], [6, -26], [-15, -30], [15, -30], [-3, -46], [9, -48], [-22, -44], [22, -46]]) { add(new THREE.CylinderGeometry(0.3, 0.3, 2, 6), M("#7a5230"), x, -6, z); add(new THREE.IcosahedronGeometry(1.8, 0), M("#4caf50", { flatShading: true }), x, -4, z); }
const clouds = [[-9, 9, -40], [8, 13, -55], [14, 5, -30], [-14, 16, -70], [2, 19, -80]].map(([x, y, z], i) => { const g = new THREE.Group();
  for (let k = 0; k < 5; k++) add(new THREE.IcosahedronGeometry(1.6 + (k % 2) * 0.7, 1), M("#ffffff", { roughness: 1 }), (k - 2) * 1.6, Math.sin(k * 2) * 0.6, 0, g);
  g.position.set(x, y, z); g.userData.base = x; scene.add(g); return g; });

// ---------- the phone ----------
const PW = 2.2, PH = 4.4, PR = 0.32, PD = 0.28;
const shape = new THREE.Shape(); { const x = -PW / 2, y = -PH / 2;
  shape.moveTo(x + PR, y); shape.lineTo(x + PW - PR, y); shape.quadraticCurveTo(x + PW, y, x + PW, y + PR); shape.lineTo(x + PW, y + PH - PR); shape.quadraticCurveTo(x + PW, y + PH, x + PW - PR, y + PH);
  shape.lineTo(x + PR, y + PH); shape.quadraticCurveTo(x, y + PH, x, y + PH - PR); shape.lineTo(x, y + PR); shape.quadraticCurveTo(x, y, x + PR, y); }
const body = new THREE.ExtrudeGeometry(shape, { depth: PD, bevelEnabled: true, bevelSize: 0.04, bevelThickness: 0.04, bevelSegments: 2, curveSegments: 10 }); body.translate(0, 0, -PD / 2);
const phone = new THREE.Group(); scene.add(phone);
add(body, M("#16181f", { roughness: 0.35, metalness: 0.4 }), 0, 0, 0, phone);
const screenCanvas = (draw) => { const c = document.createElement("canvas"); c.width = 400; c.height = 820; draw(c.getContext("2d"), c.width, c.height); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
const reelImg = await new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = "mito.png"; });
const reelTex = screenCanvas((g, w, h) => { g.drawImage(reelImg, 0, 0, w, h); g.fillStyle = "rgba(0,0,0,.5)"; g.fillRect(0, 0, w, 50); g.fillStyle = "#fff"; g.font = "26px Arc"; g.textAlign = "center"; g.fillText("For You", w / 2, 34); });
const adTex = screenCanvas((g, w, h) => {   // only ever on screen for one frame: the prize for pausing it
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, "#1c3a2c"); gr.addColorStop(1, "#0f1d18"); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.textAlign = "center"; g.fillStyle = "#d3f05a"; g.font = "44px Arc"; g.fillText("YOU GOT IT!", w / 2, 120);
  g.fillStyle = "#e9f0e4"; g.font = "72px Arc"; g.fillText("unspool", w / 2, 300);
  g.font = "34px Arc"; g.fillStyle = "#cfe0d4"; ["Turn your notes", "into TikToks", "with a quiz."].forEach((l, i) => g.fillText(l, w / 2, 390 + i * 46));
  g.fillStyle = "#d3f05a"; g.beginPath(); g.roundRect(40, 590, w - 80, 96, 48); g.fill(); g.fillStyle = "#0f1d18"; g.font = "46px Arc"; g.fillText("unspool.cc", w / 2, 654);
  g.fillStyle = "#9db5a6"; g.font = "28px Arc"; g.fillText("First reel free", w / 2, 750); });
const screen = add(new THREE.PlaneGeometry(PW - 0.2, PH - 0.22), new THREE.MeshBasicMaterial({ map: reelTex }), 0, 0, PD / 2 + 0.045, phone);
const lens = add(new THREE.CircleGeometry(0.09, 16), new THREE.MeshBasicMaterial({ color: "#000" }), 0, PH / 2 - 0.2, PD / 2 + 0.05, phone);

// where it is at time t: dead centre, upright, facing you at TC; flying and spinning everywhere else
const C = new THREE.Vector3(0, 0.1, 0), V = new THREE.Vector3(-1.4, -14, 46), ACC = new THREE.Vector3(2.5, 9, 0);   // drops out of the sky, far away and small, then comes at you
function pose(t) { const d = t - TC;
  return { p: C.clone().addScaledVector(V, d).addScaledVector(ACC, d * d), r: new THREE.Euler(d * 4.6, d * -7.8, d * 5.4) }; }
const visible = (t) => t > TC - 0.8 && t < TC + 0.26;

// the red outline: the phone's own silhouette at TC, projected to the screen, plus a few pixels
phone.position.copy(C); phone.rotation.set(0, 0, 0); phone.updateMatrixWorld(true); camera.updateMatrixWorld(true);
const proj = (x, y) => { const v = new THREE.Vector3(x, y, PD / 2 + 0.04).applyMatrix4(phone.matrixWorld).project(camera); return [(v.x + 1) / 2 * 720, (1 - v.y) / 2 * 1280]; };
const [L0, T0] = proj(-PW / 2 - 0.04, PH / 2 + 0.04), [R0, B0] = proj(PW / 2 + 0.04, -PH / 2 - 0.04);
const PAD = 7, OL = L0 - PAD, OT = T0 - PAD, OR = R0 + PAD, OB = B0 + PAD, ORAD = (PR / PW) * (R0 - L0) + PAD;

// ---------- the 2D layer: heading, outline, SO CLOSE, a stick figure ----------
const ui = document.getElementById("ui").getContext("2d");
function outline(g, t) {   // a hand-drawn red outline, a hair of wobble, hugging the phone's silhouette
  g.save(); g.strokeStyle = "#ff2b2b"; g.lineWidth = 11; g.lineJoin = g.lineCap = "round"; g.shadowColor = "rgba(0,0,0,.25)"; g.shadowBlur = 6;
  const pts = [], n = 120, w = OR - OL, h = OB - OT, r = ORAD, per = 2 * (w + h - 4 * r) + 2 * Math.PI * r;
  for (let i = 0; i <= n; i++) { let s = (i / n) * per, x, y; const segs = [w - 2 * r, Math.PI * r / 2, h - 2 * r, Math.PI * r / 2, w - 2 * r, Math.PI * r / 2, h - 2 * r, Math.PI * r / 2];
    let k = 0; while (k < 7 && s > segs[k]) { s -= segs[k]; k++; }
    const a = s / r; switch (k) {
      case 0: x = OL + r + s; y = OT; break; case 1: x = OR - r + Math.sin(a) * r; y = OT + r - Math.cos(a) * r; break;
      case 2: x = OR; y = OT + r + s; break; case 3: x = OR - r + Math.cos(a) * r; y = OB - r + Math.sin(a) * r; break;
      case 4: x = OR - r - s; y = OB; break; case 5: x = OL + r - Math.sin(a) * r; y = OB - r + Math.cos(a) * r; break;
      case 6: x = OL; y = OB - r - s; break; default: x = OL + r - Math.cos(a) * r; y = OT + r - Math.sin(a) * r; }
    const wob = Math.sin(i * 0.9) * 1.6 + Math.sin(i * 2.3) * 0.9; pts.push([x + wob, y - wob * 0.6]); }
  g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.stroke();
  g.beginPath(); g.moveTo(OR - 4, OT - 6); g.quadraticCurveTo(OR + 18, OT - 2, OR + 10, OT + 22); g.stroke(); g.restore(); }
function strokeText(g, txt, x, y, size, fill = "#fff", sw = 8, rot = 0) {
  g.save(); g.translate(x, y); g.rotate(rot); g.font = `${size}px Arc`; g.textAlign = "center"; g.lineJoin = "round";
  g.lineWidth = sw; g.strokeStyle = "#14121c"; g.strokeText(txt, 0, 0); g.fillStyle = fill; g.fillText(txt, 0, 0); g.restore(); }
function heading(g) {
  g.save(); g.font = "46px Arc"; g.textAlign = "center"; g.shadowColor = "rgba(0,0,0,.35)"; g.shadowOffsetY = 3; g.shadowBlur = 8; g.fillStyle = "#fff";
  const a = "Only ", b = "1%", c = " can pause it", wa = g.measureText(a).width, wb = g.measureText(b).width, wc = g.measureText(c).width, x0 = 360 - (wa + wb + wc) / 2;
  g.textAlign = "left"; g.fillText(a, x0, 92); g.fillStyle = "#ffd23f"; g.fillText(b, x0 + wa, 92); g.fillStyle = "#fff"; g.fillText(c, x0 + wa + wb, 92);
  g.textAlign = "center"; g.fillText("in the frame!", 360, 146); g.restore(); }
function stick(g, t, mood) {   // a watcher in the corner
  const x = 610, y = 1238 - (mood === "close" ? Math.abs(Math.sin(t * 18)) * 10 : 0), s = 0.72;
  g.save(); g.translate(x, y); g.scale(s, s); g.lineCap = "round"; g.strokeStyle = "#14121c"; g.lineWidth = 10;
  g.beginPath(); g.moveTo(-12, -100); g.lineTo(-18, 0); g.moveTo(12, -100); g.lineTo(18, 0); g.stroke();
  g.beginPath(); if (mood === "close") { g.moveTo(-30, -150); g.lineTo(-56, -214); g.moveTo(30, -150); g.lineTo(56, -214); } else { g.moveTo(-30, -150); g.lineTo(-44, -90); g.moveTo(30, -150); g.lineTo(44, -90); } g.stroke();
  g.fillStyle = "#1d1b26"; g.beginPath(); g.moveTo(-34, -198); g.lineTo(34, -198); g.lineTo(40, -96); g.lineTo(-40, -96); g.closePath(); g.fill(); g.stroke();
  g.fillStyle = "#fff"; g.lineWidth = 6; g.beginPath(); g.arc(0, -250, 46, 0, 7); g.fill(); g.stroke();
  g.fillStyle = "#14121c"; g.beginPath(); g.moveTo(-4, -296); g.quadraticCurveTo(-2, -324, 16, -318); g.quadraticCurveTo(2, -312, 6, -296); g.fill();
  if (mood === "close") { g.lineWidth = 4; g.fillStyle = "#fff"; for (const ex of [-15, 15]) { g.beginPath(); g.arc(ex, -256, 10, 0, 7); g.fill(); g.stroke(); g.fillStyle = "#14121c"; g.beginPath(); g.arc(ex, -256, 3.5, 0, 7); g.fill(); g.fillStyle = "#fff"; }
    g.fillStyle = "#7a2230"; g.beginPath(); g.ellipse(0, -228, 8, 11, 0, 0, 7); g.fill(); }
  else { g.fillStyle = "#14121c"; for (const ex of [-15, 15]) { g.beginPath(); g.arc(ex, -254, 5, 0, 7); g.fill(); } g.lineWidth = 5; g.beginPath(); g.moveTo(-8, -232); g.lineTo(8, -232); g.stroke(); }
  g.restore(); }

window.renderAt = (t) => {
  t = ((t % LOOP) + LOOP) % LOOP; const f = Math.round(t * FPS);
  clouds.forEach((c, i) => { c.position.x = c.userData.base + Math.sin((t / LOOP) * Math.PI * 2 + i) * 0.8; });   // loops cleanly
  const freezeK = t - (TC + 0.36);                 // after the pass: SO CLOSE, frozen one frame off
  const frozen = freezeK > 0 && freezeK < 1.0;
  if (frozen) { const q = pose(TC + 1 / FPS); phone.position.copy(q.p); phone.rotation.copy(q.r); phone.visible = true; screen.material.map = reelTex; }
  else { const q = pose(t); phone.position.copy(q.p); phone.rotation.copy(q.r); phone.visible = visible(t); screen.material.map = f === TCF ? adTex : reelTex; }
  renderer.render(scene, camera);
  const g = ui; g.clearRect(0, 0, 720, 1280);
  heading(g); outline(g, t);
  if (frozen) { const k = freezeK;
    g.fillStyle = `rgba(255,255,255,${Math.max(0, 1 - k / 0.1) * 0.6})`; g.fillRect(0, 0, 720, 1280);
    const s = outBack(k / 0.25), a = clamp(k * 4) * clamp((1.0 - k) / 0.12);
    g.save(); g.globalAlpha = a; g.translate(360, OB + 92); g.scale(s, s); strokeText(g, "SO CLOSE 😬", 0, 0, 72, "#fff", 10, -0.08); strokeText(g, "1 frame off!", 0, 64, 40, "#ffd23f", 8, -0.08); g.restore(); }
  stick(g, t, frozen ? "close" : "watch");
};
window.renderAt(0); setTimeout(() => (window.ready = true), 60);
</script></body></html>
